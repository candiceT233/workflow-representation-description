# =============================================================================
# WIDGET — Deployment Definition Document (DDD) Agent Template
# Schema: ddd-4.0  |  Architecture Design: v4
#
# PURPOSE
# The DDD defines how a workflow is deployed to achieve a specific set of
# goals on specific hardware. It bridges WRD logical structure, GD intent,
# and HRD physical constraints into a concrete execution strategy.
#
# The DDD is the primary artifact produced by a WIDGET prescription agent.
# Every decision records both WHAT was decided and WHY (via goal_ref).
# A DDD without goal_refs is incomplete — the agent must not emit one.
#
# A single WRD can have multiple DDDs representing different strategies
# (e.g., throughput_optimized, cost_optimized, latency_optimized).
# Each DDD is a separate, self-contained, versioned document.
#
# WHO FILLS THIS DOCUMENT
# Primarily the AI prescription agent, given WRD + GD + HRD as inputs.
# The agent fills all required_agent fields through reasoning.
# required_agent_ask fields are filled after the agent presents a proposed
# value and the operator confirms or overrides.
# auto_validated fields are computed checks — never manually set.
#
# FIELD STATUS LEGEND
#   required_agent        Agent derives from WRD + GD + HRD reasoning.
#                         No operator input needed unless confidence is low.
#
#   required_agent_ask    Agent proposes a value; operator must confirm or
#                         override before the DDD is finalized. Present
#                         proposed values with brief rationale.
#
#   auto_validated        Agent computes as a consistency/feasibility check.
#                         Never manually specified. A DDD with a failed
#                         auto_validated field must not be submitted.
#
# AGENT REASONING PROTOCOL
# Before filling any section, the agent must:
#   1. Read the full WRD (all sections)
#   2. Read the full GD (all goals and hard constraints)
#   3. Read the full HRD (all storage tiers, compute topology, network fabric)
#   4. Identify which GD goals are hard (must satisfy) vs soft (optimize)
#   5. For each hard constraint, identify which WRD entities it applies to
#   6. Derive a candidate strategy name from the dominant soft goal
#   7. Fill sections in order: header → parallelism → storage → placement
#      → pipelining → replication → validation
#
# AGENT READINESS GATE
# Before handing this DDD to Jarvis-MCP for deployment:
#   [ ] All required_agent fields non-null
#   [ ] All required_agent_ask fields confirmed by operator
#   [ ] Every task in WRD task_registry has a parallelism entry
#   [ ] Every dataset in WRD data_flow.semantic has a storage tier assignment
#   [ ] Every goal_ref references a valid goal_id from the GD
#   [ ] validation_summary.validation_status == "valid"
#   [ ] No hard_constraint_check has status == "fail"
#   [ ] No capacity_check has status == "fail"
#   [ ] No bandwidth_check has status == "fail"
#
# ID NAMESPACE
#   DDD:   deploy:<wrd_lineage_id_short>:<strategy_name>
#   (All task:, data:, pc:, tier:, compute:, goal: IDs are referenced
#    from their respective source documents — never redefined here.)
# =============================================================================


# -----------------------------------------------------------------------------
# SECTION 1: HEADER
# -----------------------------------------------------------------------------
header:

  ddd_id:
    _status: auto_validated
    _extract: >
      Format: deploy:<first_8_chars_of_wrd_lineage_id>:<strategy_name>
      Example: deploy:f3a9c2e1:throughput_optimized
    _value: null

  strategy_name:
    _status: required_agent_ask
    _reasoning: >
      Derive from the highest-priority soft goal in the GD.
      Examples:
        Primary goal is throughput  → "throughput_optimized"
        Primary goal is cost        → "cost_optimized"
        Primary goal is latency     → "latency_optimized"
        Balanced, no dominant goal  → "balanced"
      Present to operator: "I propose naming this deployment strategy
      '<derived_name>' based on your primary goal of '<goal_description>'.
      Does this name accurately describe the intent?"
    _value: null

  wrd_lineage_id:
    _status: required_agent
    _extract: Copied from WRD header.workflow_lineage_id.
    _value: null

  wrd_version:
    _status: required_agent
    _extract: >
      Copied from WRD header.version. If WRD version changes after this DDD
      is generated, this DDD must be re-validated before reuse.
    _value: null

  hrd_id:
    _status: required_agent
    _extract: Copied from HRD header.hrd_id.
    _value: null

  hrd_version:
    _status: required_agent
    _extract: Copied from HRD header.version.
    _value: null

  gd_id:
    _status: required_agent
    _extract: Copied from GD header.gd_id.
    _value: null

  execution_profile:
    _status: required_agent_ask
    _reasoning: >
      Look at WRD execution_profiles. If the GD specifies a partial run
      (e.g., only through stage 3), select the matching profile.
      Default to profile:full if no partial run is indicated.
      Present to operator: "I will generate a deployment for the
      '<profile_name>' execution profile, which runs tasks:
      {required_task_set}. Is this correct?"
    _value: null

  generated_by:
    _status: required_agent
    _extract: Agent name, version, and timestamp.
    _value: null

  generated_at:
    _status: required_agent
    _extract: ISO 8601 timestamp.
    _value: null

  schema_version:
    _status: required_agent
    _value: "ddd-4.0"

  description:
    _status: required_agent
    _reasoning: >
      Write 2-4 sentences summarizing: which GD goals drive this strategy,
      what the primary deployment tradeoffs are, and what hardware this
      targets. Example:
      "Throughput-optimized deployment for the storm tracking workflow
      targeting Perlmutter. Designed to meet the 10 GB/s sustained ingestion
      goal (goal:throughput_10gbs) within the 256-node allocation limit
      (goal:max_nodes_256). Burst buffer is used for intermediate datasets
      to reduce PFS contention; checkpoints are written to PFS per the
      must_use_pfs_for_checkpoints constraint."
    _value: null


# -----------------------------------------------------------------------------
# SECTION 2: PER-TASK PARALLELISM
# One entry per task in the WRD task_registry for the chosen execution profile.
# Agent reasons from: WRD task type, io_dominance, loop annotations,
# pc_pattern on edges, GD throughput/latency goals, HRD node count limits.
# -----------------------------------------------------------------------------
per_task_parallelism:
  # Agent populates as a list of entries matching _task_parallelism_schema.
  # Include every task in the WRD execution_profile.required_task_set.

  _agent_reasoning_protocol: >
    For each task, reason as follows:
    1. READ from WRD: task_type, io_dominance, loop_annotation,
       temporal_io_annotation, relationships[*].pc_pattern
    2. READ from GD: primary soft goal (throughput vs latency vs cost)
    3. READ from HRD: compute_id options, node_count limits
    4. COMPUTE:
       - io_bound tasks: scale instances to maximize bandwidth utilization.
         Target: (peak_tier_bandwidth / expected_per_instance_bandwidth).
         Cross-check against HRD tier contention_model.
       - compute_bound tasks: scale based on wall-time target and problem size.
       - parameter_sweep loops: set instances = sweep parameter set size
         (or GD max_nodes limit if sweep is larger).
       - convergence loops: set instances = 1 unless parallelizable within
         each iteration.
    5. For every decision, record goal_ref pointing to the GD goal that
       most directly motivated the choice.

  _task_parallelism_schema:

    task_id:
      _status: required_agent
      _extract: task_id from WRD task_registry.
      _value: null

    parallelism_instances:
      _status: required_agent
      _reasoning: >
        Number of concurrent instances of this task.
        For loop tasks: how many iterations run concurrently.
        For non-loop tasks: typically 1 unless the task has 1_to_n or
        n_to_1 edges suggesting parallelism.
      _value: null

    ranks_per_instance:
      _status: required_agent
      _reasoning: >
        MPI ranks per instance. Derive from: typical MPI configuration in
        the workflow source, HRD cores_per_node, and io_dominance.
        For io_bound tasks: fewer ranks per node to reduce I/O serialization.
        For compute_bound tasks: fill the node (cores_per_node ranks).
      _value: null

    threads_per_rank:
      _status: required_agent
      _reasoning: >
        OpenMP threads per MPI rank. Derive from: HRD hardware_threads_per_core,
        and whether the task benefits from shared-memory parallelism.
        Default to 1 if no threading evidence in workflow source.
      _value: null

    compute_resource:
      _status: required_agent
      _reasoning: >
        Which HRD compute_id to use for this task.
        If accelerators are present and the task is compute_bound, prefer
        compute:gpu_node. If the task is io_bound, prefer compute:cpu_node.
        Cross-reference with GD hard constraints for any placement restrictions.
      _value: null

    total_nodes_required:
      _status: auto_validated
      _extract: >
        COMPUTED: ceil(parallelism_instances * ranks_per_instance /
                       HRD[compute_resource].cores_per_node)
        Cross-check: total_nodes_required must not exceed GD goal:max_nodes
        constraint if present.
      _value: null

    goal_ref:
      _status: required_agent
      _extract: >
        The goal_id from GD that most directly motivated this parallelism
        choice. Every entry must have a goal_ref — entries without one are
        flagged as incomplete.
      _value: null

    rationale:
      _status: required_agent
      _reasoning: >
        1-2 sentence explanation of why this parallelism was chosen.
        Must reference the WRD fields that informed the reasoning.
        Example: "task:detect_cyclones is io_bound (WRD io_dominance=io_bound)
        with 1_to_n fan-out from preprocess. 64 instances saturate the burst
        buffer bandwidth (goal:throughput_10gbs) within the node allocation
        limit (goal:max_nodes_256)."
      _value: null


# -----------------------------------------------------------------------------
# SECTION 3: STORAGE TIER ASSIGNMENTS
# One entry per dataset in WRD data_flow.semantic for the chosen profile.
# Agent reasons from: WRD dataset role, lifecycle, access_frequency_class,
# pc_pattern; GD data_placement constraints; HRD tier capacities and
# persistence; GD reliability goals.
# -----------------------------------------------------------------------------
storage_tier_assignments:

  _agent_reasoning_protocol: >
    For each dataset, reason as follows:
    1. READ from WRD: role (input/intermediate/checkpoint), retention_window,
       access_frequency_class, consumer_count, size_measured_bytes (if available),
       pc_pattern, format_internals
    2. READ from GD: hard_constraints (any data_placement restrictions),
       reliability goals (any replication requirements)
    3. READ from HRD: available tiers, persistence, capacity, contention_model
    4. ASSIGN:
       checkpoint datasets → persistent tier (GD typically requires PFS;
                             check hard_constraints first)
       intermediate datasets, high-access (few_times or repeatedly) → 
                             burst_buffer or node_local_ssd if available and
                             non-contended; else PFS
       intermediate datasets, single-access (once), large → PFS directly
                             (no benefit from staging)
       input datasets → PFS or object_store (already there at job start;
                        stage to burst_buffer if access_frequency > once)
    5. Compute feasibility_check against HRD tier capacity.

  _dataset_assignment_schema:

    dataset_id:
      _status: required_agent
      _extract: dataset_id from WRD data_flow.semantic.
      _value: null

    assigned_tier:
      _status: required_agent
      _reasoning: >
        tier_id from HRD storage_hierarchy. Must exist in HRD — never use
        a tier_id not defined in the target HRD.
      _value: null

    cleanup_policy:
      _status: required_agent
      _reasoning: >
        after_last_consumer:  delete after task identified by WRD
                              last_consumer_phase completes. Use for
                              intermediate datasets on volatile tiers.
        end_of_job:           delete at job end. Use for intermediates on
                              semi_persistent tiers.
        retain_indefinitely:  never delete. Use for checkpoint datasets.
      _allowed_values: [after_last_consumer, end_of_job, retain_indefinitely]
      _value: null

    replication:
      _status: required_agent
      _reasoning: >
        Set to true for checkpoint datasets if GD has a reliability goal
        or replication hard_constraint. Set to false for intermediates.
      _value: null    # boolean

    caching_policy:
      _status: required_agent
      _reasoning: >
        none:              single access, no benefit from caching
        cache_on_first_read: multiple consumers; cache after first read
                            (use when WRD access_frequency_class = few_times)
        prefetch:          stage from cold storage before task starts
                           (use when access_frequency_class = repeatedly
                            and staging latency would otherwise be on
                            the critical path)
      _allowed_values: [none, cache_on_first_read, prefetch]
      _value: null

    goal_ref:
      _status: required_agent
      _extract: >
        The goal_id that motivated this tier assignment.
        Typically: a data_placement hard_constraint, a throughput goal
        (fast tier chosen to meet bandwidth target), or a reliability goal
        (persistent tier chosen for checkpoint).
      _value: null

    rationale:
      _status: required_agent
      _reasoning: >
        1-2 sentences. Reference WRD dataset properties and GD goals.
        Example: "data:era5_raw is an external input read once by
        task:preprocess_era5 (WRD access_frequency=once). No staging
        benefit; assign directly to tier:pfs to avoid wasting burst buffer
        capacity for data that will not be reused."
      _value: null

    feasibility_check:
      _status: auto_validated
      _extract: >
        COMPUTED:
        If WRD size_measured_bytes is available:
          Compare sum of all datasets on this tier (in bytes) against
          HRD per_job_capacity_tb (converted to bytes).
          pass:    total < 80% of per_job_capacity_tb
          warning: total between 80% and 100% of per_job_capacity_tb
          fail:    total > per_job_capacity_tb
        If WRD size_measured_bytes is unavailable:
          Set to "unavailable — first run required"
      _allowed_values: [pass, warning, fail, unavailable]
      _value: null


# -----------------------------------------------------------------------------
# SECTION 4: TASK PLACEMENT AND CO-SCHEDULING
# Groups of tasks that should be co-located or overlapped in time.
# Agent derives from WRD co_scheduling_hint on relationships and
# temporal_io_annotation overlap_potential.
# -----------------------------------------------------------------------------
task_placement:
  # Agent populates as a list of placement group entries.
  # If WRD has no edges with co_scheduling_hint = beneficial, this list
  # may be empty.

  _agent_reasoning_protocol: >
    For each data_dependency edge where WRD co_scheduling_hint = beneficial:
      - Create a co-location group containing the producer and consumer tasks
      - Set placement_policy = co_locate
      - Set co_schedule = true if both tasks have high overlap_potential
    For tasks with co_scheduling_hint = harmful:
      - Create a spread group to explicitly separate them
    Skip edges with co_scheduling_hint = neutral or unknown.

  _placement_group_schema:

    group_id:
      _status: required_agent
      _format: "pg:<descriptor>"
      _value: null

    tasks:
      _status: required_agent
      _extract: List of task_id values to co-locate or spread.
      _value: []

    placement_policy:
      _status: required_agent
      _allowed_values: [co_locate, spread, no_constraint]
      _value: null

    co_schedule:
      _status: required_agent
      _reasoning: >
        true: these tasks should overlap in wall-clock time.
              Only valid if all tasks in the group have sufficient
              parallelism_instances to run concurrently.
        false: co-locate for data proximity but execute sequentially.
      _value: null    # boolean

    goal_ref:
      _status: required_agent
      _reasoning: >
        The GD goal this placement decision serves.
        Typically a throughput or latency goal (co-location reduces
        data movement time on the critical path).
      _value: null

    rationale:
      _status: required_agent
      _reasoning: >
        Reference the WRD co_scheduling_hint and pc_pattern that motivated
        this grouping. Example: "task:detect_cyclones and task:build_tracks
        share a 1_to_n edge with co_scheduling_hint=beneficial (WRD).
        Co-locating keeps per-storm output files in node-local SSD,
        avoiding PFS round-trips between these stages."
      _value: null


# -----------------------------------------------------------------------------
# SECTION 5: STAGE ORDERING AND PIPELINING
# Decisions about whether workflow stages overlap in time.
# Agent derives from WRD workflow_pattern and temporal_io_annotation.
# -----------------------------------------------------------------------------
pipelining:
  # Agent populates if workflow_pattern is pipeline or cascading.
  # For scatter_gather and iterative workflows, pipelining is typically
  # handled by parallelism_instances, not by overlapping stages.

  _agent_reasoning_protocol: >
    Relevant when WRD workflow_pattern = pipeline or cascading.
    For each consecutive stage pair where:
      - upstream task temporal_io_annotation.io_phase = deferred (writes
        only after compute)
      - downstream task temporal_io_annotation.io_phase = upfront (reads
        before compute)
    The downstream task cannot start until the upstream task writes outputs.
    Pipeline overlap is only beneficial when:
      - upstream task produces output in chunks (streaming)
      - downstream task can start processing as soon as first chunk arrives
    If pipeline overlap is not beneficial, set overlap_strategy = sequential
    and document why.

  _pipeline_group_schema:

    pipeline_group_id:
      _status: required_agent
      _format: "pipe:<descriptor>"
      _value: null

    tasks:
      _status: required_agent
      _extract: >
        Ordered list of task_ids forming this pipeline stage sequence.
        Must be in topological order.
      _value: []

    overlap_strategy:
      _status: required_agent
      _allowed_values: [full_overlap, partial_overlap, sequential]
      _reasoning: >
        full_overlap:    all stages run simultaneously on different data
                         chunks. Requires all tasks to support streaming I/O.
        partial_overlap: some stages overlap; others must wait for
                         completion (e.g., a deferred-write task blocks
                         the next stage).
        sequential:      no pipeline overlap. Each stage completes before
                         the next starts. Use when data volume is small
                         enough that latency is not a concern.
      _value: null

    batch_size:
      _status: required_agent
      _reasoning: >
        For full_overlap or partial_overlap: how many data items (files,
        timesteps, ensemble members) are in each pipeline cycle.
        Derive from: WRD loop parameter_ref size if known, or HRD
        burst_buffer per_job_capacity relative to dataset sizes.
        Null for sequential strategies.
      _value: null

    goal_ref:
      _status: required_agent
      _value: null

    rationale:
      _status: required_agent
      _value: null


# -----------------------------------------------------------------------------
# SECTION 6: REPLICATION AND CACHING STRATEGY
# Global defaults for policies not covered by per-dataset assignments.
# -----------------------------------------------------------------------------
replication_and_caching:

  global_replication_factor:
    _status: required_agent
    _reasoning: >
      Default replication factor for checkpoint datasets that do not have
      an explicit storage_tier_assignment with replication = true.
      1 = no replication. 2+ = fault-tolerant copies.
      Derive from GD reliability goals. Default to 1 if no reliability
      goal is present.
    _value: null

  checkpoint_interval:
    _status: required_agent
    _reasoning: >
      For iterative workflows (WRD workflow_pattern = iterative or hybrid
      with iterative stages): how frequently to write checkpoints,
      expressed as every N iterations.
      Derive from: GD reliability goals, loop max_iterations_guard,
      and estimated per-iteration wall time relative to failure probability.
      Null for non-iterative workflows.
    _value: null

  cache_warm_strategy:
    _status: required_agent_ask
    _reasoning: >
      Should burst buffer or node-local storage be pre-populated with input
      data before the job starts?
      Relevant when:
        - Input datasets are large and on slow storage (PFS or object_store)
        - First tasks are io_bound with upfront io_phase
        - GD has a latency goal sensitive to time-to-first-result
      Present to operator: "Input datasets are on tier:pfs (peak read
      <HRD.pfs.peak_read_bandwidth_gbs> GB/s). Pre-staging to tier:burst_buffer
      before job start would reduce initial I/O latency but adds
      ~{estimated_staging_time} minutes of setup time. Should I plan for
      pre-staging? (yes/no/auto)"
    _allowed_values: [yes, no, auto]
    _value: null

  goal_ref:
    _status: required_agent
    _reasoning: >
      The GD goal motivating global replication and caching defaults.
      Typically a reliability goal or latency goal.
    _value: null


# -----------------------------------------------------------------------------
# SECTION 7: DDD VALIDATION SUMMARY
# Auto-computed consistency and feasibility checks against GD and HRD.
# NEVER manually specified. A DDD with validation_status != valid must not
# be submitted for deployment.
# -----------------------------------------------------------------------------
validation_summary:

  validation_status:
    _status: auto_validated
    _extract: >
      COMPUTED from all checks below:
        valid:    all hard_constraint_checks pass, no capacity_checks fail,
                  no bandwidth_checks fail
        warnings: all hard constraints pass, but some capacity or bandwidth
                  checks are in warning state
        invalid:  one or more hard_constraint_checks fail, OR one or more
                  capacity or bandwidth checks fail
    _allowed_values: [valid, warnings, invalid]
    _value: null

  hard_constraint_checks:
    _status: auto_validated
    _extract: >
      For each entry in GD hard_constraints:
        constraint_id: <gd constraint_id>
        status: pass | fail
        evidence: which DDD decision satisfies or violates this constraint
      Example:
        - constraint_id: goal:must_use_pfs_for_checkpoints
          status: pass
          evidence: "All datasets with role=checkpoint assigned to tier:pfs
                     (data:storm_catalog, data:track_archive)"
    _value: []

  capacity_checks:
    _status: auto_validated
    _extract: >
      For each tier used in storage_tier_assignments:
        tier_id: <tier_id>
        total_assigned_gb: sum of size_measured_bytes for all datasets
                           assigned to this tier (null if sizes unavailable)
        tier_capacity_gb: HRD per_job_capacity_tb * 1024
        status: pass | warning | fail | unavailable
        note: if sizes unavailable, note that first run is required
    _value: []

  bandwidth_checks:
    _status: auto_validated
    _extract: >
      For each data_dependency edge in WRD execution_graph where the
      assigned storage tier is the transfer path:
        pc_edge_id: <pc edge id>
        required_bandwidth_gbs: estimate from WRD data_volume_class and
                                 GD throughput goal timeline
        tier_peak_bandwidth_gbs: HRD peak_read_bandwidth_gbs or
                                  peak_write_bandwidth_gbs for assigned tier
        effective_bandwidth_gbs: tier_peak * HRD contention_model.degradation_factor
                                  (if shared_across_jobs = true)
        status: pass | warning | fail
          pass:    required_bandwidth < effective_bandwidth * 0.8
          warning: required_bandwidth between 80% and 100% of effective
          fail:    required_bandwidth > effective_bandwidth
    _value: []

  validation_notes:
    _status: required_agent
    _reasoning: >
      Free-text notes on any warnings or borderline checks.
      If validation_status = valid and no warnings, write "All checks passed."
      If warnings exist, describe what the operator should monitor at runtime.
      If invalid, describe which constraints are violated and what
      changes to the WRD, GD, or hardware assumptions would resolve them.
    _value: null