# =============================================================================
# WIDGET — Experiment Definition Document (EDD) Agent Template
# Schema: edd-2.0  |  Architecture Design: v7
# See WIDGET_conventions.md for ID namespace and field status codes.
#
# PURPOSE
# The EDD resolves the experiment-specific unknowns that the WDD annotates
# but cannot resolve from static analysis. It is generated in two phases:
#
#   Phase 1 — STATIC (generated alongside the WDD from code analysis):
#     What parameters exist, what they control, what values are possible.
#     Stable across all experiments on this workflow.
#
#   Phase 2 — INSTANCE (filled by scientist before each submission):
#     Concrete parameter values, resolved cardinalities, selected execution
#     path, hardware floor, environment modules, software dependencies.
#
# RELATIONSHIP:  EDD = f(WDD, scientist_input)
#
# COMPLETENESS GATE — EDD is ready for DDD generation when:
#   [ ] All required_static fields are non-null
#   [ ] All required_instance fields are non-null
#   [ ] All required_derived fields are computed
#   [ ] No experiment_parameters[*].validation_check == "fail"
#   [ ] resolved_cardinalities has one entry per data object with
#       cardinality_source.type != fixed in the WDD
#   [ ] hardware_floor computed from resolved parameter values
#   [ ] target_system matches an available HRD
#   [ ] environment.required_modules is non-null (may be empty list [])
#
# VERSIONING
#   experiment_lineage_id  Stable UUID for a given experiment configuration.
#   version                Semantic version. Increment when parameters change.
#   instance_id            Unique per submission. Links to IODD run records.
#                          Use Slurm job ID if available; else generate UUID.
# =============================================================================


# -----------------------------------------------------------------------------
# METADATA
# -----------------------------------------------------------------------------
metadata:

  experiment_lineage_id:
    # [required_instance]
    # Prompt: "Is this a new experiment configuration (new UUID needed), or
    # a re-run of an existing one (provide existing lineage_id)?"
    # Generate UUID v4 for new; preserve for re-runs with same parameters.
    _value: null

  version:
    # [required_instance]
    # "1.0.0" for first creation. Increment minor when resolved_values change
    # significantly; patch for minor corrections.
    _value: null

  version_notes:
    # [required_instance] Describe what this version represents.
    _value: null

  instance_id:
    # [required_instance]
    # Fresh UUID (or Slurm job ID) for EVERY new submission.
    # This field links EDD instances to IODD run records.
    _value: null

  wrd_lineage_id:
    # [required_static] Copied from WDD metadata.workflow_lineage_id.
    _value: null

  wrd_version:
    # [required_static] Copied from WDD metadata.version at EDD compile time.
    _value: null

  schema_version: "edd-2.0"
  # [required_static]

  experiment_name:
    # [required_instance] Short descriptive name. snake_case, no spaces.
    # Examples: "1000_genomes_chr1_22_full", "ddmd_12sim_40gpu"
    _value: null

  experiment_description:
    # [required_instance] 2–4 sentences: scientific question, distinguishing
    # features, input data. Quality check: >20 words.
    _value: null

  submitted_by:
    # [required_instance] Name and affiliation.
    _value: null

  submitted_at:
    # [required_instance] ISO 8601 timestamp at EDD instance creation.
    _value: null

  generated_by:
    # [required_static] Agent that populated the static phase.
    _value: null


# -----------------------------------------------------------------------------
# SECTION A: EXPERIMENT PARAMETER CATALOG
# One entry per configurable parameter discovered during static analysis.
#
# WHAT COUNTS AS AN EXPERIMENT PARAMETER?
# Parameters that affect the STRUCTURE of workflow execution:
#   - Number of task instances spawned (affects cardinality)
#   - Which datasets are processed (affects data flow scope)
#   - Which execution path is taken (cpu vs. gpu, large vs. small model)
#   - What files are consumed or produced (input/output paths)
#
# Does NOT include purely scientific tuning parameters that don't affect
# data flow structure (e.g., optimizer learning rate, convergence tolerance).
#
# DISCOVERY PROTOCOL (Phase 1 — static):
#   1. Scan all config files (*.yaml, *.json, *.cfg, *.ini, *.toml, run_*.sh)
#   2. Scan argparse definitions in Python scripts
#   3. Scan os.environ.get() and os.getenv() calls
#   4. Cross-reference against WDD cardinality_source.controlling_parameter
#      and hardware_path.execution_alternatives to identify structural params
# -----------------------------------------------------------------------------
experiment_parameters:

  - parameter_id: "param:<descriptor>"
    # [required_static] snake_case label matching the parameter name in source.

    display_name: "<human-readable name>"
    # [required_static]

    source_file: "<relative path to file where parameter is defined>"
    # [required_static]

    source_location: "<file:line or argparse argument name>"
    # [required_static]

    parameter_type: "<integer | float | string | boolean | path | list>"
    # [required_static]

    possible_values: |
      <Range or enumeration if statically determinable.
      E.g., "integers 1–22", "values in [1, 4, 8, 16, 32]", "any positive integer",
      "unconstrained".>
    # [required_static]

    default_value: "<default as it appears in source, or null if no default>"
    # [required_static]

    affects:
      cardinalities:
        - "<data_id whose cardinality this parameter controls>"
      # [required_static] Cross-ref from WDD cardinality_source.controlling_parameter.

      hardware_paths:
        - "<task_id whose execution path this parameter selects>"
      # [required_static] Cross-ref from WDD hardware_path.execution_alternatives.

      data_objects_in_scope:
        - "<data_id that is included or excluded based on this parameter>"
      # [required_static] For parameters that gate entire data flows.
      # E.g., if RUN_ONLY_CHR1=true skips chr2–22 data objects, list them here.

    resolved_value: "<value the scientist provides for this experiment instance>"
    # [required_instance]
    # Prompt: "Parameter '{parameter_id}' (from {source_file}) controls
    # {affects summary}. Allowed values: {possible_values}. Default: {default_value}.
    # What value should be used for this experiment?"

    validation_check: "<pass | fail | skipped>"
    # [required_derived]
    # pass:    resolved_value is consistent with possible_values and parameter_type
    # fail:    out of range or wrong type
    # skipped: possible_values = "unconstrained"


# -----------------------------------------------------------------------------
# SECTION B: RESOLVED CARDINALITIES
# Concrete instance counts for every data object with non-fixed cardinality.
# Fixed-cardinality objects are omitted — their count is in the WDD.
# -----------------------------------------------------------------------------
resolved_cardinalities:

  - data_id: "<data_id from WDD data_objects>"
    # [required_derived]

    wrd_cardinality_source_type: "<config_determined | runtime_determined>"
    # [required_derived] Copied from WDD data_objects[data_id].cardinality_source.type.

    resolved_count: <integer>
    # [required_derived] for config_determined (from resolved_value of controlling_parameter)
    # [required_instance] for runtime_determined (scientist provides, or agent scans input_data_root)

    resolved_count_basis: |
      <How was this count obtained?
      config_determined:           "param:n_simulations resolved_value = 12 → 12 instances."
      runtime_determined (scan):   "Directory scan of /input/chromosomes/ → 22 FASTA files."
      runtime_determined (manual): "Provided by scientist: 22 chromosomes in this dataset.">
    # [required_derived / required_instance]

    estimated_total_size: |
      <COMPUTED: WDD estimated_size_hint × resolved_count.
      E.g., "12 × ~100 MB = ~1.2 GB total."
      Write "unknown" if WDD estimated_size_hint = "unknown".>
    # [required_derived] Primary input to DDD capacity feasibility checks.


# -----------------------------------------------------------------------------
# SECTION C: HARDWARE RESOLUTION
# Resolves WDD hardware_path annotations into concrete choices.
# C.1 — execution path selections per task
# C.2 — hardware floor (minimum resources for this experiment)
# The DDD must satisfy all hardware_floor entries within the HRD envelope.
# -----------------------------------------------------------------------------
hardware_resolution:

  # C.1: Execution Path Selections
  # One entry per task where WDD hardware_path.has_conditional_execution = true.
  path_selections:

    - task_id: "<task_id from WDD tasks>"
      # [required_derived]

      available_paths:
        - "<path_id from WDD hardware_path.execution_alternatives>"
      # [required_derived] Presented to scientist for selection.

      selected_path_id: "<path_id>"
      # [required_instance]
      # Prompt: "Task '{task_id}' has execution paths: {available_paths_with_descriptions}.
      # Target system: {target_system}. Which path should be used?"

      selection_basis: |
        <Why this path was selected.
        E.g., "GPU nodes available and n_simulations=12 warrants GPU acceleration."
        Or "CPU-only target system; gpu_path not available.">
      # [required_instance]

  # C.2: Hardware Floor
  # Minimum resource requirements derived from WDD minimum_resource_assertions
  # with resolved parameter values substituted.
  hardware_floor:

    - task_id: "<task_id>"
      # [required_derived]

      resource: "<e.g., gpu_memory_gb, n_nodes, n_mpi_ranks>"
      # [required_derived] Copied from WDD hardware_path.minimum_resource_assertions[*].resource.

      wrd_assertion_condition: "<condition as written in source code>"
      # [required_derived]

      minimum_value: "<resolved minimum value>"
      # [required_derived]
      # If assertion references a parameter: substitute resolved_value.
      # If hardcoded: copy the bound value directly.

      derivation_basis: |
        <How minimum_value was computed.
        E.g., "WDD asserts n_mpi_ranks == N_PROCS; N_PROCS resolved to 48 → floor 48."
        Or "WDD asserts gpu_memory_gb >= 40; no parameter dependency → floor 40 GB.">
      # [required_derived]

      satisfied_by_hrd: "<compute_id or tier_id from HRD, or null>"
      # [required_instance] Filled by DDD generator after reading HRD.

      satisfied: <true | false | null>
      # [required_derived] COMPUTED by DDD generator.
      # false → halt DDD generation with error.


# -----------------------------------------------------------------------------
# SECTION D: EXECUTION CONTEXT
# Where and how this specific instance will run.
# -----------------------------------------------------------------------------
execution_context:

  target_system: "<hrd_id of the intended target system>"
  # [required_instance] Must match an available HRD.

  execution_profile: "<profile_name from WDD execution_profiles>"
  # [required_instance]

  input_data_root: "<absolute path to input data on target system>"
  # [required_instance]
  # E.g., "/scratch/user/1000genomes/inputs/"
  # Used to confirm runtime_determined cardinalities and plan staging.

  output_data_root: "<path for checkpoint and output data>"
  # [required_instance]
  # E.g., "/scratch/user/1000genomes/outputs/run_2026_02_25/"

  notes: |
    <Additional context: why this parameter combination, what scientific
    question it addresses, what distinguishes it from other instances.
    Set to null if not needed.>
  # [required_instance]


# -----------------------------------------------------------------------------
# SECTION E: SOFTWARE ENVIRONMENT
# NEW in v7. Captures the software environment required to execute this
# experiment on the target system. Needed for reproducibility and for
# the DDD agent to generate correct job script preamble.
#
# The agent populates required_static fields during Phase 1 (code analysis).
# The scientist fills required_instance fields, particularly system-specific
# module names that cannot be derived from source code alone.
# -----------------------------------------------------------------------------
environment:

  # E.1: Required environment modules
  # HPC systems use module (Lmod/Tcl) systems to manage software stacks.
  required_modules:
    # [required_instance]
    # Prompt: "What modules must be loaded on {target_system} before this
    # workflow can run? (e.g., 'module load cuda/12.1 hdf5/1.14 openmpi/4.1')
    # List each as a separate entry. Use [] if no modules are required."
    - name: "<module name and version, e.g., 'cuda/12.1'>"
      purpose: "<what this module provides, e.g., 'CUDA runtime for GPU tasks'>"
  # Empty list [] is valid.

  # E.2: Container
  container:
    # [required_instance] (null if not containerized)
    image: "<image path, e.g., /path/to/workflow.sif or docker://user/image:tag>"
    # null if no container is used.

    runtime: "<singularity | apptainer | shifter | docker | null>"
    # null if no container is used.

    bind_mounts:
      - "<host_path:container_path>"
    # Mount paths required for I/O (e.g., PFS scratch mounts). Empty list if none.

  # E.3: Critical library configuration
  # Libraries whose configuration directly affects I/O performance.
  critical_libraries:
    # [required_static] Agent identifies from imports; scientist fills system-specific details.

    hdf5:
      build_type: "<parallel | serial | unknown>"
      # [required_instance]
      # Prompt: "Is HDF5 on {target_system} built with parallel (MPI) support?
      # This determines whether parallel HDF5 I/O is available for this workflow.
      # Check: h5cc -showconfig | grep 'Parallel HDF5'"
      # parallel = PHDF5 available for hdf5_parallel tasks
      # serial   = only python_serial or mpi_io_independent I/O possible

    darshan:
      preloaded: "<true | false | unknown>"
      # [required_instance]
      # Prompt: "Is Darshan instrumentation loaded by default on {target_system}?
      # (Check: echo $LD_PRELOAD or module list after loading default modules.)
      # This determines whether IODD empirical profiling data is available
      # without additional setup."

      library_path: "<path to libdarshan.so, or null>"
      # [required_instance] Used to explicitly LD_PRELOAD if not auto-loaded.

  # E.4: Environment variables
  # Variables that affect workflow behavior beyond what is captured in
  # experiment_parameters. Include only variables with structural impact.
  environment_variables:
    # [required_instance]
    # E.g., PYTHONPATH, LD_LIBRARY_PATH overrides, workflow-specific env flags.
    # Do NOT duplicate parameters already in experiment_parameters.
    - name: "<variable name>"
      value: "<value>"
      purpose: "<why this variable is needed>"
  # Empty list [] is valid.