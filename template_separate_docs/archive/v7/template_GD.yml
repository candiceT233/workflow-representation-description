# =============================================================================
# WIDGET — Goal Document (GD) Agent Template
# Schema: gd-7.0  |  Architecture Design: v7
# See WIDGET_conventions.md for ID namespace and field status codes.
#
# PURPOSE
# The GD captures the operator's performance objectives and constraints that
# motivate a deployment strategy. Every decision in the DDD must reference
# a goal_id defined here. Without the GD, the DDD is a set of choices without
# justification.
#
# WHO FILLS THIS DOCUMENT
# Authored by the operator or HPC facility staff — not the AI agent.
# The agent's role is to:
#   1. Elicit goal entries through structured prompting
#   2. Validate that all hard goals are quantified and measurable
#   3. Detect conflicts between goals and surface them for resolution
#   4. Ensure every goal_id follows the naming convention goal:<descriptor>
#   5. Flag any goal that lacks a metric or target_value as incomplete
#
# AGENT READINESS GATE
#   [ ] header fields all non-null
#   [ ] At least one goal entry exists
#   [ ] Every goal has: goal_id, goal_type, metric, target_value, target_unit,
#       constraint_type
#   [ ] Every soft goal has a priority value
#   [ ] conflict_resolution.priority_ordering lists all soft goals
#   [ ] If two soft goals share the same priority rank, resolution_notes is non-null
#   [ ] All hard_constraints have applies_to and rationale
#   [ ] schema_version = "gd-7.0"
#
# Field status codes: see WIDGET_conventions.md Section 3.
# =============================================================================


# -----------------------------------------------------------------------------
# SECTION 1: HEADER
# -----------------------------------------------------------------------------
header:
  gd_id: "gd:<workflow_name>:<context_name>"
  # [required_operator]
  # Prompt: "What short name describes this deployment context?
  # (e.g., 'production_cmip7_run', 'test_50node', 'dev_single_node')
  # I will form: gd:<workflow_name>:<your_context_name>"
  _value: null

  wrd_lineage_id: null
  # [required_operator] workflow_lineage_id from the WDD this goal set applies to.

  wrd_version: null
  # [required_operator] WDD version this goal set was authored against.

  operator: null
  # [required_operator] Name, role, and group/institution.
  # E.g., "Dr. Jane Smith, Research Scientist, NCAR Mesoscale Dynamics Group"

  created_at: null        # [auto_derived] ISO 8601
  last_modified_at: null  # [auto_derived] ISO 8601
  schema_version: "gd-7.0"  # [auto_derived]

  description: null
  # [required_operator]
  # Prompt: "Describe the context for this run in a few sentences.
  # What kind of run is this (production, testing, benchmarking)?
  # What is the scientific purpose? What is the primary performance concern?
  # E.g., 'Production 40-year reanalysis for CMIP7. Throughput is the primary
  # concern. Must complete within a 48-hour allocation window on Perlmutter.'"


# -----------------------------------------------------------------------------
# SECTION 2: GOALS
# One entry per performance objective.
#
# ELICITATION ORDER — Agent asks in this sequence:
#
# 1. THROUGHPUT
#    "Do you have a minimum required data throughput?
#    (e.g., 'at least 10 GB/s sustained input ingestion').
#    Hard requirement or soft target to optimize toward?"
#
# 2. LATENCY / WALL TIME
#    "Do you have an end-to-end wall time budget?
#    (e.g., 'must complete within 30 minutes'). Hard or soft?"
#
# 3. RESOURCE BUDGET
#    "Are there hard limits on compute resources?
#    (e.g., maximum node count, maximum node-hours, memory per node limits).
#    These are typically set by the allocation."
#
# 4. RELIABILITY
#    "How important is fault tolerance? Should checkpoint datasets be
#    replicated? Is it acceptable to restart from the beginning if a node
#    fails, or must the workflow support mid-run restart from checkpoints?"
#
# 5. COST / EFFICIENCY
#    "Is minimizing node-hours or allocation cost a goal?
#    More or less important than the throughput or latency targets?"
#
# 6. DATA PLACEMENT
#    "Are there requirements about where specific data must reside?
#    (e.g., 'checkpoints must be on PFS', 'do not use burst buffer').
#    These are typically facility policy or fault-tolerance requirements."
#
# Assign goal_id following: goal:<descriptor>
# E.g., goal:throughput_10gbs, goal:wall_time_30min, goal:max_128_nodes
# -----------------------------------------------------------------------------
goals:
  # Agent populates as a list. Each entry follows the schema below.

  - goal_id: "goal:<short_descriptor>"
    # [required_operator]
    # Examples: goal:throughput_10gbs, goal:wall_time_48hr, goal:max_nodes_256

    goal_type: "<throughput | latency | resource_budget | cost | reliability |
                  data_placement | other>"
    # [required_operator]

    description: null
    # [required_operator] Plain language: what specifically are you trying to achieve?

    metric: null
    # [required_operator] Measurable quantity. Must be a single measurable value, not a narrative.
    # E.g., input_ingestion_rate_gbs, end_to_end_wall_time_hours, node_count, node_hours

    target_value: null
    # [required_operator] Numeric threshold.

    target_unit: null
    # [required_operator] E.g., GB/s, hours, minutes, nodes, node-hours, count

    target_direction: null
    # [required_operator]
    # maximize: higher is better (e.g., throughput)
    # minimize: lower is better (e.g., wall time, cost)
    # exact:    held at exactly the target value
    # _allowed_values: [maximize, minimize, exact]

    constraint_type: null
    # [required_operator]
    # hard: deployment is invalid if violated (allocation limits, facility policy)
    # soft: optimize toward, but trade-offs are acceptable
    # _allowed_values: [hard, soft]

    priority: null
    # [required_operator] Required when constraint_type = soft.
    # Integer rank: 1 = highest priority, 2 = next, etc.
    # Hard goals are always satisfied first; priority ordering only applies
    # when two soft goals conflict.
    # NOTE (v7): If only one soft goal exists at a given priority rank, no
    # conflict is possible. resolution_notes is only required when two or more
    # soft goals share the same priority rank.


# -----------------------------------------------------------------------------
# SECTION 3: CONFLICT RESOLUTION POLICY
# Agent auto-derives priority_ordering from goal priorities.
# resolution_notes is ONLY required when two soft goals share the same
# priority rank (v7 change: previously triggered on any potential conflict).
# -----------------------------------------------------------------------------
conflict_resolution:

  priority_ordering:
    # [auto_derived]
    # Ordered list of all goal_ids with constraint_type = soft, sorted by
    # priority (ascending). Hard goals are not listed here — they are always
    # binding. Never manually specified.
    _value: []

  resolution_notes: null
  # [required_operator] ONLY when two or more soft goals share the same priority rank.
  # Prompt (triggered only on rank collision):
  # "Goals {goal_ids} share priority rank {rank}. When these two goals
  # cannot both be maximized, how should I resolve the tradeoff?
  # (e.g., 'Accept up to 20% latency increase to achieve the throughput
  # target. Do not sacrifice reliability under any circumstances.')
  # If no such conflict is expected, write: 'No expected conflict at
  # this priority rank — optimize jointly.'"
  #
  # Default conflict resolution policy (requires no operator input):
  # 1. Satisfy all hard goals first.
  # 2. Among soft goals, satisfy in ascending priority rank order.
  # 3. For soft goals at the same rank: optimize jointly until a tradeoff
  #    is detected, then prompt operator for resolution.


# -----------------------------------------------------------------------------
# SECTION 4: HARD CONSTRAINTS
# Categorical restrictions the DDD must not violate. Distinct from
# hard-constraint goals (which are quantified thresholds). These are policy rules.
#
# Agent prompts after goals are collected:
# "Are there categorical restrictions beyond the numeric goals above?
# E.g., 'checkpoints must be on PFS', 'do not use node-local storage',
# 'this data is ITAR-controlled and must not leave the facility network'."
# -----------------------------------------------------------------------------
hard_constraints:
  # Agent populates as a list.

  - constraint_id: "goal:<short_descriptor>"
    # [required_operator] Uses goal: namespace for DDD back-reference consistency.
    # E.g., goal:must_use_pfs_for_checkpoints, goal:no_burst_buffer

    description: null
    # [required_operator] What is prohibited or required.

    applies_to: null
    # [required_operator] Which entities: a specific task_id, data_id,
    # "all checkpoint datasets", "all tasks", or free-text.

    rationale: null
    # [required_operator] Why this constraint exists.
    # E.g., "Burst buffer on Perlmutter is volatile and lost at job end."

    enforced_by: null
    # [optional_operator]
    # _allowed_values: [facility_policy, team_policy, scientific_requirement, other]