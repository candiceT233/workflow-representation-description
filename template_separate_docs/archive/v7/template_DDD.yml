# =============================================================================
# WIDGET — Deployment Definition Document (DDD) Agent Template
# Schema: ddd-7.0  |  Architecture Design: v7
# See WIDGET_conventions.md for ID namespace and field status codes.
#
# FORMAL RELATIONSHIP
#   DDD = prescription(WDD, EDD, GD, HRD)
#   IODD = execution(WDD, EDD, DDD, HRD, GD)
#
# PURPOSE
# The DDD defines how a workflow is deployed to achieve a specific set of
# goals on specific hardware for a specific experiment. It bridges:
#   WDD logical structure   — what the workflow is
#   EDD resolved inputs     — what this experiment is (cardinalities, hardware floor)
#   GD operator intent      — what the operator wants to optimize
#   HRD physical hardware   — what resources are available (including scheduler)
# into a concrete execution strategy AND a runnable job script.
#
# Every decision records both WHAT was decided and WHY (via goal_ref).
# A DDD without goal_refs is incomplete.
#
# WHO FILLS THIS DOCUMENT
# AI prescription agent, given WDD + EDD + GD + HRD as inputs.
# required_agent fields: agent fills through reasoning.
# required_agent_ask fields: agent proposes; operator confirms or overrides.
# auto_validated fields: computed checks; never manually set.
#
# AGENT REASONING PROTOCOL (9 steps)
#   1. Read the full WDD (all sections)
#   2. Read the full EDD:
#        - Verify completeness gate passed (no required_instance nulls, no validation_check=fail)
#        - Extract: resolved_cardinalities, hardware_resolution.path_selections,
#          hardware_resolution.hardware_floor, execution_context, environment
#   3. Read the full GD (goals and hard constraints)
#   4. Read the full HRD (compute topology, storage hierarchy, scheduler, network fabric)
#   5. Verify all EDD hardware_floor entries are satisfied by HRD resources
#        → If any floor.satisfied = false, HALT with explanatory error before proceeding
#   6. Identify which GD goals are hard vs. soft; determine dominant soft goal
#   7. For each hard constraint, identify which WDD entities it applies to
#   8. Derive candidate strategy name from dominant soft goal
#   9. Fill sections in order:
#        header → parallelism → storage → staging_plan → placement
#        → pipelining → replication → job_script → validation
#
# AGENT READINESS GATE
#   [ ] All required_agent fields non-null
#   [ ] All required_agent_ask fields confirmed by operator
#   [ ] EDD completeness gate confirmed passed
#   [ ] All EDD hardware_floor entries satisfied by HRD
#   [ ] Every task in WDD tasks (for chosen profile) has a parallelism entry
#   [ ] parallelism_instances derived from EDD resolved_cardinalities
#   [ ] Every dataset in WDD data_objects has a storage tier assignment
#   [ ] Every goal_ref references a valid goal_id from the GD
#   [ ] staging_plan generated (may have empty steps if no staging required)
#   [ ] job_script.directives populated
#   [ ] validation_summary.validation_status == "valid"
#   [ ] No hard_constraint_check has status = "fail"
#   [ ] No capacity_check has status = "fail"
#   [ ] No bandwidth_check has status = "fail"
# =============================================================================


# -----------------------------------------------------------------------------
# SECTION 1: HEADER
# -----------------------------------------------------------------------------
header:
  ddd_id:
    # [auto_validated]
    # Format: deploy:<first_8_wrd_lineage>:<first_8_edd_instance>:<strategy_name>
    # E.g., deploy:f3a9c2e1:7a3b2c1d:throughput_optimized
    _value: null

  strategy_name:
    # [required_agent_ask]
    # Derive from highest-priority soft goal:
    #   throughput → "throughput_optimized"
    #   cost       → "cost_optimized"
    #   latency    → "latency_optimized"
    #   balanced   → "balanced"
    # Present to operator: "I propose strategy name '{name}' based on your
    # primary goal of '{goal_description}'. Confirm or override?"
    _value: null

  wrd_lineage_id: null    # [required_agent] Copied from WDD metadata.workflow_lineage_id.
  wrd_version: null       # [required_agent] Copied from WDD metadata.version.
  edd_lineage_id: null    # [required_agent] Copied from EDD metadata.experiment_lineage_id.
  edd_instance_id: null   # [required_agent] Copied from EDD metadata.instance_id.
  hrd_id: null            # [required_agent] Copied from HRD header.hrd_id.
  hrd_version: null       # [required_agent] Copied from HRD header.version.
  gd_id: null             # [required_agent] Copied from GD header.gd_id.
  schema_version: "ddd-7.0"  # [required_agent]

  execution_profile:
    # [required_agent_ask]
    # Select from WDD execution_profiles matching GD intent.
    # Present: "I will generate a deployment for profile '{name}' which runs
    # tasks: {required_task_set}. Is this correct?"
    _value: null

  generated_by: null    # [required_agent]
  generated_at: null    # [required_agent] ISO 8601

  description:
    # [required_agent] 2–4 sentences: which GD goals drive this strategy,
    # primary deployment tradeoffs, and what hardware this targets.
    _value: null


# -----------------------------------------------------------------------------
# SECTION 2: PER-TASK PARALLELISM
# One entry per task in the chosen execution profile.
#
# KEY REASONING RULES (condensed):
#   - parallelism_instances PRIMARY SOURCE: EDD resolved_cardinalities[task output data_id].resolved_count
#   - compute_resource PRIMARY SOURCE: EDD hardware_resolution.path_selections[task_id].selected_path_id
#   - io_bound tasks: scale instances to maximize bandwidth utilization
#     Target: HRD tier.peak_bandwidth / expected_per_instance_bandwidth
#   - compute_bound tasks: scale based on wall-time target and problem size
#   - io_access_type = mpi_io_collective tasks: ensure ranks_per_instance matches
#     the MPI-IO aggregator count configured in the job script (Section 8)
#   - Every entry must have goal_ref and rationale
# -----------------------------------------------------------------------------
per_task_parallelism:
  # One entry per task in execution_profile.required_task_set.

  - task_id: null               # [required_agent] From WDD tasks.

    parallelism_instances: null
    # [required_agent]
    # PRIMARY: EDD resolved_cardinalities for output data object of this task.
    # FALLBACK (no variable-cardinality output): infer from WDD pc_edges pattern; default 1.

    ranks_per_instance: null
    # [required_agent]
    # Derive from: WDD task MPI configuration, HRD cores_per_node, io_dominance.
    # io_bound: fewer ranks/node to reduce I/O serialization.
    # compute_bound: fill the node (cores_per_node ranks).

    threads_per_rank: null
    # [required_agent]
    # OpenMP threads per MPI rank. Default 1 if no threading evidence in source.
    # Cross-check: ranks_per_instance * threads_per_rank <= HRD cores_per_node * hardware_threads_per_core

    compute_resource: null
    # [required_agent]
    # PRIMARY: EDD hardware_resolution.path_selections[task_id].selected_path_id
    # FALLBACK (no conditional execution): compute_bound → prefer gpu_node; io_bound → prefer cpu_node
    # VERIFY: EDD hardware_floor for this task must be satisfied by selected HRD compute resource.

    total_nodes_required: null
    # [auto_validated]
    # COMPUTED: ceil(parallelism_instances * ranks_per_instance / HRD[compute_resource].cores_per_node)
    # Must not exceed GD goal:max_nodes constraint if present.

    io_aggregator_config:
      # [required_agent] Required when WDD task.io_access_type = mpi_io_collective or hdf5_parallel.
      # null for all other io_access_types.
      aggregator_count: null
      # Number of MPI-IO aggregator ranks. Typically: number of OSTs/PFS stripes targeted,
      # or 1 aggregator per node. Derive from HRD storage_hierarchy[assigned_tier].stripe_tuning.
      cb_buffer_size_mb: null
      # Collective buffer size per aggregator in MB. Typical: 16–64 MB.
      # Larger = fewer round trips for large contiguous writes; smaller = less memory pressure.
      romio_hints: "<cb_nodes=N:cb_buffer_size=Xm or null>"
      # [required_agent] ROMIO hint string to set in job script environment.
      rationale: null

    goal_ref: null
    # [required_agent] GD goal_id that motivated this parallelism choice.

    rationale: null
    # [required_agent] 1–2 sentences referencing WDD fields that informed the reasoning.


# -----------------------------------------------------------------------------
# SECTION 3: STORAGE TIER ASSIGNMENTS
# One entry per dataset in WDD data_objects for the chosen profile.
#
# KEY REASONING RULES (condensed):
#   - checkpoint datasets → persistent tier (check GD hard_constraints first)
#   - intermediate, high-access (few_times/repeatedly) → burst_buffer or node_local_ssd
#   - intermediate, single-access, large → PFS directly (no staging benefit)
#   - input datasets → PFS (stage to burst_buffer only if access_frequency > once)
#   - config datasets → PFS; never stage to volatile tiers
#   - Apply HRD stripe_tuning for large sequential writes (checkpoint files)
# -----------------------------------------------------------------------------
storage_tier_assignments:

  - dataset_id: null    # [required_agent] data_id from WDD data_objects.

    assigned_tier: null
    # [required_agent] tier_id from HRD storage_hierarchy. Must exist in HRD.

    cleanup_policy: null
    # [required_agent]
    # after_last_consumer: delete after WDD last_consumer_phase task completes
    # end_of_job:          delete at job end (semi_persistent tiers)
    # retain_indefinitely: never delete (checkpoint datasets)
    # _allowed_values: [after_last_consumer, end_of_job, retain_indefinitely]

    replication: null
    # [required_agent] boolean
    # true for checkpoint datasets when GD has reliability goal.

    caching_policy: null
    # [required_agent]
    # none:              single access, no caching benefit
    # cache_on_first_read: multiple consumers; cache after first read
    # prefetch:          stage from cold storage before task starts
    # _allowed_values: [none, cache_on_first_read, prefetch]

    # NEW in v7: Lustre stripe directives for this dataset
    stripe_directive: null
    # [required_agent]
    # Populate when: assigned_tier has stripe_tuning defined AND this dataset
    # is a large sequential writer (checkpoint or large intermediate).
    # Format: "lfs setstripe -c {count} -S {size}m {path}"
    # Derived from HRD storage_hierarchy[assigned_tier].stripe_tuning.
    # null if tier has no stripe_tuning defined or dataset is small/random.

    goal_ref: null      # [required_agent]
    rationale: null     # [required_agent] 1–2 sentences.

    feasibility_check: null
    # [auto_validated]
    # COMPUTED using EDD resolved_cardinalities[dataset_id].estimated_total_size.
    # Sum all estimated_total_size values assigned to this tier.
    # Compare against HRD per_job_capacity_tb.
    #   pass:        total < 80% of capacity
    #   warning:     total 80–100% of capacity
    #   fail:        total > capacity
    #   unavailable: all EDD estimated_total_size values are "unknown"
    # _allowed_values: [pass, warning, fail, unavailable]


# -----------------------------------------------------------------------------
# SECTION 4: DATA STAGING PLAN
# NEW in v7. Explicit pre-job and post-job data movement steps.
# Generated from storage_tier_assignments where caching_policy = prefetch
# and the source tier is cold (PFS or archive).
#
# KEY REASONING RULES:
#   - Generate stage_in steps for every dataset with caching_policy = prefetch
#   - Generate stage_out steps for checkpoint datasets on volatile tiers
#   - For Cray DataWarp systems: emit staging_directives for job script
#   - For non-DataWarp systems: emit explicit cp/rsync commands in pre/post steps
#   - Apply lfs setstripe on destination before writing (if PFS with stripe_tuning)
# -----------------------------------------------------------------------------
staging_plan:

  stage_in_steps:
    # [required_agent] One entry per dataset to be staged in before job starts.
    # Empty list [] if no pre-staging is required.

    - dataset_id: null    # [required_agent] data_id from WDD data_objects.

      source_tier: null   # [required_agent] tier_id of source (e.g., tier:pfs)
      dest_tier: null     # [required_agent] tier_id of destination (e.g., tier:burst_buffer)

      source_path_template: "<path template, e.g., '{input_data_root}/{dataset_name}/'>"
      # [required_agent] Use EDD execution_context.input_data_root.

      dest_path_template: "<path template on destination tier>"
      # [required_agent]

      command_or_directive: null
      # [required_agent]
      # For tiers with staging_directives: emit the directive string
      #   (from HRD storage_hierarchy[dest_tier].staging_directives.stage_in_directive)
      # For tiers without directives: emit explicit command
      #   (e.g., "cp -r {source} {dest}" or "sbcast {source} {dest}")
      # Include lfs setstripe before write if dest tier has stripe_tuning.

      estimated_staging_time_minutes: null
      # [required_agent] Estimate: dataset estimated_total_size / HRD dest_tier.peak_write_bandwidth_gbs / 60
      # Add to job walltime budget in job_script section.

      rationale: null

  stage_out_steps:
    # [required_agent] One entry per checkpoint/output dataset on a volatile tier
    # that must be copied to persistent storage after the job completes.
    # Empty list [] if no stage-out is required.

    - dataset_id: null
      source_tier: null
      dest_tier: null
      source_path_template: null
      dest_path_template: null
      command_or_directive: null
      rationale: null

  stripe_setup_commands:
    # [required_agent] lfs setstripe or equivalent commands to run before
    # writing large files. One entry per dataset where stripe_directive is non-null.
    # Empty list [] if no stripe setup is required.
    - dataset_id: null
      command: null   # E.g., "lfs setstripe -c 16 -S 4m /path/to/output/dir"
      target_path_template: null


# -----------------------------------------------------------------------------
# SECTION 5: TASK PLACEMENT AND CO-SCHEDULING
# Groups of tasks to co-locate or spread.
#
# KEY REASONING RULES (condensed):
#   BENEFICIAL (co_locate): loose coupling + medium/large data volume + streaming I/O
#   NEUTRAL (skip): tight coupling or small data volume
#   HARMFUL (spread): both io_bound on shared tier with n_to_n or n_to_1 pattern
# -----------------------------------------------------------------------------
task_placement:
  # Agent populates. May be empty if no task pairs benefit from co-location.

  - group_id: "pg:<descriptor>"    # [required_agent]
    tasks: []                       # [required_agent] List of task_ids.
    placement_policy: null          # [required_agent] co_locate | spread | no_constraint
    co_schedule: null               # [required_agent] boolean
    goal_ref: null                  # [required_agent]
    rationale: null                 # [required_agent]


# -----------------------------------------------------------------------------
# SECTION 6: STAGE ORDERING AND PIPELINING
# Whether workflow stages overlap in time.
# For scatter_gather and iterative workflows: pipelining is handled by
# parallelism_instances, not by overlapping stages.
# For pipeline and cascading workflows: assess per consecutive stage pair.
# -----------------------------------------------------------------------------
pipelining:
  # Agent populates if workflow_pattern is pipeline or cascading.
  # Empty list [] for scatter_gather and iterative workflows.

  - pipeline_group_id: "pipe:<descriptor>"    # [required_agent]

    tasks: []
    # [required_agent] Ordered task_ids in topological order.

    overlap_strategy: null
    # [required_agent]
    # full_overlap:    all stages run simultaneously on different data chunks.
    #                  Requires all tasks to support streaming I/O.
    # partial_overlap: some stages overlap; others wait for completion.
    # sequential:      each stage completes before the next starts.
    # Derive from WDD behavioral_notes (streaming vs. deferred I/O) and coupling.
    # _allowed_values: [full_overlap, partial_overlap, sequential]

    batch_size: null
    # [required_agent] For full/partial overlap: items per pipeline cycle.
    # Null for sequential.

    goal_ref: null
    rationale: null


# -----------------------------------------------------------------------------
# SECTION 7: REPLICATION AND CACHING STRATEGY
# -----------------------------------------------------------------------------
replication_and_caching:

  global_replication_factor: null
  # [required_agent]
  # Default replication for checkpoints without explicit per-dataset settings.
  # 1 = no replication. 2+ = fault-tolerant. Derive from GD reliability goals.

  checkpoint_interval: null
  # [required_agent]
  # For iterative workflows: checkpoint every N iterations.
  # Derive from: GD reliability goals, WDD loop max_iterations_guard,
  # and estimated per-iteration wall time relative to failure probability.
  # Null for non-iterative workflows.

  # NEW in v7: explicit restart strategy
  restart_strategy:
    # [required_agent]
    # Derive from WDD task.restart_model annotations.
    model: null
    # full_restart:       any failure requires restarting the entire workflow
    # stage_restart:      restart from the beginning of the failed stage
    # task_restart:       restart the failed task instance only (if idempotent)
    # checkpoint_restart: restart from the most recent checkpoint
    # Derive from WDD restart_model values across all tasks in this profile.
    # Use the most conservative model among non-idempotent tasks.
    # _allowed_values: [full_restart, stage_restart, task_restart, checkpoint_restart]

    restart_checkpoint_datasets:
      - "<data_id of checkpoint used for restart>"
    # [required_agent] From WDD task.restart_checkpoint_dataset for any task
    # where restart_model = checkpoint_restart.

    operator_action_required: null
    # [required_agent] boolean
    # true if restart requires operator to re-submit job manually.
    # false if restart can be automated (e.g., --dependency=afternotok job chain).

    rationale: null

  cache_warm_strategy: null
  # [required_agent_ask]
  # Should burst buffer or node-local storage be pre-populated before job starts?
  # GENERATE staging_plan stage_in_steps when this = yes.
  # Present: "Input datasets are on tier:pfs (peak read {X} GB/s).
  # Pre-staging to tier:burst_buffer would reduce initial I/O latency
  # but adds ~{estimated_staging_time} minutes of setup time.
  # Should I plan for pre-staging? (yes/no/auto)"
  # _allowed_values: [yes, no, auto]

  goal_ref: null    # [required_agent] Reliability or latency goal motivating these defaults.


# -----------------------------------------------------------------------------
# SECTION 8: JOB SCRIPT
# NEW in v7. Concrete scheduler directives and preamble for job submission.
# The DDD agent generates this section; Jarvis-MCP uses it to produce the
# final job script file. This eliminates ambiguity about what scheduler
# flags to use.
#
# KEY REASONING RULES:
#   - target_partition: select from HRD scheduler.partitions based on
#     total_nodes_required, estimated_walltime, and GD goals
#   - estimated_walltime: sum of per-task wall time estimates plus staging time
#   - account: from EDD or operator prompt (HRD account_required = true)
#   - exclusive: prefer true for io_bound workloads to avoid contention
#   - mpi_io_aggregator directives: generate ROMIO hints for collective I/O tasks
# -----------------------------------------------------------------------------
job_script:

  scheduler_type: null
  # [required_agent] Copied from HRD scheduler.scheduler_type.

  target_partition: null
  # [required_agent]
  # Select from HRD scheduler.partitions:
  #   - Must accommodate total_nodes_required (max_nodes constraint)
  #   - Must accommodate estimated_walltime_hours (max_walltime_hours constraint)
  #   - Prefer partition with node_classes_available matching all required compute_ids
  # Present to operator: "I propose partition '{partition_id}' which supports
  # up to {max_nodes} nodes and {max_walltime_hours} hours. Confirm?"

  account: null
  # [required_agent_ask] Required when HRD scheduler.account_required = true.
  # Prompt: "What project account code should be used for this job?
  # (Used for allocation charging.)"

  estimated_walltime_hours: null
  # [required_agent]
  # Sum of: per-task wall time estimates + staging_plan total estimated_staging_time
  # + 10–20% safety margin. Add to job script as #SBATCH --time.

  exclusive_nodes: null
  # [required_agent_ask] boolean
  # true = --exclusive flag in job script. Recommended for io_bound workloads
  # to prevent shared-tier contention from co-tenants.
  # Present: "Should I request exclusive node access? This prevents
  # contention from co-located jobs but may increase queue wait time."

  directives:
    # [required_agent] Complete list of scheduler directives for the job script.
    # One entry per directive line. Agent generates based on all sections above.
    # This list must be sufficient to produce a runnable job submission.
    #
    # For Slurm, entries become: #SBATCH <directive>
    # For PBS:                   #PBS <directive>
    # For LSF:                   #BSUB <directive>

    - directive: "--job-name=<strategy_name>_<edd_instance_id_short>"
      purpose: "Job identification"

    - directive: "--partition=<target_partition>"
      purpose: "Queue selection"

    - directive: "--nodes=<max total_nodes_required across all tasks>"
      purpose: "Node allocation"

    - directive: "--time=<estimated_walltime_hours>:00:00"
      purpose: "Wall time limit"

    - directive: "--account=<account>"
      purpose: "Allocation charging"
      # Include only if HRD scheduler.account_required = true

    - directive: "--exclusive"
      purpose: "Exclusive node access to prevent I/O contention"
      # Include only if exclusive_nodes = true

    # Agent adds additional directives as needed, e.g.:
    # --array (job arrays for embarrassingly parallel tasks)
    # --dependency=afterok:JOBID (chained stage-out jobs)
    # --output / --error (log file paths)
    # --constraint=<node feature> (e.g., GPU node constraint)
    # --gres=gpu:N (GPU allocation)

  environment_setup:
    # [required_agent] Preamble commands before the workflow executes.
    # Derived from EDD environment section.
    module_load_commands: []
    # E.g., ["module load cuda/12.1", "module load hdf5/1.14 openmpi/4.1"]
    # Populated from EDD environment.required_modules.

    container_command: null
    # E.g., "module load singularity" or null if not containerized.
    # Populated from EDD environment.container.runtime.

    ld_preload: null
    # E.g., "export LD_PRELOAD=/path/to/libdarshan.so"
    # Populated from EDD environment.critical_libraries.darshan if preloaded = false.

    environment_variable_exports: []
    # E.g., ["export ROMIO_HINTS=/path/to/hints", "export OMP_NUM_THREADS=4"]
    # Populated from: EDD environment.environment_variables +
    # per_task_parallelism[*].io_aggregator_config.romio_hints.

    stripe_setup_commands: []
    # Copied from staging_plan.stripe_setup_commands.
    # Run before any data writing begins.

  rationale: null
  # [required_agent] 2–4 sentences explaining partition selection, walltime estimate,
  # and any non-obvious directive choices.


# -----------------------------------------------------------------------------
# SECTION 9: DDD VALIDATION SUMMARY
# Auto-computed consistency and feasibility checks. Never manually specified.
# A DDD with validation_status != valid must not be submitted.
# -----------------------------------------------------------------------------
validation_summary:

  validation_status: null
  # [auto_validated]
  # valid:    all hard_constraint_checks pass, no capacity/bandwidth checks fail
  # warnings: all hard constraints pass, some capacity/bandwidth checks in warning
  # invalid:  one or more hard_constraint_checks fail, or capacity/bandwidth fail
  # _allowed_values: [valid, warnings, invalid]

  hard_constraint_checks: []
  # [auto_validated] One entry per GD hard_constraint:
  #   constraint_id: <goal constraint_id>
  #   status: pass | fail
  #   evidence: which DDD decision satisfies or violates this constraint

  capacity_checks: []
  # [auto_validated] One entry per storage tier used:
  #   tier_id: <tier_id>
  #   total_assigned_gb: sum of EDD resolved_cardinalities[*].estimated_total_size
  #                      for all datasets assigned to this tier
  #   tier_capacity_gb: HRD per_job_capacity_tb * 1024
  #   status: pass | warning | fail | unavailable
  #   note: explanation if unavailable or warning

  bandwidth_checks: []
  # [auto_validated] One entry per WDD pc_edge where assigned tier is the transfer path:
  #   pc_edge_id: <edge_id>
  #   required_bandwidth_gbs: estimate from WDD data_volume_class and GD throughput goal
  #   tier_peak_bandwidth_gbs: HRD peak_read/write for assigned tier
  #   effective_bandwidth_gbs: tier_peak * HRD contention_model.degradation_factor
  #   status: pass | warning | fail
  #     pass:    required < effective * 0.8
  #     warning: required between 80% and 100% of effective
  #     fail:    required > effective

  scheduler_feasibility_checks: []
  # [auto_validated] NEW in v7. Checks against HRD scheduler constraints:
  #   partition_id: <target_partition>
  #   total_nodes_required: <sum from per_task_parallelism>
  #   max_nodes_in_partition: <from HRD scheduler.partitions>
  #   walltime_hours: <estimated_walltime_hours>
  #   max_walltime_in_partition: <from HRD scheduler.partitions>
  #   status: pass | fail
  #   note: which constraint is violated if fail

  validation_notes: null
  # [required_agent]
  # "All checks passed." if valid and no warnings.
  # If warnings: what operator should monitor at runtime.
  # If invalid: what constraints are violated and what changes would resolve them.