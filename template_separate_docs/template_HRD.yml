# =============================================================================
# WIDGET — Hardware Resource Document (HRD) Agent Template
# Schema: hrd-7.0  |  Architecture Design: v7
# See WIDGET_conventions.md for ID namespace and field status codes.
#
# PURPOSE
# The HRD describes the physical hardware on which a deployment executes.
# It defines the physical envelope within which DDD decisions must operate:
#   - tier_ids referenced in storage tier assignments
#   - compute_ids referenced in per-task parallelism decisions
#   - bandwidth ceilings used in DDD feasibility checks
#   - scheduler configuration used in DDD job script generation  ← NEW v7
#   - contention models used to evaluate shared-tier risk
#
# WHO FILLS THIS DOCUMENT
# Authored once per system by HPC facility staff or sysadmin.
# Maintained as a shared resource for all WIDGETs on that system.
#
# AGENT READINESS GATE
#   [ ] All header fields non-null
#   [ ] At least one compute topology entry with compute_id
#   [ ] At least one network fabric entry with interconnect_id
#   [ ] At least one storage tier entry with tier_id, tier_type, persistence,
#       shared_across_jobs, and contention_model
#   [ ] scheduler section filled (at minimum: scheduler_type, default_partition,
#       max_walltime_per_queue)
#   [ ] All required_benchmark fields have values (vendor spec acceptable as
#       initial estimate, flagged accordingly)
#   [ ] schema_version = "hrd-7.0"
#
# Field status codes: see WIDGET_conventions.md Section 3.
# =============================================================================


# -----------------------------------------------------------------------------
# SECTION 1: HEADER
# -----------------------------------------------------------------------------
header:
  hrd_id: "hrd:<system_short_name>"
  # [required_sysadmin] Format: hrd:<system_short_name>
  # E.g., "hrd:perlmutter_nersc", "hrd:frontier_olcf", "hrd:stampede3_tacc"
  _value: null

  system_name: "<full human-readable name>"
  # [required_sysadmin]
  # E.g., "Perlmutter @ NERSC", "Frontier @ OLCF"
  _value: null

  version: "<semantic version>"
  # [required_sysadmin] "1.0.0" for initial. Increment on hardware config changes.
  _value: null

  version_notes: "<what this version documents>"
  # [required_sysadmin]
  _value: null

  facility: "<facility or institution>"
  # [required_sysadmin]
  _value: null

  schema_version: "hrd-7.0"
  # [auto_derived]

  created_at: null      # [auto_derived] ISO 8601
  last_modified_at: null  # [auto_derived] ISO 8601

  description: |
    <2–4 sentence architectural summary: primary compute architecture,
    storage hierarchy overview, notable performance characteristics.>
  # [required_sysadmin]
  _value: null


# -----------------------------------------------------------------------------
# SECTION 2: COMPUTE TOPOLOGY
# One entry per distinct node class.
# -----------------------------------------------------------------------------
compute_topology:
  # Agent prompts: "How many distinct node types does this system have?
  # For each type, I will ask for the specs below."

  - compute_id: "compute:<descriptor>"
    # [required_sysadmin] Format: compute:<descriptor>
    # E.g., compute:cpu_node, compute:gpu_node, compute:large_memory_node

    node_type_description: "<brief description>"
    # [required_sysadmin] E.g., "GPU-accelerated node with 4x A100 80GB"

    node_count: <integer>
    # [required_sysadmin] Total nodes of this class on the system.

    cores_per_node: <integer>
    # [required_sysadmin]

    hardware_threads_per_core: <integer>
    # [required_sysadmin] 1 if hyperthreading disabled.

    memory_per_node_gb: <integer>
    # [required_sysadmin]

    memory_bandwidth_gbs: <number>
    # [required_benchmark] Source: STREAM benchmark preferred over vendor spec.
    _value_source: null   # "stream_benchmark" | "vendor_spec" | "other"

    accelerators:
      # [required_sysadmin] null if no accelerators.
      - type: "<e.g., NVIDIA A100 80GB SXM4>"
        count: <integer>
        memory_gb: <integer>

    interconnect_id: "net:<descriptor>"
    # [required_sysadmin] References Section 3.

    # NEW in v7: node-local storage (critical for staging decisions in DDD)
    node_local_storage:
      # [required_sysadmin] null if no node-local storage present.
      type: "<nvme_ssd | hdd | ramdisk | null>"
      capacity_gb: <number>
      peak_read_bandwidth_gbs: <number>
      # [required_benchmark] IOR on node-local device preferred.
      _value_source: null
      peak_write_bandwidth_gbs: <number>
      # [required_benchmark]
      _value_source: null
      notes: "<e.g., 'Cleared at job end. Accessible at /tmp or $TMPDIR.'>"


# -----------------------------------------------------------------------------
# SECTION 3: NETWORK FABRIC
# One entry per distinct interconnect.
# -----------------------------------------------------------------------------
network_fabric:

  - interconnect_id: "net:<descriptor>"
    # [required_sysadmin] Format: net:<descriptor>
    # E.g., net:slingshot, net:infiniband_hdr, net:omnipath

    technology: "<Slingshot-11 | InfiniBand HDR | InfiniBand HDR100 | OmniPath |
                  Ethernet | other>"
    # [required_sysadmin]

    topology: "<dragonfly | fat_tree | torus | mesh | other>"
    # [required_sysadmin]

    injection_bandwidth_per_node_gbs: <number>
    # [required_benchmark] Per-node injection bandwidth (not bisection).
    _value_source: null

    latency_us: <number>
    # [required_benchmark] MPI point-to-point latency in microseconds.
    # Source: OSU micro-benchmarks (osu_latency).
    _value_source: null   # "osu_benchmark" | "vendor_spec" | "other"

    mpi_collective_bandwidth_gbs: <number>
    # [optional_benchmark] All-reduce bandwidth. Source: osu_allreduce.
    _value_source: null

    notes: "<known routing policies, topology-aware placement hints, etc.>"
    # [optional_benchmark]


# -----------------------------------------------------------------------------
# SECTION 4: STORAGE HIERARCHY
# One entry per distinct storage tier accessible to jobs.
# -----------------------------------------------------------------------------
storage_hierarchy:

  - tier_id: "tier:<descriptor>"
    # [required_sysadmin] Format: tier:<descriptor>
    # E.g., tier:node_local_ssd, tier:burst_buffer, tier:pfs, tier:archive

    tier_type: "<node_local_ssd | node_local_hdd | burst_buffer |
                 parallel_filesystem | object_store | in_memory | archive>"
    # [required_sysadmin]

    filesystem_type: "<Lustre | GPFS | DAOS | BeeGFS | WekaFS | VAST | HPSS | other | null>"
    # [optional_benchmark]

    mount_point: "<typical mount path, e.g., /pscratch, /tmp, /bb>"
    # [required_sysadmin] Used to map Darshan file paths to tier_ids in IODD.

    total_capacity_tb: <number>
    # [required_sysadmin]

    per_job_capacity_tb: <number>
    # [required_sysadmin] May differ from total for shared tiers.

    peak_read_bandwidth_gbs: <number>
    # [required_benchmark] IOR measurement preferred.
    _value_source: null   # "ior_benchmark" | "vendor_spec" | "facility_doc"
    _benchmark_hint: "IOR: ior -a POSIX -b 1g -t 1m -s 64 -F -C -e"

    peak_write_bandwidth_gbs: <number>
    # [required_benchmark]
    _value_source: null

    metadata_ops_per_sec: <integer>
    # [required_benchmark] mdtest preferred.
    _value_source: null   # "mdtest_benchmark" | "vendor_spec" | "facility_doc"
    _benchmark_hint: "mdtest: mdtest -n 100000 -i 3 -d <mountpoint>"

    access_latency_us: <number>
    # [required_benchmark] Single small I/O operation latency.
    _value_source: null

    persistence: "<volatile | persistent | semi_persistent>"
    # [required_sysadmin]
    # volatile:        data deleted at job end
    # persistent:      data survives until explicitly deleted
    # semi_persistent: configurable retention (e.g., 30-day scratch policy)

    retention_policy_notes: "<retention policy if semi_persistent, else null>"
    # [required_sysadmin] Required when persistence = semi_persistent.

    shared_across_jobs: <true | false>
    # [required_sysadmin]
    # true = multiple jobs read/write simultaneously; contention possible.
    # false = dedicated access per job (e.g., node-local SSD).

    # NEW in v7: Lustre stripe tuning hints (critical for PFS performance)
    stripe_tuning:
      # [required_sysadmin] null if not a Lustre/GPFS filesystem.
      default_stripe_count: <integer | null>
      recommended_stripe_count_large_writes: <integer | null>
      # Prompt: "What stripe count gives best sustained write bandwidth for
      # large files on this filesystem? (Commonly 4–16 for Lustre.)"
      recommended_stripe_size_mb: <integer | null>
      # Prompt: "What stripe size (in MB) gives best sequential bandwidth?
      # (Commonly 1–4 MB for Lustre.)"
      notes: "<e.g., 'Default stripe 1 limits single-file write to ~2 GB/s.
               Use lfs setstripe -c 16 before writing large checkpoint files.'>"

    # NEW in v7: Burst buffer staging directives (Cray DataWarp / equivalent)
    staging_directives:
      # [required_sysadmin] null if this tier does not support job-level staging directives.
      stage_in_directive: "<template for stage-in, e.g., '#DW stage_in source={src} destination={dst} type=directory'>"
      stage_out_directive: "<template for stage-out>"
      directive_syntax: "<DataWarp | BurstBuffer | BB_JOB_DIRECTIVE | none>"
      notes: "<any constraints on staging (e.g., 'stage-in jobs run in separate
               setup phase before compute job, add ~5 min wall time')>"

    contention_model:
      contention_type: "<none | proportional | saturating | unknown>"
      # [required_sysadmin]
      # none:          dedicated tier, no contention
      # proportional:  bandwidth scales linearly down with concurrent jobs
      # saturating:    near-peak until a threshold, then degrades sharply

      saturation_threshold_jobs: <integer | null>
      # [optional_benchmark] Required when contention_type = saturating.

      degradation_factor: <number 0.0–1.0 | null>
      # [required_benchmark] Required when contention_type != none.
      # Fraction of peak bandwidth available under typical contention.
      # E.g., 0.4 means 40% of peak available. Empirical measurement preferred.
      _value_source: null

      qos_guarantees: <true | false>
      # [required_sysadmin]

    notes: "<known quirks, limitations, best practices>"
    # [optional_benchmark]

    benchmark_source: "<source, date, and conditions of measurements above>"
    # [required_benchmark]


# -----------------------------------------------------------------------------
# SECTION 5: JOB SCHEDULER
# NEW in v7. Captures the scheduling layer that mediates access to hardware.
# Required for DDD job script generation.
# -----------------------------------------------------------------------------
scheduler:

  scheduler_type: "<slurm | pbs | lsf | cobalt | flux | other>"
  # [required_sysadmin]

  scheduler_version: "<version string, e.g., '23.11.1'>"
  # [required_sysadmin]

  # One entry per queue/partition available to typical workflow users.
  partitions:
    - partition_id: "<partition name, e.g., 'regular', 'debug', 'gpu', 'large'>"
      # [required_sysadmin]

      description: "<when to use this partition>"
      # [required_sysadmin]

      max_nodes: <integer>
      # [required_sysadmin]

      max_walltime_hours: <number>
      # [required_sysadmin]

      max_jobs_per_user: <integer | null>
      # [required_sysadmin] null if no limit.

      node_classes_available:
        - "<compute_id>"
      # [required_sysadmin] Which compute_ids are in this partition.

      charging_model: "<node_hours | core_hours | gpu_hours | null>"
      # [required_sysadmin] How allocation usage is charged.

      exclusive_node_access: "<always | optional | never>"
      # [required_sysadmin]
      # always:   job always gets exclusive node access (no sharing)
      # optional: operator can request with --exclusive flag
      # never:    nodes are always shared

      priority_notes: "<e.g., 'debug priority is highest but max 30 min walltime'>"
      # [optional_benchmark]

  account_required: <true | false>
  # [required_sysadmin]
  # true = #SBATCH --account=<project_code> required in every job script.

  account_flag: "<e.g., '--account', '-A', null>"
  # [required_sysadmin]

  job_array_support: <true | false>
  # [required_sysadmin] Whether job arrays (--array) are supported.

  dependency_support: <true | false>
  # [required_sysadmin] Whether job dependencies (--dependency=afterok:) are supported.

  typical_queue_wait_minutes:
    # [optional_benchmark] Typical wait times by partition for capacity planning.
    - partition_id: "<partition_id>"
      light_load_minutes: <integer>
      heavy_load_minutes: <integer>

  notes: "<any scheduling quirks: reservation requirements, preemption policies,
           maintenance windows, etc.>"
  # [optional_benchmark]


# -----------------------------------------------------------------------------
# SECTION 6: EMPIRICAL BENCHMARKS
# Additional measurements beyond per-tier and per-fabric fields.
# -----------------------------------------------------------------------------
empirical_benchmarks:

  - measurement_id: "bench:<system_short>:<descriptor>"
    # [required_sysadmin]

    measurement_type: "<io_bandwidth | metadata_rate | network_latency |
                        memory_bandwidth | io_latency | other>"
    # [required_sysadmin]

    tier_or_component: "<tier_id, interconnect_id, or compute_id>"
    # [required_sysadmin]

    measured_value: <number>
    # [required_benchmark]

    unit: "<GB/s | ops/s | us | GB | other>"
    # [required_sysadmin]

    conditions: "<measurement conditions: node count, ranks, transfer size, load>"
    # [required_sysadmin]

    benchmark_tool: "<IOR | mdtest | OSU_micro_benchmarks | STREAM | custom | other>"
    # [required_sysadmin]

    measured_at: "<YYYY-MM-DD>"
    # [required_sysadmin]

    notes: "<caveats, anomalies, interpretation>"
    # [optional_benchmark]