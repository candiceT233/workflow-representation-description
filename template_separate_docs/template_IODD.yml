# =============================================================================
# WIDGET — I/O Observation Document (IODD) Agent Template
# Schema: iodd-7.0  |  Architecture Design: v7
# See WIDGET_conventions.md for ID namespace and field status codes.
#
# FORMAL RELATIONSHIP
#   IODD = execution(WDD, EDD, DDD, HRD, GD)   — one record per run
#
# Each IODD instance pins all five input documents by ID, enabling:
#   Same WDD + EDD, different DDDs → effect of deployment strategy on I/O
#   Same WDD, different EDDs       → effect of experiment scale on I/O
#   Same all five, repeated runs   → run-to-run variability
#
# PURPOSE
# Captures the concrete I/O and communication behavior from one execution.
# Sources:
#   DataLife:  per-file lifecycle events (creation, access, deletion)
#   DaYu:      dataset-level semantic communication structure
#   Darshan:   system-level POSIX I/O metrics per task
#
# MODES
#   EMPIRICAL  — populated by profiling tools after a completed run
#   PREDICTIVE — generated by agent from WDD + EDD + DDD + HRD before run
#
# AGENT READINESS GATE (empirical mode)
#   [ ] header.predictive = false
#   [ ] edd_instance_id filled
#   [ ] per_task_io_profile: one entry per active task
#   [ ] communication_channels: one entry per active pc edge
#   [ ] temporal_io_behavior: one entry per task
#   [ ] diagnosis_summary populated
#
# AGENT READINESS GATE (predictive mode)
#   [ ] header.predictive = true
#   [ ] EDD resolved_cardinalities used for bytes estimates
#   [ ] EDD hardware_floor cross-checked against HRD for capacity estimates
#   [ ] All predictive_estimate fields have confidence records
#
# Field status codes: see WIDGET_conventions.md Section 3.
# =============================================================================


# -----------------------------------------------------------------------------
# SECTION 1: HEADER
# -----------------------------------------------------------------------------
header:
  iodd_id: null
  # [required_agent]
  # Format: iodd:<ddd_id>:<edd_instance_id>

  ddd_id: null            # [required_agent] Copied from DDD header.ddd_id.
  hrd_id: null            # [required_agent] Copied from DDD header.hrd_id.
  wrd_lineage_id: null    # [required_agent] Copied from DDD header.wrd_lineage_id.
  edd_lineage_id: null    # [required_agent] Copied from EDD metadata.experiment_lineage_id.
  edd_instance_id: null   # [required_agent] Copied from EDD metadata.instance_id.
  # NOTE: edd_instance_id is the canonical run identity. run_id is removed in v7.
  # For legacy runs without EDD, use Slurm job ID as edd_instance_id.

  run_start: null
  # [required_profiler] ISO 8601 job start. Source: Slurm sacct or Darshan log start.
  # predictive mode: null

  run_end: null
  # [required_profiler] ISO 8601 job completion.
  # predictive mode: null

  wall_time_seconds: null
  # [required_agent] COMPUTED: (run_end - run_start) in seconds.
  # predictive mode: estimate from DDD per-task wall time estimates.

  predictive: null
  # [required_agent] boolean
  # false: populated from profiling tools after execution
  # true:  generated by agent from WDD + EDD + DDD + HRD before execution

  profiling_tools: null
  # [required_agent] List of tools that contributed data. null in predictive mode.
  # E.g., ["DataLife 2.1", "DaYu 1.4", "Darshan 3.4.2"]

  schema_version: "iodd-7.0"  # [required_agent]

  description: null
  # [required_agent]
  # empirical:   2–3 sentences: overall I/O pattern, DDD plan match, top bottleneck.
  # predictive:  2–3 sentences: predicted I/O behavior and confidence level.


# -----------------------------------------------------------------------------
# SECTION 2: PER-TASK I/O PROFILE
# One entry per task (aggregated across instances for parallel tasks).
# Source: Darshan log per process, matched to WDD task_ids.
#
# For loop tasks: one AGGREGATE entry with per-instance statistics.
# This is standardized in v7 (v6 allowed per-instance entries, which
# broke cross-run comparison for variable-cardinality tasks).
# Optional nested per_instance_stats provides instance-level breakdown.
# -----------------------------------------------------------------------------
per_task_io_profile:

  - task_id: null    # [required_agent] From WDD tasks.

    instance_count: null
    # [required_agent] Number of parallel instances that ran.
    # Source: DDD parallelism_instances (empirical or predictive).

    storage_tier_used: null
    # [required_profiler] tier_id where I/O actually occurred.
    # Detect from Darshan file paths → mount point → tier_id mapping.
    # May differ from DDD assigned_tier if runtime routing occurred.
    # predictive mode: DDD assigned_tier.

    # All byte/op counts below are AGGREGATE across all instances.
    bytes_read: null          # [required_profiler] Total bytes read. Source: Darshan.
    bytes_written: null       # [required_profiler] Total bytes written. Source: Darshan.
    read_ops: null            # [required_profiler] Total POSIX read() calls.
    write_ops: null           # [required_profiler] Total POSIX write() calls.
    open_ops: null            # [required_profiler] Total POSIX open() calls.
    close_ops: null           # [required_profiler] Total POSIX close() calls.

    posix_open_time_s: null   # [required_profiler] Cumulative seconds in open().
    posix_read_time_s: null   # [required_profiler] Cumulative seconds in read().
    posix_write_time_s: null  # [required_profiler] Cumulative seconds in write().
    posix_close_time_s: null  # [required_profiler] Cumulative seconds in close().

    observed_read_bandwidth_gbs: null
    # [required_agent] COMPUTED: bytes_read / posix_read_time_s / 1e9

    observed_write_bandwidth_gbs: null
    # [required_agent] COMPUTED: bytes_written / posix_write_time_s / 1e9

    peak_read_bandwidth_gbs: null    # [optional_profiler] From DXT if available.
    peak_write_bandwidth_gbs: null   # [optional_profiler]

    access_pattern_observed: null
    # [required_agent]
    # Derive from Darshan sequential/random byte counters.
    # sequential: >90% sequential   |  random: >50% non-sequential
    # strided: regular stride pattern  |  mixed: no dominant pattern
    # _allowed_values: [sequential, random, strided, mixed]

    io_phase_observed: null
    # [required_agent]
    # upfront:   all reads in first 10% of task wall time
    # deferred:  all writes in last 10% of task wall time
    # streaming: reads/writes distributed throughout
    # mixed:     reads upfront, writes deferred
    # Compare against WDD behavioral_notes; flag mismatch below.
    # _allowed_values: [upfront, streaming, deferred, mixed]

    # NEW in v7: MPI-IO specific profiling
    mpi_io_observations:
      # [required_agent] Populate when WDD task.io_access_type = mpi_io_collective
      # or mpi_io_independent or hdf5_parallel. null otherwise.
      collective_ops: null
      # [optional_profiler] Count of MPI_File_read_all / MPI_File_write_all calls.
      independent_ops: null
      # [optional_profiler] Count of MPI_File_read / MPI_File_write calls.
      aggregator_count_used: null
      # [optional_profiler] Actual ROMIO aggregators used. Source: Darshan MPI-IO module.
      aggregator_count_planned: null
      # [required_agent] From DDD per_task_parallelism[task_id].io_aggregator_config.aggregator_count.
      match_ddd_aggregator: null
      # [required_agent] boolean: aggregator_count_used == aggregator_count_planned
      # false = aggregator misconfiguration; flag in diagnosis_summary.anomalies.

    compute_to_io_ratio: null
    # [required_agent] COMPUTED:
    # (posix_read_time_s + posix_write_time_s + posix_open_time_s + posix_close_time_s)
    # / task_wall_time_s
    # ~1.0 = I/O bound. ~0.0 = compute bound.

    contention_events: null
    # [optional_profiler] Count of I/O contention events. Source: DataLife.

    dpm_trace_ref: null
    # [optional_profiler] Path/ID of DPM trace file for this task.

    match_wrd_io_phase: null
    # [required_agent] boolean: io_phase_observed matches WDD behavioral_notes.
    # false → flag in diagnosis_summary.anomalies.

    per_instance_stats:
      # [optional_profiler] Instance-level breakdown for diagnostic deep-dives.
      # Omit for normal analysis; include when contention or variability is suspected.
      - instance_index: null    # 0-indexed
        bytes_read: null
        bytes_written: null
        observed_read_bandwidth_gbs: null
        observed_write_bandwidth_gbs: null


# -----------------------------------------------------------------------------
# SECTION 3: COMMUNICATION CHANNEL DEFINITIONS
# One entry per P-C edge in WDD pc_edges active in this run.
# Source: DataLife DFL-G + DaYu SDG.
# -----------------------------------------------------------------------------
communication_channels:

  - pc_edge_id: null
    # [required_agent] edge_id from WDD pc_edges.

    physical_path: null
    # [required_profiler]
    # shared_file_on_pfs:          both read/write same file on PFS
    # staged_through_burst_buffer: data written to BB by producer, read from BB by consumer
    # node_local_transfer:         co-located; data stays on node-local SSD
    # in_memory_mpi:               passed via MPI without disk
    # streaming_pipe:              named pipe or shared memory ring buffer
    # Source: DataLife file path analysis.
    # predictive mode: derive from DDD assigned_tier tier_type.
    # _allowed_values: [shared_file_on_pfs, staged_through_burst_buffer,
    #                   node_local_transfer, in_memory_mpi, streaming_pipe]

    tier_id: null
    # [required_agent] Where data resided during this transfer.

    data_volume_bytes: null
    # [required_profiler] Total bytes on this channel.
    # Source: DataLife or Darshan (min of producer write / consumer read to avoid double-count).
    # predictive mode: EDD resolved_cardinalities[data_id].estimated_total_size.

    transfer_bandwidth_gbs: null
    # [required_agent] COMPUTED: data_volume_bytes / transfer_time_s / 1e9

    transfer_time_s: null
    # [required_profiler] Wall time from producer write start to consumer read end.
    # Source: DataLife timeline.

    transfer_pattern: null
    # [required_agent]
    # bulk_sequential:      one large sequential transfer
    # fine_grained_random:  many small random accesses (common: HDF5 chunked reads)
    # chunked_streaming:    medium-sized sequential transfers as data becomes available
    # _allowed_values: [bulk_sequential, fine_grained_random, chunked_streaming]

    match_ddd: null
    # [required_agent] boolean: physical_path consistent with DDD storage_tier_assignments.
    # false → data routed to different tier than planned; flag in anomalies.


# -----------------------------------------------------------------------------
# SECTION 4: DATA FORMAT OBSERVATIONS
# Per-dataset format details observed at runtime.
# Source: DaYu semantic analysis or Darshan access pattern heuristics.
# -----------------------------------------------------------------------------
data_format_observations:

  - dataset_id: null    # [required_agent] data_id from WDD data_objects.

    observed_container: null
    # [required_profiler] Detected file format.
    # Source: DaYu file type analysis or Darshan file extension heuristics.

    observed_access_pattern: null
    # [required_profiler] How this dataset was accessed.
    # _allowed_values: [contiguous_sequential, chunked_sequential, random, strided, mixed]

    observed_request_size_kb: null
    # [required_profiler] Average I/O request size in KB. Source: Darshan.

    match_wrd_format: null
    # [required_agent] boolean: observed_container matches WDD format_hint.container.
    # false → format mismatch; record in diagnosis_summary.anomalies.

    match_wrd_layout: null
    # [required_agent] boolean: observed_access_pattern consistent with WDD layout_hint.
    # contiguous_sequential matches contiguous; chunked_sequential matches chunked.
    # Mismatch (e.g., random access on contiguous layout) = potential format concern.


# -----------------------------------------------------------------------------
# SECTION 5: TEMPORAL I/O BEHAVIOR
# Timeline of I/O intensity across workflow wall time.
# Source: DataLife + DaYu timeline reconstruction.
# -----------------------------------------------------------------------------
temporal_io_behavior:

  workflow_wall_time_s: null    # [required_agent] Same as header.wall_time_seconds.

  - task_id: null    # [required_agent]

    task_start_offset_s: null    # [required_profiler] Seconds after workflow start.
    task_end_offset_s: null      # [required_profiler]
    task_wall_time_s: null       # [required_agent] COMPUTED: end - start.

    io_start_offset_s: null      # [required_profiler] First I/O operation timestamp.
    io_end_offset_s: null        # [required_profiler] Last I/O operation timestamp.
    io_active_duration_s: null   # [required_agent] COMPUTED: io_end - io_start.

    io_fraction_of_task: null
    # [required_agent] COMPUTED: io_active_duration_s / task_wall_time_s
    # High value (>0.5) on shared tier = contention risk.

    pipeline_overlap_observed: null
    # [required_agent] boolean
    # true if this task's io_start < previous task's io_end (stages overlapped in time).
    # Compare against DDD pipelining.overlap_strategy:
    #   DDD = full_overlap but observed = false → pipeline stall anomaly.


# -----------------------------------------------------------------------------
# SECTION 6: FILE LIFECYCLE EVENTS
# Per-file lifecycle from DataLife DFL-G.
# One entry per distinct file/object in the run.
# For high-cardinality runs (>100 files): agent may aggregate by data_id instead.
# -----------------------------------------------------------------------------
file_lifecycle_events:

  - file_path: null          # [required_profiler]
    data_id: null            # [required_agent] Matched to WDD data_objects data_id.
    tier_id: null            # [required_agent] Derived from file_path mount point.

    created_at_offset_s: null     # [required_profiler] Seconds after workflow start.
    first_read_at_offset_s: null  # [required_profiler]
    last_read_at_offset_s: null   # [required_profiler]
    deleted_at_offset_s: null     # [required_profiler] null if not deleted.

    idle_time_s: null
    # [required_agent] COMPUTED: first_read_at_offset_s - created_at_offset_s
    # Large idle_time on volatile tiers (burst buffer) wastes capacity.
    # Flag if > 10% of workflow wall time.

    lifetime_s: null
    # [required_agent] COMPUTED:
    #   If deleted: deleted_at_offset_s - created_at_offset_s
    #   If retained: workflow wall time - created_at_offset_s

    match_wrd_retention: null
    # [required_agent] boolean
    # intermediate: true if deleted after WDD last_consumer_phase; false if deleted early or retained too long.
    # checkpoint: true if retained; false if deleted.
    # false = retention anomaly; record in diagnosis_summary.anomalies.


# -----------------------------------------------------------------------------
# SECTION 7: DIAGNOSIS SUMMARY
# Machine-readable diagnosis structured to feed Tier 1 agents.
# Agent fills this section last, after all observation sections are populated.
# In predictive mode: all values are estimates with confidence records.
# -----------------------------------------------------------------------------
diagnosis_summary:

  overall_io_pattern: null
  # [required_agent]
  # _allowed_values: [pipeline, scatter_gather, iterative, cascading, hybrid]

  pattern_match_wrd: null
  # [required_agent] boolean
  # true if overall_io_pattern == WDD workflow_patterns.primary_pattern.
  # false = observed execution pattern diverged from structural expectation.

  bottleneck_summary: []
  # [required_agent] List of identified bottlenecks.
  # Detection heuristics:
  #   BANDWIDTH BOTTLENECK:
  #     observed_read/write_bandwidth < 50% of HRD tier peak AND compute_to_io_ratio > 0.6
  #   METADATA BOTTLENECK:
  #     (open_ops + close_ops) / (read_ops + write_ops) > 0.3 for any task
  #   CONTENTION BOTTLENECK:
  #     degradation_factor worse than HRD contention_model.degradation_factor
  #   STAGING BOTTLENECK:
  #     idle_time_s > 10% of workflow wall time for any large dataset
  #   PIPELINE STALL:
  #     pipeline_overlap_observed = false for DDD co_schedule = true pair
  #   MPI-IO AGGREGATOR MISMATCH:
  #     match_ddd_aggregator = false for any collective I/O task
  #
  # Entry schema:
  #   entity:          task_id, tier_id, or data_id where bottleneck manifests
  #   bottleneck_type: bandwidth | metadata | contention | staging_delay |
  #                    pipeline_stall | mpi_io_aggregator_mismatch | other
  #   severity:        high (>20% wall time impact) | medium (5–20%) | low (<5%)
  #   evidence:        specific metric values that identified this bottleneck

  optimization_opportunities: []
  # [required_agent] One entry per actionable optimization.
  # Entry schema:
  #   opportunity_type: increase_parallelism | reassign_storage_tier |
  #                     enable_pipelining | adjust_chunk_size | prefetch_input_data |
  #                     reduce_metadata_operations | add_checkpoint_replication |
  #                     adjust_cleanup_schedule | co_locate_pc_pair |
  #                     tune_mpi_io_aggregators | adjust_stripe_count | other
  #   affected_entities: list of task_ids, data_ids, or tier_ids
  #   estimated_impact:  plain-language estimate of expected improvement
  #   evidence:          IODD fields supporting this recommendation
  #   ddd_change_required: specific DDD field(s) that would change to implement this

  anomalies: []
  # [required_agent] Fields where observed values diverged from WDD or DDD plans.
  # Entry schema:
  #   anomaly_type: io_phase_mismatch | communication_path_mismatch |
  #                 format_mismatch | retention_mismatch | pattern_mismatch |
  #                 unexpected_contention | mpi_io_aggregator_mismatch | other
  #   entity:       task_id, data_id, or tier_id
  #   expected:     value predicted by WDD or DDD
  #   observed:     value actually observed
  #   recommendation: update WDD (if reality changed) or fix DDD (if deployment error)

  predictive_confidence_records: null
  # [required_agent] Required when header.predictive = true.
  # One record per estimated field:
  #   field_path, filled_by, confidence_level (high|medium|low|inferred),
  #   confidence_reason, requires_human_review
  # null in empirical mode (all values are measured).