# =============================================================================
# WIDGET — Workflow Definition Document (WDD) Agent Template
# Schema: wdd-5.0  |  Architecture Design: v5
#
# PURPOSE
# This file is the schema an AI agent reads before analyzing a workflow
# repository. The agent fills every field according to its _status annotation.
# Once all required fields are populated the WDD is a valid, self-contained
# description of the workflow's logical structure.
#
# The WDD captures ONLY what is derivable from static analysis of the source
# code — no profiling data, no hardware specifics, no deployment decisions.
# Those belong in the DDD, HRD, GD, and IODD respectively.
#
# FIELD STATUS MODEL
#   required_static       Extract from workflow source code via static analysis.
#                         If extraction fails, escalate to required_static_ask.
#
#   required_static_ask   Cannot be reliably extracted from code.
#                         Agent MUST prompt the scientist before proceeding.
#
# COMPLETENESS GATE
# The WDD is complete when ALL of the following are true:
#   [ ] All required_static fields are non-null
#   [ ] All required_static_ask fields are non-null
#   [ ] workflow_graph.integrity_hash is current against pc_edges
#   [ ] All required_task_sets in execution_profiles were AUTO-DERIVED
#   [ ] translation_metadata.field_confidence_records has one entry per
#       agent-inferred field
#   [ ] Any requires_human_review: true field has been reviewed or
#       explicitly deferred by the scientist
#
# ID NAMESPACE (shared across all five WIDGET documents)
#   Stages:    stage:<descriptor>    e.g.  stage:simulation
#   Tasks:     task:<descriptor>     e.g.  task:contact_map
#   Datasets:  data:<descriptor>     e.g.  data:trajectory_frames
#   P-C edges: pc:<prod>-><cons>:<pattern>
#   Hints:     hint:<short_name>
#   Profiles:  profile:<name>
# =============================================================================


# -----------------------------------------------------------------------------
# METADATA
# -----------------------------------------------------------------------------
metadata:

  workflow_lineage_id:
    _status: required_static
    _extract: >
      Generate a new UUID v4 for a new workflow. Preserve existing
      lineage_id when recompiling an existing WDD.
      Companion documents (DDD, IODD) pin to this ID + a specific version.
    _value: null

  version:
    _status: required_static
    _extract: >
      Set to "1.0.0" for first compilation. Increment on any structural
      change (task added/removed, edge changed, stage added/removed).
      Data enrichments do NOT increment the version — they update in place.
    _value: null

  version_notes:
    _status: required_static
    _extract: >
      For first compilation: "Initial WDD compiled from <source_file>".
      For updates: describe structural changes made.
    _value: null

  deprecated:
    _status: required_static
    _extract: Set to false for all new WDDs.
    _value: null

  workflow_name:
    _status: required_static
    _extract: >
      Look in: README heading, Nextflow manifest.name, Pegasus workflow
      name attribute, Snakemake configfile title, script filename.
    _value: null

  workflow_description:
    _status: required_static_ask
    _extract: >
      Look in: README first paragraph, Nextflow manifest.description,
      workflow file header comment block. Validate quality: must be >20
      words and contain domain-specific nouns. If insufficient, ask.
    _prompt: >
      Please describe this workflow. Include: what scientific problem it
      solves, what domain it belongs to, what data it starts from, and
      what results it ultimately produces. (Minimum 2-3 sentences.)
    _quality_check: { min_words: 20, must_contain_domain_nouns: true }
    _value: null

  source_repository:
    _status: required_static
    _extract: URL or path to the analyzed codebase.
    _value: null

  source_commit:
    _status: required_static
    _extract: >
      Git commit hash of the analyzed revision. Set to null if no git
      history is available.
    _value: null

  source_format:
    _status: required_static
    _extract: >
      Detect from file extension and content:
      native | compiled_from_nextflow | compiled_from_pegasus_dax |
      compiled_from_parsl | compiled_from_slurm | compiled_from_snakemake |
      compiled_from_swift_t | other
    _allowed_values:
      - native
      - compiled_from_nextflow
      - compiled_from_pegasus_dax
      - compiled_from_parsl
      - compiled_from_slurm
      - compiled_from_snakemake
      - compiled_from_swift_t
      - other
    _value: null

  source_file:
    _status: required_static
    _extract: Path to the primary workflow definition file in the repository.
    _value: null

  schema_version:
    _status: required_static
    _extract: Always set to "wdd-5.0".
    _value: "wdd-5.0"

  generated_by:
    _status: required_static
    _extract: Name and version of the agent performing compilation (e.g., "claude-code-3.7").
    _value: null

  generated_at:
    _status: required_static
    _extract: ISO 8601 timestamp at WDD compilation time.
    _value: null

  last_modified_at:
    _status: required_static
    _extract: ISO 8601 timestamp. Same as generated_at on first compilation.
    _value: null


# -----------------------------------------------------------------------------
# SECTION A: STAGE CATALOG
# Logical groupings of tasks that achieve a distinct workflow milestone.
# Stages execute in a defined order; tasks within a stage may run in parallel.
# Stages give agents a coarser reasoning granularity before drilling to tasks.
# -----------------------------------------------------------------------------
stages:
  # Agent populates as a list of stage objects matching _stage_schema.

  _stage_schema:

    stage_id:
      _status: required_static
      _extract: >
        Normalize stage name to snake_case. Prefix with "stage:".
        Example: stage:simulation, stage:aggregation, stage:training.
      _value: null

    name:
      _status: required_static
      _extract: Human-readable stage name.
      _value: null

    order:
      _status: required_static
      _extract: 1-indexed integer execution order. Assign from DAG topology.
      _value: null

    description:
      _status: required_static
      _extract: >
        What this stage accomplishes in the workflow. 1-2 sentences.
      _value: null

    tasks:
      _status: required_static
      _extract: >
        List of task_id values belonging to this stage.
        Derived from task_catalog entries with this stage_id.
      _value: []


# -----------------------------------------------------------------------------
# SECTION B: TASK CATALOG
# Every distinct executable unit in the workflow.
# Canonical source of truth for all task structure and relationships.
# workflow_graph is derived from this section — never edited directly.
# -----------------------------------------------------------------------------
tasks:
  # Agent populates as a list of task objects matching _task_schema.

  _task_schema:

    task_id:
      _status: required_static
      _extract: >
        Normalize task/process/function name from source code to snake_case.
        Must be unique within this WDD. Use prefix "task:" in cross-document
        references (e.g., task:contact_map).
      _value: null

    name:
      _status: required_static
      _extract: >
        Human-readable form of task_id. Convert underscores to spaces and
        apply title case (e.g., preprocess_era5 → "ERA5 Preprocessing").
      _value: null

    stage:
      _status: required_static
      _extract: stage_id of the stage this task belongs to.
      _value: null

    executable:
      _status: required_static
      _extract: >
        Script or binary called by this task. Look in: process script blocks,
        subprocess calls, exec() calls, app() decorators, sbatch --wrap.
      _value: null

    description:
      _status: required_static_ask
      _extract: >
        Infer from: process docstring, inline comments, input/output variable
        names, executable name. Construct a 2-4 sentence candidate description
        covering: what it does in domain terms, what data it reads, what it
        produces, and why it exists. Quality check: >20 words, domain-specific
        nouns present. If candidate fails quality check, ask.
      _prompt: >
        I could not generate a sufficient description for task '{task_id}'.
        What does this task do? Please include: what it does in domain terms,
        what data it reads, what data it produces, and why it exists in the
        workflow.
      _quality_check: { min_words: 20, must_contain_domain_nouns: true }
      _confidence_record:
        filled_by: null
        confidence_level: null   # high | medium | low | inferred
        confidence_reason: null
        requires_human_review: null
      _value: null

    behavioral_notes:
      _status: required_static
      _extract: >
        I/O-relevant behaviors observable from the code. Focus on I/O
        behavior, not scientific meaning. Address:
          - Reads all input at startup or streams incrementally?
          - Writes output at completion or incrementally?
          - Internal iteration or checkpointing?
          - Memory patterns: loads full dataset vs. chunked processing?
          - Notable access patterns (random, strided, sequential)?
      _value: null

    parallelism_model:
      _status: required_static
      _extract: >
        Structural parallelism as visible in the source code.
        Infer type from: for-loops/map over input sets
        (embarrassingly_parallel), MPI collectives (data_parallel),
        task graph fan-out (task_parallel).
      _parallelism_type:
        _allowed_values: [serial, embarrassingly_parallel, data_parallel, task_parallel]
        _value: null
      _parallelism_description:
        _extract: >
          How multiple instances relate to each other.
          E.g., "Each instance processes one chromosome independently."
          Or "All instances share a global model and synchronize gradients."
        _value: null

    io_dominance:
      _status: required_static
      _extract: >
        Infer from ratio of I/O calls to compute operations in script.
        Write "unknown" if not determinable from code alone.
      _allowed_values: [compute_bound, io_bound, balanced, unknown]
      _value: unknown

    output_class:
      _status: required_static_ask
      _extract: >
        Attempt inference: terminal DAG tasks (no downstream consumers) are
        likely checkpoint. Tasks whose outputs feed directly into the next
        task with no standalone scientific value are likely intermediate.
        Always validate with scientist — this cannot be reliably inferred
        from code.
      _prompt: >
        Does task '{task_id}' produce outputs that are scientifically
        valuable to retain after the workflow completes (checkpoint), or are
        they only needed to pass data to the next task and can be deleted
        after use (intermediate)?
      _allowed_values: [intermediate, checkpoint]
      _value: null

    inputs:
      _status: required_static
      _extract: >
        List of data_id values this task reads. Sources:
          Nextflow:    input declarations in process block
          Pegasus DAX: <uses link="input"> file elements on this job
          Parsl:       function parameters accepting Future objects
          Slurm:       files referenced in --input or script read paths
          Snakemake:   input: file paths for this rule
      _value: []

    outputs:
      _status: required_static
      _extract: >
        List of data_id values this task writes. Sources: mirror of inputs
        but for output declarations/write paths.
      _value: []


# -----------------------------------------------------------------------------
# SECTION C: DATA OBJECT REGISTRY
# Every logical data object flowing through the workflow.
# Logical descriptions only — not bound to physical paths or storage tiers.
# C.1: Semantic layer (always required)
# C.2: Lifecycle layer (DAG-derivable)
# -----------------------------------------------------------------------------
data_objects:
  # Agent populates as a list of data object entries matching _data_schema.

  _data_schema:

    # --- C.1: Semantic Layer -----------------------------------------------

    data_id:
      _status: required_static
      _extract: >
        Derive from channel name, file variable name, or output filename
        pattern. Normalize to snake_case. Prefix with "data:" in
        cross-document references (e.g., data:trajectory_frames).
      _value: null

    name:
      _status: required_static
      _extract: Human-readable form of data_id.
      _value: null

    description:
      _status: required_static_ask
      _extract: >
        Infer from variable name, file extension, surrounding code context.
        Quality check: >20 words, domain nouns present.
      _prompt: >
        What does dataset '{data_id}' represent scientifically?
        (e.g., "Per-simulation HDF5 file containing contact maps and point
        clouds for one protein trajectory, produced by OpenMM.")
      _value: null

    category:
      _status: required_static
      _extract: >
        input:        external data entering the workflow (no producer task).
        intermediate: produced by a task, consumed downstream, no standalone
                      scientific value.
        output:       final result consumed outside this workflow.
        checkpoint:   has standalone scientific value; must be retained.
        config:       parameter files, run configs — NOT part of the P-C data
                      flow. Prevents agents from staging or cleaning up configs.
      _allowed_values: [input, intermediate, output, checkpoint, config]
      _value: null

    persistence:
      _status: required_static
      _extract: >
        transient:       exists only within one task execution.
        stage_scoped:    exists for the duration of its stage.
        workflow_scoped: exists for the full workflow run.
        persistent:      survives across workflow runs.
      _allowed_values: [transient, stage_scoped, workflow_scoped, persistent]
      _value: null

    format_hint:
      _status: required_static
      _extract: >
        Inspect file-creation code. Capture what is visible in source.
        Mark unknown fields as null.

      container:
        _allowed_values: [HDF5, netCDF4, CSV, parquet, tar, plain_binary, text, JSON, unknown]
        _value: null

      datasets:
        # For HDF5/netCDF4 only: list dataset-level details visible in
        # file-creation code. Omit this list for all other formats.
        _dataset_entry_schema:
          dataset_name: { _value: null }     # name within the container
          description:  { _value: null }     # what this dataset holds
          dtype:        { _value: null }     # float32 | int64 | string | etc.
          shape_hint:   { _value: null }     # e.g., "[N_frames, N_atoms, 3]"
        _value: []

      compression:
        _allowed_values: [none, gzip, lzf, lz4, zstd, blosc, unknown]
        _value: null

      layout_hint:
        _allowed_values: [contiguous, chunked, unknown]
        _value: null

      typical_request_size_kb:
        _extract: >
          Estimated I/O request size from code inspection (e.g., HDF5 chunk
          size set in the file-creation call). Null if not determinable.
        _value: null

    cardinality:
      _status: required_static
      _extract: >
        How many instances of this data object exist at runtime?
        Infer from loop structures, job arrays, or scatter patterns.
        E.g., "one per chromosome (22 total)", "one per simulation task
        (12 instances)", "single global file".
      _value: null

    estimated_size_hint:
      _status: required_static
      _extract: >
        Order-of-magnitude size if inferrable from code.
        E.g., "~50–200 MB per instance" or "small config file, <1 KB".
        Write "unknown" if not determinable from code alone.
      _value: null

    producer_task:
      _status: required_static
      _extract: task_id of the writing task. Null for external inputs.
      _value: null

    consumer_tasks:
      _status: required_static
      _extract: List of task_id values that read this dataset.
      _value: []

    # --- C.2: Lifecycle Layer (DAG-derivable) --------------------------------
    # All fields in this layer are derived purely from DAG topology and the
    # semantic layer above — no profiling or runtime data is needed or used.

    lifecycle:

      creation_phase:
        _status: required_static
        _extract: >
          The task_id whose completion creates this dataset.
          Derived from producer_task in the semantic layer.
        _value: null

      last_consumer_phase:
        _status: required_static
        _extract: >
          The task_id of the last consumer in topological execution order.
          Derived from consumer_tasks and DAG ordering.
        _value: null

      retention_window:
        _status: required_static
        _extract: >
          The span between creation_phase and last_consumer_phase expressed
          as task completion events. Derivable from DAG topology alone.
          Format: "from task:X completion to task:Y completion"
        _value: null

      access_frequency_class:
        _status: required_static
        _extract: >
          Derived from consumer_tasks count and loop context:
          once:        single consumer, no loop
          few_times:   2-5 consumer accesses total
          repeatedly:  consumed in a loop or by many consumers (>5)
        _allowed_values: [once, few_times, repeatedly]
        _value: null

      consumer_count:
        _status: required_static
        _extract: >
          Number of distinct consumer task instances in a typical run.
          For loop tasks: estimate from loop cardinality if statically known.
        _value: null


# -----------------------------------------------------------------------------
# SECTION D: PRODUCER–CONSUMER EDGES
# Every data dependency between tasks. Encodes relationship structure —
# not just which data objects exist.
# coupling describes a structural property of the workflow derivable from
# code: tight = consumer requires producer to fully complete; loose =
# consumer can begin on partial or streaming output.
# -----------------------------------------------------------------------------
pc_edges:
  # Agent populates as a list of edge objects matching _edge_schema.
  # One edge per producer-consumer task pair, carrying ALL shared datasets.
  # Do NOT create one edge per dataset for a single task relationship.

  _edge_schema:

    edge_id:
      _status: required_static
      _extract: >
        Format: pc:<producer_task_id>-><consumer_task_id>:<pattern>
        Example: pc:openmm->aggregate:n_to_1
      _value: null

    producer:
      _status: required_static
      _extract: task_id of the producing task.
      _value: null

    consumer:
      _status: required_static
      _extract: task_id of the consuming task.
      _value: null

    data_objects:
      _status: required_static
      _extract: >
        List of data_id values carried by this edge.
        One edge carries ALL datasets shared between a given producer-consumer
        pair — even if they are in a single container (e.g., one HDF5 file
        with four datasets = one edge with one data_id).
      _value: []

    pc_pattern:
      _status: required_static
      _extract: >
        1_to_1: single producer instance, single consumer instance
        1_to_n: single producer, multiple consumer instances (fan-out or broadcast)
        n_to_1: multiple producer instances, single consumer (fan-in/aggregation)
        n_to_n: multiple producers and multiple consumers (all-to-all exchange)
        Derive from cardinality of producing and consuming task instances.
      _allowed_values: [1_to_1, 1_to_n, n_to_1, n_to_n]
      _value: null

    pc_pattern_rationale:
      _status: required_static
      _extract: >
        Why this classification? Reference the actual producer and consumer
        cardinalities. E.g., "All 12 parallel simulation tasks produce
        trajectory files consumed by a single aggregate task → n_to_1."
      _value: null

    data_flow_description:
      _status: required_static
      _extract: >
        What data moves, how it is accessed (full read, partial read,
        streamed), and any notable characteristics. E.g., "Consumer reads
        only 3 of 4 HDF5 datasets from each producer file."
      _value: null

    coupling:
      _status: required_static
      _extract: >
        tight: consumer cannot begin until producer fully completes and
               data is written. No pipeline overlap is possible.
        loose: consumer can begin on partial/streaming output. Pipeline
               overlap is possible.
        Determine by examining whether the consumer opens the file after
        producer signals completion, or whether it polls/streams.
      _allowed_values: [tight, loose]
      _value: null

    coupling_rationale:
      _status: required_static
      _extract: >
        Why this coupling? Reference the code behavior that implies it.
        E.g., "Aggregate waits for a completion signal from all simulation
        tasks before opening any file — tight."
      _value: null

    communication_pattern:
      _status: required_static
      _extract: >
        shared_file:      multiple producer instances write to / multiple
                          consumers read from a single shared file.
        file_per_producer: each producer instance writes its own file;
                          consumer reads all of them.
        in_memory:        data passed in memory without touching disk.
        streaming_channel: data streamed through a pipe or shared buffer.
        Observe from code: shared path vs. per-instance path templates.
      _allowed_values: [shared_file, file_per_producer, in_memory, streaming_channel]
      _value: null

    data_volume_class:
      _status: required_static
      _extract: >
        Agent-estimated from cardinality × estimated_size_hint.
        small: <1 GB total  |  medium: 1–100 GB  |  large: >100 GB
      _allowed_values: [small, medium, large]
      _value: null


# -----------------------------------------------------------------------------
# SECTION E: WORKFLOW GRAPH
# Derived from Task Catalog and P-C Edges. Never edited directly.
# integrity_hash must match pc_edges on every read.
# -----------------------------------------------------------------------------
workflow_graph:

  integrity_hash:
    _status: required_static
    _extract: >
      Compute SHA-256 of the canonical serialization of all pc_edges.
      Any agent reading this graph must verify this hash before use.
      Hash mismatch = reject and request regeneration.
    _value: null

  last_generated:
    _status: required_static
    _extract: ISO 8601 timestamp of graph generation.
    _value: null

  dag_edges:
    _status: required_static
    _extract: >
      List of {from, to, via} objects derived from pc_edges.
      from: producer task_id
      to:   consumer task_id
      via:  edge_id
      One entry per pc_edge. Deduplicated.
    _value: []

  loop_groups:
    _status: required_static
    _extract: >
      Group tasks by shared loop participation. For each loop:
        loop_id:   descriptive identifier (e.g., "ddmd_iteration_loop")
        tasks:     list of task_ids inside the loop body
        loop_type: static | parameter_sweep | data_driven | convergence
        note:      brief description of the loop structure and termination
      Detect from: foreach/for loops in scripts, scatter/gather in Nextflow
      channels, map() in Parsl, Slurm job arrays, Snakemake expand().
    _value: []

  critical_path_hint:
    _status: required_static
    _extract: >
      Longest sequential dependency chain if determinable from static analysis.
      Write "indeterminate from static analysis" if runtime-dependent.
    _value: null

  control_flow:

    has_iteration:
      _status: required_static
      _extract: true if the workflow contains any loop structure; else false.
      _value: null    # boolean

    iteration_description:
      _status: required_static
      _extract: >
        Required when has_iteration = true; null otherwise.
        Describe: what triggers a new iteration, which stages repeat, what
        data carries across iterations, convergence criterion if any, whether
        iteration count is known at submission time or runtime-determined.
      _value: null

    has_conditional_branches:
      _status: required_static
      _extract: true if the workflow has tasks that execute conditionally; else false.
      _value: null    # boolean

    conditional_description:
      _status: required_static
      _extract: >
        Required when has_conditional_branches = true; null otherwise.
        Describe: what condition is evaluated, which tasks are skipped or
        selected, what data or parameter drives the branch.
      _value: null

  stage_execution_order:
    _status: required_static
    _extract: >
      Ordered list of stage_ids in topological execution order.
      Flat list enabling stage-level reasoning without full DAG traversal.
    _value: []

  cross_reference:
    # Flat lookup table. Auto-derived — never manually edited.
    # Removes multi-hop traversal cost for downstream agents.

    task_to_stage:
      _status: required_static
      _extract: >
        Map of task_id → stage_id for all tasks. Derived from task catalog.
      _value: {}    # { "task:<n>": "stage:<n>", ... }

    data_to_producer:
      _status: required_static
      _extract: >
        Map of data_id → producer task_id. Null for external inputs.
      _value: {}    # { "data:<n>": "task:<n>", ... }

    data_to_consumers:
      _status: required_static
      _extract: >
        Map of data_id → list of consumer task_ids.
      _value: {}    # { "data:<n>": ["task:<n>", ...], ... }


# -----------------------------------------------------------------------------
# SECTION F: WORKFLOW-LEVEL PATTERN CLASSIFICATION
# Classification per the IPDPS '26 taxonomy.
# -----------------------------------------------------------------------------
workflow_patterns:

  primary_pattern:
    _status: required_static
    _extract: >
      Derive from DAG topology and control flow annotations.
        cascading:      linear chain of stages, no fan-out, no loops
        scatter_gather: fan-out from one task to N parallel instances
                        followed by fan-in to one aggregation task
        iterative:      one or more convergence or time-stepping loops
        pipeline:       stages overlap in time with streaming data
                        (loose coupling throughout)
        broadcast:      one task provides the same shared input to many
        checkpointing:  saves task state for restart/recovery
        conditional:    tasks execute only if a runtime condition is met
        hybrid:         combines two or more of the above at different stages
    _allowed_values:
      [cascading, scatter_gather, iterative, pipeline, broadcast,
       checkpointing, conditional, hybrid]
    _value: null

  secondary_patterns:
    _status: required_static
    _extract: >
      Required when primary_pattern = hybrid. List additional patterns
      that describe specific stages or sub-structures. Empty list otherwise.
    _value: []

  classification_rationale:
    _status: required_static
    _extract: >
      Justify the classification by referencing the DAG structure, P-C
      patterns, and control flow. Document the graph features that support
      the claim (e.g., out-degree counts, loop presence, coupling types).
    _value: null

  pattern_table_row:
    _status: required_static
    _extract: >
      Single-row summary matching Table III from the IPDPS '26 paper:
      Workflow | #Stages | #Task Instances | P-C Patterns | Workflow-level I/O Patterns
    _value: null


# -----------------------------------------------------------------------------
# SECTION G: I/O BEHAVIORAL HINTS
# Static-analysis-visible I/O concerns. Code-inspection equivalent of
# DaYu's runtime observations. Gives diagnosis agents a pre-loaded list
# of suspicions before any profiling has run.
#
# Concern vocabulary:
#   partial_access            task reads only a subset of a file's contents
#   format_mismatch           layout choice mismatched to access pattern
#   small_file_overhead       many small files where one larger file would suffice
#   unnecessary_serialization aggregation exists only to combine for one consumer
#   data_reuse                same data read by multiple tasks or re-read intra-task
#   checkpoint_waste          checkpoints written but not read in normal execution path
#   metadata_overhead         many datasets or small files causing metadata-heavy I/O
#   unknown                   concern visible but does not fit above categories
# -----------------------------------------------------------------------------
io_behavioral_hints:
  # Agent populates as a list of hint objects matching _hint_schema.
  # Step: re-read task source code looking for each concern type.
  # Requires reading both file-creation code and file-reading code together.
  # An empty list is valid if no concerns are found.

  _hint_schema:

    hint_id:
      _status: required_static
      _extract: >
        Format: hint:<short_name>. Descriptive snake_case label.
        Example: hint:partial_access_training, hint:unnecessary_serialization
      _value: null

    description:
      _status: required_static
      _extract: >
        Specific observation. Name the task, name the file/dataset, describe
        the pattern and why it is a concern. E.g., "The aggregate task opens
        all 12 simulation output files sequentially but reads only 3 of 4
        HDF5 datasets from each — potential partial file access waste (~30%
        of data written and never consumed by downstream tasks)."
      _value: null

    affected_tasks:
      _status: required_static
      _extract: List of task_ids where this concern manifests.
      _value: []

    affected_data:
      _status: required_static
      _extract: List of data_ids associated with this concern.
      _value: []

    potential_concern:
      _status: required_static
      _allowed_values:
        [partial_access, format_mismatch, small_file_overhead,
         unnecessary_serialization, data_reuse, checkpoint_waste,
         metadata_overhead, unknown]
      _value: null


# -----------------------------------------------------------------------------
# SECTION H: EXECUTION PROFILES
# Named partial execution subsets representing scientifically meaningful
# stopping points. Agent proposes from checkpoint tasks; scientist confirms.
# required_task_set is ALWAYS auto-derived — never manually specified.
# -----------------------------------------------------------------------------
execution_profiles:
  # Agent populates as a list of profile objects matching _profile_schema.
  # Proposal protocol:
  #   1. Identify all tasks with output_class = checkpoint.
  #   2. Propose one profile per checkpoint task in topological order,
  #      plus one "full" profile for the complete workflow.
  #   3. Present to scientist: "I found checkpoint tasks at {task_list}.
  #      I suggest profiles: {proposed_profiles}. Are these meaningful
  #      scientific stopping points? Should any be removed or renamed?"
  #   4. required_task_set MUST be auto-derived by backward DAG traversal
  #      from terminal_task_id — never manually specified.

  _profile_schema:

    profile_name:
      _status: required_static_ask
      _prompt: >
        What should this execution profile be named?
        (e.g., "tracks_only", "model_checkpoint", "full")
      _value: null

    terminal_task_id:
      _status: required_static
      _extract: The task_id of the last task required for this profile.
      _value: null

    description:
      _status: required_static_ask
      _prompt: >
        What scientific results does the '{profile_name}' profile produce?
        What would a scientist use this stopping point for?
      _value: null

    required_task_set:
      _status: required_static
      _extract: >
        AUTO-DERIVED ONLY by backward DAG traversal from terminal_task_id.
        Never manually specified. Recompute whenever workflow_graph changes.
      _value: []

    output_dataset_ids:
      _status: required_static
      _extract: >
        data_ids with category = checkpoint or output whose producer_task
        is in required_task_set.
      _value: []


# -----------------------------------------------------------------------------
# SECTION I: TRANSLATION METADATA
# Full provenance of how this WDD was produced.
# -----------------------------------------------------------------------------
translation_metadata:

  source_format:
    _status: required_static
    _extract: Same as metadata.source_format.
    _value: null

  source_file:
    _status: required_static
    _extract: Same as metadata.source_file.
    _value: null

  translation_tool:
    _status: required_static
    _extract: Name and version of the agent performing compilation.
    _value: null

  translation_timestamp:
    _status: required_static
    _extract: ISO 8601 timestamp.
    _value: null

  unmapped_fields:
    _status: required_static
    _extract: >
      List every field that could not be populated from the source, with
      reason. Empty list is valid if all extractable fields were found.
    _value: []
    _entry_schema:
      field_path: null
      reason: null

  round_trip_gaps:
    _status: required_static
    _extract: >
      List fields that would be lost if this WDD is compiled back to the
      source format (e.g., description has no representation in Pegasus DAX;
      execution_profiles have no Nextflow equivalent).
    _value: []
    _entry_schema:
      field_path: null
      note: null

  quality_warnings:
    _status: required_static
    _extract: >
      List description fields that failed the quality check (<20 words or
      no domain nouns). These are review flags, not blockers.
    _value: []
    _entry_schema:
      field_path: null
      warning: null

  field_confidence_records:
    _status: required_static
    _extract: >
      One record for every field the agent inferred rather than extracted
      directly. At minimum cover: all description fields, all pc_pattern
      fields, workflow_patterns, io_dominance per task, behavioral_notes
      per task, all io_behavioral_hints, all execution_profile proposals.
    _value: []
    _entry_schema:
      field_path: null
      filled_by: null
      confidence_level: null    # high | medium | low | inferred
      confidence_reason: null
      requires_human_review: null