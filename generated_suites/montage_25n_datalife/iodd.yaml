header:
  iodd_id: iodd:deploy:montage_scale_a_25n:datalife
  ddd_id: deploy:montage:scale_a_25n:functional_trace
  hrd_id: hrd:delta_ncsa_cpu
  wrd_lineage_id: wrd:montage
  edd_lineage_id: edd:montage:scale_a_25tile
  edd_instance_id: montage_scale_a_25tile_inst_001
  wall_time_seconds: unknown
  predictive: false
  profiling_tools: ["DataLife"]
  schema_version: iodd-7.0
  description: >-
    DataLife data-flow profile of the Montage Scale-A 25-node run, aggregated
    across 83 per-process traces (one per Montage binary per node) using the
    DataLife monitor block. Read/write byte totals reconcile exactly to the
    known run aggregates (378,039,388 B read / 204,280,001 B written). The
    pipeline is read-dominated by the difference stage (mDiffExec reads 270 MB
    re-reading the projected FITS tiles) and write-dominated by the reproject
    stage (mProjExec writes 107 MB of projected FITS + area tiles); all I/O is
    4 KB-block STDIO on cfitsio FITS plus tiny-record POSIX .tbl tables on
    tier:projects_lustre. DataLife is a data-flow / lifecycle profiler:
    request-size histograms, sequential/random classification, file-system
    module breakdowns, and wall-clock task/I-O timelines are not captured by
    datalife, so all temporal-offset, bandwidth-vs-peak, and access-pattern
    classification fields below are marked unknown / not captured by datalife.

per_task_io_profile:
  - task_id: task:imgtbl_raw
    instance_count: 1
    storage_tier_used: tier:projects_lustre
    note_task_attribution: >-
      DataLife aggregates by binary name; mImgtbl serves task:imgtbl_raw,
      task:imgtbl_projected, and task:imgtbl_corrected. Only 3 mImgtbl process
      traces were captured and they cannot be separated per WDD task, so the
      mImgtbl byte/op totals (read=152746 B, write=1545 B, read_ops=106,
      write_ops=21, open=115, close=115) are reported once on task:imgtbl_raw
      and the other two mImgtbl tasks carry the per-task-attribution caveat.
    bytes_read: 152746
    bytes_written: 1545
    read_ops: 106
    write_ops: 21
    open_ops: 115
    close_ops: 115
    posix_read_time_s: 0.002773
    posix_write_time_s: 0.000162
    posix_open_time_s: 2.728918
    posix_close_time_s: 3.668703
    observed_read_bandwidth_gbs: 0.0551
    observed_write_bandwidth_gbs: 0.0095
    access_pattern_observed: unknown
    io_phase_observed: unknown
    compute_to_io_ratio: unknown
    field_confidence:
      access_pattern_observed: "not captured by datalife (no sequential/random counters)"
      io_phase_observed: "not captured by datalife (no per-op wall-clock timeline)"
      compute_to_io_ratio: "not computable: task wall time not captured by datalife"
      task_attribution: "mImgtbl totals span 3 WDD tasks; reported here in aggregate"
