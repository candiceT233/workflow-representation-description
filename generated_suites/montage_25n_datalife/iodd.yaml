diagnosis_summary:
  overall_io_pattern: cascading
  pattern_match_wrd: false
  pattern_match_note: >-
    WDD primary_pattern is hybrid (scatter_gather embedded in a cascade); the
    datalife data-flow view confirms the cascade plus the scatter fan-out / gather
    structure but datalife alone classifies the realized flow as cascading and
    cannot resolve the full hybrid label, so pattern_match_wrd is set false with
    this caveat rather than asserting a confident mismatch.
  bottleneck_summary:
    - entity: task:diff
      bottleneck_type: other
      severity: medium
      evidence: >-
        mDiffExec is the dominant reader (270.3 MB, 71% of all read bytes) and
        carries the largest cumulative open+close time (8.70 s open + 61.95 s
        close summed across 25 shards, 1803 fopen events) re-reading projected
        FITS pairs - a metadata/open-heavy and data-reuse hotspot. Note: whether
        this is wall-time-significant cannot be confirmed because task wall time
        and bandwidth-vs-tier-peak are not captured by datalife.
    - entity: data:projected_fits
      bottleneck_type: other
      severity: medium
      evidence: >-
        projected_fits is produced once (107 MB write by mProjExec) and re-read
        across diff (270 MB), background, and imgtbl_projected stages, confirming
        the WDD hint:projected_fits_reuse data-reuse pattern.
  optimization_opportunities:
    - opportunity_type: prefetch_input_data
      affected_entities: [task:diff, data:projected_fits]
      estimated_impact: >-
        Caching or node-local staging of projected FITS tiles before the diff
        fan-out could cut the 270 MB re-read and the 1803 cross-node fopen events;
        magnitude not quantifiable without wall-clock timeline (not captured by datalife).
      evidence: "task:diff bytes_read=270329324; data:projected_fits reused by 3 consumer stages"
      ddd_change_required: "storage_tier_assignments[data:projected_fits].caching_policy / assigned_tier (e.g. node-local stage-in)"
  anomalies:
    - anomaly_type: other
      entity: task:background
      expected: "25 mBgExec instances (DDD parallelism_instances=25)"
      observed: "only 2 mBgExec process traces captured by datalife"
      recommendation: "Investigate datalife instrumentation coverage of the background fan-out; mBgExec byte totals (8.48 MB read / 8.46 MB write) undercount the stage. Not a workflow defect - a profiling-coverage gap."
    - anomaly_type: other
      entity: task:imgtbl_raw
      expected: "3 distinct mImgtbl tasks (imgtbl_raw, imgtbl_projected, imgtbl_corrected) with separate I/O totals"
      observed: "datalife aggregates all mImgtbl invocations by binary name (3 traces, not per-WDD-task separable)"
      recommendation: "Per-task attribution for repeated binaries is not captured by datalife; treat mImgtbl totals as stage-spanning."
