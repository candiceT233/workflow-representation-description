file_lifecycle_events:
  field_confidence:
    timeline: "not captured by datalife in this trace suite: per-file created_at/first_read_at/last_read_at/deleted_at wall-clock offsets are absent. DataLife _stat files provide per-file block-access frequency histograms and per-file read/write op decomposition (mapping each FITS/.tbl file to its data_id and confirming 4 KB-block access), but no lifecycle timestamps, so idle_time_s, lifetime_s, and match_wrd_retention cannot be computed."
  observed_file_to_data_id_map:
    - data_id: data:raw_fits_tiles
      file_glob: "tile_RR_CC.fits"
