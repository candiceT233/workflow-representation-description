file_lifecycle_events:
  field_confidence:
    note: >-
      Per-file creation / first-read / last-read / deletion timeline and
      idle_time/lifetime are NOT captured by darshan. Darshan records per-process
      open/read/write/seek counts, bytes, and first/last I/O timestamps within a
      single process, but does not track a file's cross-process lifecycle
      (creation by a producer process vs first read by a separate consumer
      process vs deletion). This section is a DataLife DFL-G capability. The
      only lifecycle-adjacent fact darshan confirms is that intermediate FITS
      and .tbl files were created on tier:projects_lustre (mount /projects,
      Lustre) and re-read by later stages (e.g. projected FITS read by
      imgtbl_projected, diff, and background - data reuse), consistent with WDD
      retention windows; precise deletion/idle timing is unknown.

diagnosis_summary:
  overall_io_pattern: cascading
  pattern_match_wrd: false
  bottleneck_summary:
    - entity: task:diff
      bottleneck_type: metadata
      severity: medium
      evidence: >-
        25-shard aggregate STDIO_F_META_TIME = 10.93 s with 1853 opens vs
        99,493 reads ((opens)/(reads+writes) = 0.015 overall but meta_time
        dominates total I/O time 3.32 s of read+write); per-pair re-open of
        projected FITS and region.hdr (507 region.hdr opens) drives open/metadata
        overhead. Heaviest reader (269.9 MB) re-reading projected tiles confirms
        WDD hint:projected_fits_reuse.
    - entity: task:imgtbl_projected
      bottleneck_type: metadata
      severity: low
      evidence: >-
        STDIO_F_META_TIME 1.17 s dominates a task that moves only 95 KB; the
        directory-wide FITS header scan is metadata-bound, matching WDD
        hint:corrections_broadcast_metadata.
  optimization_opportunities:
    - opportunity_type: adjust_stripe_count
      affected_entities: [data:projected_fits, data:diff_fits, tier:projects_lustre]
      estimated_impact: >-
        All instrumented FITS files use Lustre stripe_count=1 (single OST, PFL
        ddn_nvme first 64 KB then ddn_hdd). For the larger projected/diff FITS
        re-read at 25-way fan-out, increasing stripe_count (lfs setstripe -c 4)
        could spread the 270 MB diff-stage reads across more OSTs and reduce
        single-OST contention; impact modest at this 25-node scale but relevant
        for Scale-B.
      evidence: LUSTRE_COMP*_STRIPE_COUNT=1 on all profiled .fits records.
      ddd_change_required: staging_plan.stripe_setup_commands / storage_tier_assignments stripe tuning.
    - opportunity_type: reduce_metadata_operations
      affected_entities: [task:diff, task:imgtbl_projected, task:imgtbl_corrected]
      estimated_impact: >-
        Metadata/open time dominates the table-scan and diff stages; reducing
        repeated region.hdr opens (507 across diff shards) or caching headers
        would cut the 10.93 s aggregate meta time on diff.
      evidence: STDIO_F_META_TIME high relative to read/write time on diff and mImgtbl tasks.
      ddd_change_required: caching_policy on data:region_hdr / data:projected_fits.
  anomalies:
    - anomaly_type: other
      entity: task:background
      expected: 25 instances profiled (DDD parallelism_instances=25)
      observed: 2 .darshan logs captured for mBgExec
      recommendation: >-
        Trace-coverage gap, not a deployment error - 23 of 25 background-shard
        Darshan logs are missing from the trace set, so this stage's bytes/ops
        and the project->background / background->add / background->imgtbl_corrected
        channel volumes are under-counted. Re-run with confirmed LD_PRELOAD on
        all 25 background sruns, or treat background-stage aggregates as a lower
        bound. Fix profiler instrumentation; no WDD/DDD change required.
    - anomaly_type: pattern_mismatch
      entity: workflow
      expected: hybrid (WDD workflow_patterns.primary_pattern)
      observed: cascading
      recommendation: >-
        Darshan sees only the sequential stage cascade (strict bash wait between
        stages -> cascading) and cannot directly observe the embedded
        scatter/gather fan-out concurrency that makes the WDD pattern hybrid;
        the scatter_gather component is a secondary_pattern in the WDD. This is a
        profiler-visibility limitation, not a real divergence - no WDD update
        needed. Cross-task concurrency detection is a DataLife/DaYu capability.
  field_confidence:
    note: >-
      Coverage map for this Darshan run. FULLY POPULATED from darshan:
      per_task_io_profile bytes/ops/STDIO-times, data_format_observations
      (container, request sizes, byte volumes), communication_channels
      data_volume_bytes, temporal_io_behavior offsets, Lustre striping.
      NOT CAPTURED BY DARSHAN (set unknown / omitted): POSIX read/write op
      counts and sequential/consecutive/random access counters (run is STDIO-only,
      no POSIX module); per-op open/close op counts and open/close times
      (STDIO reports a single aggregated meta_time); device-level peak bandwidth
      (no DXT); per-channel transfer_time_s / transfer_bandwidth_gbs and true
      producer-consumer realized lineage; full file_lifecycle_events
      (creation/first-read/deletion/idle/lifetime); MPI-IO collective/aggregator
      counters (workflow is non-MPI posix_independent); contention_events.
