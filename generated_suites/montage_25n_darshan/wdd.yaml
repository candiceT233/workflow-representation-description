workflow_patterns:
  primary_pattern: hybrid
  secondary_patterns: [scatter_gather, cascading]
  classification_rationale: >-
    The workflow is a linear cascade of ten stages (each stage's output feeds the
    next), but four of the compute stages (reproject, difference, fit, background
    apply) are scatter fan-outs driven by table sharding (tbl_tool split) and
    srun across N nodes, while mBgModel and mAdd are explicit n_to_1 gathers.
    Several edges are n_to_n (project->diff, diff->fit, project->background)
    because sharded producers and sharded consumers both touch the shared FITS
    directories. The combination of an overall cascading stage chain with
    embedded scatter_gather fan-out/fan-in makes the primary pattern hybrid.
  pattern_table_row: >-
    montage | 10 stages | 4 single-task exception stages (mImgtbl x3, mOverlaps,
    mBgModel, mAdd) + 4 N-way scatter fan-out stages (project, diff, fit,
    background) | 1_to_1, 1_to_n, n_to_1, n_to_n | scatter_gather fan-out/gather
    within an overall cascading pipeline (hybrid)

io_behavioral_hints:
  - hint_id: hint:small_file_table_sharding
    description: >-
      tbl_tool.py splits images.tbl, diffs.tbl (twice), and pimages.tbl into N
      small per-node shard files and concatenates N small per-shard fit tables.
      At higher node counts this produces many tiny .tbl files read/written
      around each fan-out, a small-file/metadata-heavy pattern on the shared
      filesystem.
    affected_tasks: [task:project, task:diff, task:fit, task:background]
    affected_data: [data:images_tbl, data:diffs_tbl, data:pimages_tbl, data:fits_tbl]
    potential_concern: small_file_overhead
  - hint_id: hint:projected_fits_reuse
    description: >-
      The projected FITS tiles are read three times across the workflow (by
      mImgtbl for pimages.tbl, by mDiffExec for differencing, and by mBgExec for
      background application) from the shared projected/ directory, a data-reuse
      pattern where the same intermediate is re-opened by multiple later stages.
    affected_tasks: [task:imgtbl_projected, task:diff, task:background]
    affected_data: [data:projected_fits]
    potential_concern: data_reuse
  - hint_id: hint:corrections_broadcast_metadata
    description: >-
      The single corrections.tbl is opened independently by all N mBgExec
      instances on different nodes (a 1_to_n broadcast over a shared file), and
      each mImgtbl rebuild scans every FITS header in a directory. With many
      tiles these directory-wide header scans and shared-file opens are
      metadata-intensive on the parallel filesystem.
    affected_tasks: [task:background, task:imgtbl_projected, task:imgtbl_corrected]
    affected_data: [data:corrections_tbl, data:projected_fits, data:corrected_fits]
    potential_concern: metadata_overhead

execution_profiles:
  - profile_name: full_mosaic
    terminal_task_id: task:add
    description: >-
      Runs the complete Montage pipeline end to end, producing the final
      mosaic.fits and mosaic_area.fits. This is the standard scientific stopping
      point: a finished, background-matched astronomical image mosaic.
    required_task_set:
      - task:imgtbl_raw
      - task:project
      - task:imgtbl_projected
      - task:overlaps
      - task:diff
      - task:fit
      - task:bgmodel
      - task:background
      - task:imgtbl_corrected
      - task:add
    conditional_inclusions: []
    output_dataset_ids: [data:mosaic_fits, data:mosaic_area_fits]

