pc_edges:
  - edge_id: pc:imgtbl_raw->project:1_to_n
    producer: task:imgtbl_raw
    consumer: task:project
    data_objects: [data:images_tbl]
    pc_pattern: 1_to_n
    pc_pattern_rationale: >-
      One mImgtbl process produces a single images.tbl, which tbl_tool splits
      round-robin into N shards each consumed by one of N parallel mProjExec
      instances -> 1_to_n.
    data_flow_description: >-
      The single images.tbl is sharded into N node-local tables; each project
      instance reads its full shard text table once at startup.
    coupling: tight
    coupling_rationale: >-
      Sharding and reprojection cannot begin until mImgtbl has fully written
      images.tbl; the file is read after producer completion.
    communication_pattern: shared_file
    data_volume_class: small
  - edge_id: pc:project->imgtbl_projected:n_to_1
    producer: task:project
    consumer: task:imgtbl_projected
    data_objects: [data:projected_fits]
    pc_pattern: n_to_1
    pc_pattern_rationale: >-
      N parallel project shards write projected FITS tiles into a shared
      projected/ directory; one mImgtbl process scans them all -> n_to_1.
    data_flow_description: >-
      mImgtbl reads the header of every projected FITS file in projected/ to
      build pimages.tbl; reads headers only, not full pixel data.
    coupling: tight
    coupling_rationale: >-
      mImgtbl runs only after the project fan-out wait completes, scanning the
      finished directory of projected files.
    communication_pattern: file_per_producer
    data_volume_class: medium
  - edge_id: pc:imgtbl_projected->overlaps:1_to_1
    producer: task:imgtbl_projected
    consumer: task:overlaps
    data_objects: [data:pimages_tbl]
    pc_pattern: 1_to_1
    pc_pattern_rationale: >-
      One mImgtbl produces pimages.tbl, read by one mOverlaps process -> 1_to_1.
    data_flow_description: >-
      mOverlaps reads the entire pimages.tbl text table once to compute overlap
      pairs.
    coupling: tight
    coupling_rationale: >-
      mOverlaps opens pimages.tbl only after mImgtbl has written it; sequential
      shell ordering.
    communication_pattern: shared_file
    data_volume_class: small
  - edge_id: pc:overlaps->diff:1_to_n
    producer: task:overlaps
    consumer: task:diff
    data_objects: [data:diffs_tbl]
    pc_pattern: 1_to_n
    pc_pattern_rationale: >-
      One mOverlaps produces diffs.tbl, which is split into N shards each
      consumed by one of N parallel mDiffExec instances -> 1_to_n.
    data_flow_description: >-
      diffs.tbl is sharded round-robin; each diff instance reads its shard text
      table to learn which pairs to difference.
    coupling: tight
    coupling_rationale: >-
      Sharding and differencing follow mOverlaps completion in shell order;
      shard files read after the producer finishes.
    communication_pattern: shared_file
    data_volume_class: small
  - edge_id: pc:project->diff:n_to_n
    producer: task:project
    consumer: task:diff
    data_objects: [data:projected_fits]
    pc_pattern: n_to_n
    pc_pattern_rationale: >-
      N project shards write the projected tiles; N diff shards each read the two
      projected tiles of every pair in their shard, so any diff node may read any
      project node's output -> n_to_n.
    data_flow_description: >-
      Each diff instance opens the two projected FITS files for each overlap pair
      it owns (full-image cfitsio reads) from the shared projected/ directory.
    coupling: tight
    coupling_rationale: >-
      All projected files must exist before differencing; the diff stage runs
      after the project fan-out wait.
    communication_pattern: file_per_producer
    data_volume_class: medium
  - edge_id: pc:overlaps->fit:1_to_n
    producer: task:overlaps
    consumer: task:fit
    data_objects: [data:diffs_tbl]
    pc_pattern: 1_to_n
    pc_pattern_rationale: >-
      diffs.tbl is split a second time into N fit shards, each consumed by one of
      N parallel mFitExec instances -> 1_to_n.
    data_flow_description: >-
      Each fit instance reads its diffs.tbl shard to learn which difference images
      to fit.
    coupling: tight
    coupling_rationale: >-
      Fit sharding occurs after mOverlaps and after differencing in shell order;
      shard files read post-producer.
    communication_pattern: shared_file
    data_volume_class: small
  - edge_id: pc:diff->fit:n_to_n
    producer: task:diff
    consumer: task:fit
    data_objects: [data:diff_fits]
    pc_pattern: n_to_n
    pc_pattern_rationale: >-
      N diff shards write diff FITS images into shared diffs/; N fit shards each
      read the diff images for their pair shard, so any fit node may read any
      diff node's output -> n_to_n.
    data_flow_description: >-
      Each fit instance opens the diff FITS image for each pair it owns
      (cfitsio read) and fits a plane.
    coupling: tight
    coupling_rationale: >-
      The diff fan-out wait completes before the fit stage starts; all diff files
      present before fitting.
    communication_pattern: file_per_producer
    data_volume_class: medium
  - edge_id: pc:imgtbl_projected->bgmodel:1_to_1
    producer: task:imgtbl_projected
    consumer: task:bgmodel
    data_objects: [data:pimages_tbl]
    pc_pattern: 1_to_1
    pc_pattern_rationale: >-
      One pimages.tbl is read by the single mBgModel process -> 1_to_1.
    data_flow_description: >-
      mBgModel reads pimages.tbl once to know the tile set for the global
      background solve.
    coupling: tight
    coupling_rationale: >-
      mBgModel reads pimages.tbl which was fully written by the earlier mImgtbl;
      sequential ordering.
    communication_pattern: shared_file
    data_volume_class: small
  - edge_id: pc:fit->bgmodel:n_to_1
    producer: task:fit
    consumer: task:bgmodel
    data_objects: [data:fits_tbl]
    pc_pattern: n_to_1
    pc_pattern_rationale: >-
      N fit shards each emit a per-shard fits table; tbl_tool concat gathers them
      into one fits.tbl that the single mBgModel reads -> n_to_1.
    data_flow_description: >-
      Per-shard fit tables are concatenated into fits.tbl, read once in full by
      mBgModel for the global background least-squares solve.
    coupling: tight
    coupling_rationale: >-
      The fit fan-out wait and concat complete before mBgModel runs; it needs the
      complete fit table before solving.
    communication_pattern: file_per_producer
    data_volume_class: small
  - edge_id: pc:imgtbl_projected->background:1_to_n
    producer: task:imgtbl_projected
    consumer: task:background
    data_objects: [data:pimages_tbl]
    pc_pattern: 1_to_n
    pc_pattern_rationale: >-
      pimages.tbl is split into N shards each consumed by one of N parallel
      mBgExec instances -> 1_to_n.
    data_flow_description: >-
      Each background instance reads its pimages.tbl shard to learn which tiles to
      correct.
    coupling: tight
    coupling_rationale: >-
      Background sharding occurs after pimages.tbl exists; shard files read after
      producer completion.
    communication_pattern: shared_file
    data_volume_class: small
  - edge_id: pc:bgmodel->background:1_to_n
    producer: task:bgmodel
    consumer: task:background
    data_objects: [data:corrections_tbl]
    pc_pattern: 1_to_n
    pc_pattern_rationale: >-
      One mBgModel produces corrections.tbl, which is read (broadcast) by all N
      parallel mBgExec instances -> 1_to_n.
    data_flow_description: >-
      Every background instance opens the same shared corrections.tbl to obtain
      its tiles' correction coefficients.
    coupling: tight
    coupling_rationale: >-
      mBgExec runs only after mBgModel has written corrections.tbl; the file is
      read after producer completion.
    communication_pattern: shared_file
    data_volume_class: small
  - edge_id: pc:project->background:n_to_n
    producer: task:project
    consumer: task:background
    data_objects: [data:projected_fits]
    pc_pattern: n_to_n
    pc_pattern_rationale: >-
      N project shards write projected tiles; N background shards each read the
      projected tiles in their own shard, so any background node may read any
      project node's output -> n_to_n.
    data_flow_description: >-
      Each background instance reads the projected FITS file for each tile it
      owns (cfitsio read), subtracts the modeled background, writes a corrected
      FITS file.
    coupling: tight
    coupling_rationale: >-
      All projected files exist before background application; the stage runs
      after the project fan-out.
    communication_pattern: file_per_producer
    data_volume_class: medium
  - edge_id: pc:background->imgtbl_corrected:n_to_1
    producer: task:background
    consumer: task:imgtbl_corrected
    data_objects: [data:corrected_fits]
    pc_pattern: n_to_1
    pc_pattern_rationale: >-
      N background shards write corrected FITS tiles into shared corrected/; one
      mImgtbl scans them all -> n_to_1.
    data_flow_description: >-
      mImgtbl reads the header of every corrected FITS file to build cimages.tbl;
      headers only, not pixel data.
    coupling: tight
    coupling_rationale: >-
      mImgtbl runs only after the background fan-out wait completes, scanning the
      finished corrected directory.
    communication_pattern: file_per_producer
    data_volume_class: medium
  - edge_id: pc:imgtbl_corrected->add:1_to_1
    producer: task:imgtbl_corrected
    consumer: task:add
    data_objects: [data:cimages_tbl]
    pc_pattern: 1_to_1
    pc_pattern_rationale: >-
      One mImgtbl produces cimages.tbl, read by the single mAdd process -> 1_to_1.
    data_flow_description: >-
      mAdd reads cimages.tbl once for tile placement metadata before coadding.
    coupling: tight
    coupling_rationale: >-
      mAdd opens cimages.tbl only after mImgtbl has written it; sequential
      ordering.
    communication_pattern: shared_file
    data_volume_class: small
  - edge_id: pc:background->add:n_to_1
    producer: task:background
    consumer: task:add
    data_objects: [data:corrected_fits]
    pc_pattern: n_to_1
    pc_pattern_rationale: >-
      N background shards write corrected FITS tiles into shared corrected/; one
      mAdd reads all of them to build the single mosaic -> n_to_1.
    data_flow_description: >-
      mAdd streams every corrected FITS file (cfitsio reads), accumulating flux
      and area into the output mosaic written line-by-line.
    coupling: tight
    coupling_rationale: >-
      mAdd runs only after the background fan-out wait completes; it must read
      all corrected tiles to produce the mosaic.
    communication_pattern: file_per_producer
    data_volume_class: medium

