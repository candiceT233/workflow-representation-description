metadata:
  workflow_lineage_id: wrd:montage
  version: "1.0.0"
  version_notes: "Initial WDD compiled from run_montage_prof.sh (shell-orchestrated Montage image-mosaic pipeline on NCSA Delta)."
  deprecated: false
  workflow_name: montage
  workflow_description: >-
    Montage is an astronomical image-mosaic engine that assembles a set of
    overlapping input FITS sky tiles into a single seamless mosaic image. It
    reads raw FITS tiles plus a target WCS header (region.hdr), reprojects each
    tile onto the common mosaic projection, computes pairwise overlap difference
    images, fits planes to those differences, solves a global background-
    correction model, applies the corrections, and coadds the corrected tiles
    into a final mosaic FITS image with an accompanying area-weight image. This
    Delta deployment runs the C/cfitsio Montage binaries orchestrated by a SLURM
    shell script with srun fan-out across nodes (not Pegasus).
  source_repository: /u/mtang9/widget_eval/hpc_workflows/repos/Montage
  source_commit: ac0a15334f670ed83e328b6c5768f94b4b847359
  source_format: native
  source_file: /u/mtang9/widget_eval/hpc_workflows/runs/Montage/run_montage_prof.sh
  schema_version: wrd-7.0
  generated_by: claude-code-opus-4-8
  generated_at: 2026-06-01T14:26:02Z
  last_modified_at: 2026-06-01T14:26:02Z

stages:
  - stage_id: stage:build_image_table
    name: Build Input Image Table
    order: 1
    description: >-
      Scan the raw FITS tile directory and build the images.tbl metadata table
      describing each input tile's WCS geometry. Single-task exception stage.
    tasks: [task:imgtbl_raw]

  - stage_id: stage:reproject
    name: Reproject Tiles
    order: 2
    description: >-
      Reproject each input FITS tile onto the common mosaic WCS defined by
      region.hdr. Scatter fan-out: one image-table shard per node via mProjExec.
    tasks: [task:project]

  - stage_id: stage:table_projected
    name: Build Projected Image Table
    order: 3
    description: >-
      Build pimages.tbl, the metadata table over the reprojected FITS tiles.
      Single-task exception stage.
    tasks: [task:imgtbl_projected]

  - stage_id: stage:overlaps
    name: Enumerate Overlaps
    order: 4
    description: >-
      Analyze pimages.tbl to enumerate every pair of spatially overlapping
      reprojected tiles, producing diffs.tbl. Single-task exception stage.
    tasks: [task:overlaps]

  - stage_id: stage:difference
    name: Pairwise Difference Images
    order: 5
    description: >-
      Compute a difference image for each overlapping tile pair listed in
      diffs.tbl. Scatter fan-out: one diff-table shard per node via mDiffExec.
    tasks: [task:diff]

  - stage_id: stage:fit_planes
    name: Fit Difference Planes
    order: 6
    description: >-
      Fit a plane to each overlap difference image and emit per-shard fit
      tables, gathered into fits.tbl. Scatter fan-out via mFitExec then concat.
    tasks: [task:fit]

  - stage_id: stage:background_model
    name: Global Background Model
    order: 7
    description: >-
      Solve a global background-correction model from the plane fits and image
      metadata, producing corrections.tbl. Gather (n_to_1) exception stage.
    tasks: [task:bgmodel]

  - stage_id: stage:background_apply
    name: Apply Background Correction
    order: 8
    description: >-
      Apply the per-tile background corrections to the reprojected tiles.
      Scatter fan-out: one image-table shard per node via mBgExec.
    tasks: [task:background]

  - stage_id: stage:table_corrected
    name: Build Corrected Image Table
    order: 9
    description: >-
      Build cimages.tbl, the metadata table over the background-corrected FITS
      tiles. Single-task exception stage.
    tasks: [task:imgtbl_corrected]

  - stage_id: stage:coadd
    name: Coadd Final Mosaic
    order: 10
    description: >-
      Coadd all background-corrected tiles into the final mosaic.fits and
      mosaic_area.fits using cimages.tbl and region.hdr. Gather (n_to_1) stage.
    tasks: [task:add]

tasks:
  - task_id: task:imgtbl_raw
    name: Raw Image Table
    stage: stage:build_image_table
    executable: mImgtbl
    description: >-
      Scans the raw_images directory of input FITS sky tiles and extracts each
      tile's WCS and geometry metadata into an ASCII images.tbl table. This
      table drives all downstream reprojection sharding. Reads every input FITS
      header once and writes a single POSIX text table.
    behavioral_notes: >-
      Reads FITS headers for all input tiles sequentially at startup via cfitsio
      STDIO; writes the complete images.tbl text table at completion. Directory
      scan plus header reads; no large pixel-data reads.
    parallelism_model:
      type: serial
      description: Single process over the whole raw image directory; not sharded.
    io_dominance: io_bound
    io_access_type: posix_independent
    restart_model: idempotent
    hardware_path:
      has_conditional_execution: false
      execution_alternatives: []
      minimum_resource_assertions: []
    output_class: intermediate
    inputs: [data:raw_fits_tiles]
    outputs: [data:images_tbl]

  - task_id: task:project
    name: Reproject Tile
    stage: stage:reproject
    executable: mProjExec (mProject)
    description: >-
      Reprojects each raw FITS tile onto the common mosaic WCS from region.hdr,
      producing one projected FITS image per input tile. Driven by mProjExec
      over an images.tbl shard so each node handles a subset of tiles. Reads
      input tile pixel data and writes reprojected pixel data plus area weights.
    behavioral_notes: >-
      Each mProjExec instance reads its images.tbl shard, then for each row
      reads that input FITS tile (cfitsio STDIO full-image read) and writes a
      projected FITS file plus area file into projected/. Sequential per-tile
      read/transform/write; one shard per node.
    parallelism_model:
      type: embarrassingly_parallel
      description: >-
        Each node processes an independent round-robin shard of the image table;
        tiles are reprojected independently with no inter-node communication.
    io_dominance: balanced
    io_access_type: posix_independent
    restart_model: idempotent
    hardware_path:
      has_conditional_execution: false
      execution_alternatives: []
      minimum_resource_assertions: []
    output_class: intermediate
    inputs: [data:raw_fits_tiles, data:images_tbl, data:region_hdr]
    outputs: [data:projected_fits]

  - task_id: task:imgtbl_projected
    name: Projected Image Table
    stage: stage:table_projected
    executable: mImgtbl
    description: >-
      Scans the projected FITS tiles and builds pimages.tbl describing their WCS
      geometry. Consumed by overlap enumeration, background modeling, and
      background application. Reads projected FITS headers and writes one table.
    behavioral_notes: >-
      Reads projected FITS headers sequentially via cfitsio STDIO; writes
      pimages.tbl text table at completion. Metadata-oriented; no pixel reads.
    parallelism_model:
      type: serial
      description: Single process over the projected directory.
    io_dominance: io_bound
    io_access_type: posix_independent
    restart_model: idempotent
    hardware_path:
      has_conditional_execution: false
      execution_alternatives: []
      minimum_resource_assertions: []
    output_class: intermediate
    inputs: [data:projected_fits]
    outputs: [data:pimages_tbl]

  - task_id: task:overlaps
    name: Enumerate Overlaps
    stage: stage:overlaps
    executable: mOverlaps
    description: >-
      Reads pimages.tbl and computes which pairs of reprojected tiles overlap on
      the sky, writing the diffs.tbl table of overlapping pairs. This pair list
      drives the pairwise difference and plane-fit stages. Pure table-to-table
      computation with no pixel I/O.
    behavioral_notes: >-
      Reads the pimages.tbl text table once, computes pairwise geometric
      overlaps in memory, writes diffs.tbl at completion. Text I/O only.
    parallelism_model:
      type: serial
      description: Single process computing all overlap pairs.
    io_dominance: compute_bound
    io_access_type: posix_independent
    restart_model: idempotent
    hardware_path:
      has_conditional_execution: false
      execution_alternatives: []
      minimum_resource_assertions: []
    output_class: intermediate
    inputs: [data:pimages_tbl]
    outputs: [data:diffs_tbl]

  - task_id: task:diff
    name: Pairwise Difference
    stage: stage:difference
    executable: mDiffExec (mDiff)
    description: >-
      Computes a pixel-wise difference image for each overlapping tile pair in a
      diffs.tbl shard, reading the two reprojected FITS tiles and writing a diff
      FITS image into diffs/. Driven by mDiffExec, one shard per node. Quantifies
      background mismatch between neighboring tiles.
    behavioral_notes: >-
      Each mDiffExec instance reads its diffs.tbl shard, then for each pair reads
      two projected FITS tiles (cfitsio STDIO) and writes one diff FITS file.
      Sequential per-pair read/subtract/write; one shard per node.
    parallelism_model:
      type: embarrassingly_parallel
      description: >-
        Each node processes an independent round-robin shard of the overlap
        pair table; difference images are computed independently.
    io_dominance: balanced
    io_access_type: posix_independent
    restart_model: idempotent
    hardware_path:
      has_conditional_execution: false
      execution_alternatives: []
      minimum_resource_assertions: []
    output_class: intermediate
    inputs: [data:diffs_tbl, data:projected_fits, data:region_hdr]
    outputs: [data:diff_fits]

  - task_id: task:fit
    name: Fit Difference Planes
    stage: stage:fit_planes
    executable: mFitExec (mFitplane)
    description: >-
      Fits a plane (a + bx + cy) to each overlap difference image listed in a
      fit-table shard and records the fit coefficients per pair. Per-shard fit
      tables are concatenated into fits.tbl, the input to background modeling.
      Reads diff FITS images and writes plane-fit coefficient rows.
    behavioral_notes: >-
      Each mFitExec instance reads its shard of the diff pair table, opens each
      diff FITS image (cfitsio STDIO), computes a least-squares plane fit, and
      appends coefficient rows to a per-shard fits table; shards are gathered by
      tbl_tool concat into fits.tbl.
    parallelism_model:
      type: embarrassingly_parallel
      description: >-
        Each node fits planes for an independent shard of difference images;
        results are gathered by table concatenation afterward.
    io_dominance: balanced
    io_access_type: posix_independent
    restart_model: idempotent
    hardware_path:
      has_conditional_execution: false
      execution_alternatives: []
      minimum_resource_assertions: []
    output_class: intermediate
    inputs: [data:diffs_tbl, data:diff_fits]
    outputs: [data:fits_tbl]

  - task_id: task:bgmodel
    name: Background Model
    stage: stage:background_model
    executable: mBgModel
    description: >-
      Solves a global background-correction model by combining the per-pair
      plane fits (fits.tbl) with the projected image metadata (pimages.tbl),
      producing corrections.tbl with one correction per tile. This is the global
      gather step that makes the mosaic seamless. Table-to-table computation.
    behavioral_notes: >-
      Reads pimages.tbl and the gathered fits.tbl once, solves the global
      least-squares background system in memory, writes corrections.tbl at
      completion. Text I/O only; single global process (n_to_1 gather).
    parallelism_model:
      type: serial
      description: >-
        Single global solve; must see all plane fits at once, so it gathers the
        outputs of every fit shard.
    io_dominance: compute_bound
    io_access_type: posix_independent
    restart_model: idempotent
    hardware_path:
      has_conditional_execution: false
      execution_alternatives: []
      minimum_resource_assertions: []
    output_class: intermediate
    inputs: [data:pimages_tbl, data:fits_tbl]
    outputs: [data:corrections_tbl]

  - task_id: task:background
    name: Apply Background Correction
    stage: stage:background_apply
    executable: mBgExec (mBackground)
    description: >-
      Applies the per-tile background correction from corrections.tbl to each
      reprojected FITS tile, writing a corrected FITS image into corrected/.
      Driven by mBgExec over a pimages.tbl shard, one shard per node. Removes the
      modeled background offsets so tiles match at their seams.
    behavioral_notes: >-
      Each mBgExec instance reads its pimages.tbl shard plus the shared
      corrections.tbl, then for each tile reads the projected FITS (cfitsio
      STDIO), subtracts the modeled background plane, and writes a corrected FITS
      file. Sequential per-tile read/modify/write; one shard per node.
    parallelism_model:
      type: embarrassingly_parallel
      description: >-
        Each node corrects an independent round-robin shard of tiles using the
        shared global corrections table; no inter-node communication.
    io_dominance: balanced
    io_access_type: posix_independent
    restart_model: idempotent
    hardware_path:
      has_conditional_execution: false
      execution_alternatives: []
      minimum_resource_assertions: []
    output_class: intermediate
    inputs: [data:pimages_tbl, data:corrections_tbl, data:projected_fits]
    outputs: [data:corrected_fits]

  - task_id: task:imgtbl_corrected
    name: Corrected Image Table
    stage: stage:table_corrected
    executable: mImgtbl
    description: >-
      Scans the background-corrected FITS tiles and builds cimages.tbl
      describing their WCS geometry, which the final coadd uses to place each
      tile. Reads corrected FITS headers and writes one metadata table.
    behavioral_notes: >-
      Reads corrected FITS headers sequentially via cfitsio STDIO; writes
      cimages.tbl text table at completion. Metadata-oriented; no pixel reads.
    parallelism_model:
      type: serial
      description: Single process over the corrected directory.
    io_dominance: io_bound
    io_access_type: posix_independent
    restart_model: idempotent
    hardware_path:
      has_conditional_execution: false
      execution_alternatives: []
      minimum_resource_assertions: []
    output_class: intermediate
    inputs: [data:corrected_fits]
    outputs: [data:cimages_tbl]

  - task_id: task:add
    name: Coadd Mosaic
    stage: stage:coadd
    executable: mAdd
    description: >-
      Coadds all background-corrected FITS tiles into the final science mosaic,
      using cimages.tbl for tile placement and region.hdr for the output WCS. It
      writes mosaic.fits (the coadded image) and mosaic_area.fits (per-pixel
      coverage weights). This is the terminal gather producing the deliverable.
    behavioral_notes: >-
      Reads cimages.tbl and region.hdr, then streams every corrected FITS tile
      (cfitsio STDIO) accumulating flux and area into the output mosaic, which it
      writes line-by-line. Single global process consuming all corrected tiles
      (n_to_1 gather); writes two output FITS files.
    parallelism_model:
      type: serial
      description: >-
        Single coadd process; must read all corrected tiles to produce the one
        mosaic, so it gathers every background-apply shard's outputs.
    io_dominance: io_bound
    io_access_type: posix_independent
    restart_model: idempotent
    hardware_path:
      has_conditional_execution: false
      execution_alternatives: []
      minimum_resource_assertions: []
    output_class: checkpoint
    inputs: [data:corrected_fits, data:cimages_tbl, data:region_hdr]
    outputs: [data:mosaic_fits, data:mosaic_area_fits]

data_objects:
  - data_id: data:raw_fits_tiles
    name: Raw FITS Sky Tiles
    description: >-
      The set of input astronomical FITS image tiles covering the target sky
      region, each carrying pixel data and a WCS header. These are the external
      inputs Montage reprojects and coadds into a mosaic; in this deployment they
      are synthetically generated WCS tiles for scaling runs.
    category: input
    persistence: persistent
    format_hint:
      container: plain_binary
      compression: none
      layout_hint: contiguous
      typical_request_size_kb: null
    cardinality: "config-determined (one per input sky tile; see cardinality_source)"
    cardinality_source:
      type: config_determined
      controlling_parameter: tile_grid_rows_cols
      config_file: scripts/montage_gen_fits.py
      possible_values: "rows x cols tiles (e.g., 5x5=25 for scale A, 12x11=132 for scale B); must be >= node count"
    estimated_size_hint: "unknown (depends on tile pixel dimensions chosen at generation)"
    producer_task: null
    consumer_tasks: [task:imgtbl_raw, task:project]
    lifecycle:
      creation_phase: null
      last_consumer_phase: task:project
      retention_window: "external input, available from workflow start to task:project completion"
      access_frequency_class: few_times
      consumer_count: 2

  - data_id: data:region_hdr
    name: Mosaic Region Header
    description: >-
      The FITS WCS header (region.hdr) defining the target mosaic projection,
      pixel scale, and footprint. It is a configuration object that fixes the
      common coordinate system onto which all tiles are reprojected and into
      which the final mosaic is coadded.
    category: config
    persistence: persistent
    format_hint:
      container: text
      compression: none
      layout_hint: contiguous
      typical_request_size_kb: 1
    cardinality: "single global file"
    cardinality_source:
      type: fixed
      controlling_parameter: null
      config_file: null
      possible_values: "n/a"
    estimated_size_hint: "small text header, <1 KB"
    producer_task: null
    consumer_tasks: [task:project, task:diff, task:add]
    lifecycle:
      creation_phase: null
      last_consumer_phase: task:add
      retention_window: "external config, available from workflow start to task:add completion"
      access_frequency_class: few_times
      consumer_count: 3

  - data_id: data:images_tbl
    name: Input Image Metadata Table
    description: >-
      The images.tbl ASCII metadata table listing each raw FITS tile and its WCS
      geometry. It is the intermediate index that mProjExec shards across nodes
      to drive reprojection of the input tiles.
    category: intermediate
    persistence: workflow_scoped
    format_hint:
      container: text
      compression: none
      layout_hint: contiguous
      typical_request_size_kb: null
    cardinality: "single global table (sharded N ways at runtime by tbl_tool)"
    cardinality_source:
      type: fixed
      controlling_parameter: null
      config_file: null
      possible_values: "n/a"
    estimated_size_hint: "small text table, order KB to MB depending on tile count"
    producer_task: task:imgtbl_raw
    consumer_tasks: [task:project]
    lifecycle:
      creation_phase: task:imgtbl_raw
      last_consumer_phase: task:project
      retention_window: "from task:imgtbl_raw completion to task:project completion"
      access_frequency_class: once
      consumer_count: 1

  - data_id: data:projected_fits
    name: Reprojected FITS Tiles
    description: >-
      The set of FITS tiles reprojected onto the common mosaic WCS, plus their
      area-weight images, written into projected/. These intermediate images are
      the geometrically aligned tiles consumed by differencing, background
      modeling, and background application.
    category: intermediate
    persistence: workflow_scoped
    format_hint:
      container: plain_binary
      compression: none
      layout_hint: contiguous
      typical_request_size_kb: null
    cardinality: "runtime-determined (one projected FITS plus area per input tile)"
    cardinality_source:
      type: config_determined
      controlling_parameter: tile_grid_rows_cols
      config_file: scripts/montage_gen_fits.py
      possible_values: "one per input tile that projects into the region"
    estimated_size_hint: "unknown (comparable to input tile pixel footprint)"
    producer_task: task:project
    consumer_tasks: [task:imgtbl_projected, task:diff, task:background]
    lifecycle:
      creation_phase: task:project
      last_consumer_phase: task:background
      retention_window: "from task:project completion to task:background completion"
      access_frequency_class: repeatedly
      consumer_count: 3

  - data_id: data:pimages_tbl
    name: Projected Image Metadata Table
    description: >-
      The pimages.tbl ASCII metadata table over the reprojected tiles, listing
      their WCS geometry. It is the intermediate index used to enumerate
      overlaps, to seed the background model, and (sharded) to drive background
      application.
    category: intermediate
    persistence: workflow_scoped
    format_hint:
      container: text
      compression: none
      layout_hint: contiguous
      typical_request_size_kb: null
    cardinality: "single global table (sharded N ways for background apply)"
    cardinality_source:
      type: fixed
      controlling_parameter: null
      config_file: null
      possible_values: "n/a"
    estimated_size_hint: "small text table, order KB to MB"
    producer_task: task:imgtbl_projected
    consumer_tasks: [task:overlaps, task:bgmodel, task:background]
    lifecycle:
      creation_phase: task:imgtbl_projected
      last_consumer_phase: task:background
      retention_window: "from task:imgtbl_projected completion to task:background completion"
      access_frequency_class: few_times
      consumer_count: 3

  - data_id: data:diffs_tbl
    name: Overlap Pair Table
    description: >-
      The diffs.tbl ASCII table enumerating every pair of overlapping reprojected
      tiles. It is the intermediate work list that mDiffExec and mFitExec shard
      across nodes to compute and fit pairwise difference images.
    category: intermediate
    persistence: workflow_scoped
    format_hint:
      container: text
      compression: none
      layout_hint: contiguous
      typical_request_size_kb: null
    cardinality: "single global table (sharded N ways for diff and fit)"
    cardinality_source:
      type: fixed
      controlling_parameter: null
      config_file: null
      possible_values: "n/a"
    estimated_size_hint: "small text table; rows scale with number of overlapping pairs"
    producer_task: task:overlaps
    consumer_tasks: [task:diff, task:fit]
    lifecycle:
      creation_phase: task:overlaps
      last_consumer_phase: task:fit
      retention_window: "from task:overlaps completion to task:fit completion"
      access_frequency_class: few_times
      consumer_count: 2

  - data_id: data:diff_fits
    name: Pairwise Difference Images
    description: >-
      The set of FITS difference images, one per overlapping tile pair, written
      into diffs/. Each captures the background mismatch between two neighboring
      reprojected tiles and is the intermediate input to plane fitting.
    category: intermediate
    persistence: workflow_scoped
    format_hint:
      container: plain_binary
      compression: none
      layout_hint: contiguous
      typical_request_size_kb: null
    cardinality: "runtime-determined (one diff FITS per overlapping pair)"
    cardinality_source:
      type: runtime_determined
      controlling_parameter: null
      config_file: null
      possible_values: "runtime-determined (number of overlapping pairs from mOverlaps)"
    estimated_size_hint: "unknown (overlap-region pixel footprint per pair)"
    producer_task: task:diff
    consumer_tasks: [task:fit]
    lifecycle:
      creation_phase: task:diff
      last_consumer_phase: task:fit
      retention_window: "from task:diff completion to task:fit completion"
      access_frequency_class: once
      consumer_count: 1

  - data_id: data:fits_tbl
    name: Plane Fit Table
    description: >-
      The fits.tbl ASCII table of per-pair plane-fit coefficients describing the
      background gradient across each overlap. Gathered from per-shard fit tables,
      it is the intermediate input that feeds the global background model.
    category: intermediate
    persistence: workflow_scoped
    format_hint:
      container: text
      compression: none
      layout_hint: contiguous
      typical_request_size_kb: null
    cardinality: "single global table (gathered from N fit shards via tbl_tool concat)"
    cardinality_source:
      type: fixed
      controlling_parameter: null
      config_file: null
      possible_values: "n/a"
    estimated_size_hint: "small text table; one row per overlapping pair"
    producer_task: task:fit
    consumer_tasks: [task:bgmodel]
    lifecycle:
      creation_phase: task:fit
      last_consumer_phase: task:bgmodel
      retention_window: "from task:fit completion to task:bgmodel completion"
      access_frequency_class: once
      consumer_count: 1

  - data_id: data:corrections_tbl
    name: Background Corrections Table
    description: >-
      The corrections.tbl ASCII table giving the per-tile background-correction
      coefficients produced by the global background model. It is the
      intermediate that mBgExec applies to each reprojected tile to make the
      mosaic photometrically seamless.
    category: intermediate
    persistence: workflow_scoped
    format_hint:
      container: text
      compression: none
      layout_hint: contiguous
      typical_request_size_kb: null
    cardinality: "single global table (broadcast to all background-apply shards)"
    cardinality_source:
      type: fixed
      controlling_parameter: null
      config_file: null
      possible_values: "n/a"
    estimated_size_hint: "small text table; one row per tile"
    producer_task: task:bgmodel
    consumer_tasks: [task:background]
    lifecycle:
      creation_phase: task:bgmodel
      last_consumer_phase: task:background
      retention_window: "from task:bgmodel completion to task:background completion"
      access_frequency_class: repeatedly
      consumer_count: 1

  - data_id: data:corrected_fits
    name: Background-Corrected FITS Tiles
    description: >-
      The set of reprojected FITS tiles with their modeled background offsets
      removed, written into corrected/. These intermediate images are the
      photometrically matched tiles that the final mAdd step coadds into the
      mosaic.
    category: intermediate
    persistence: workflow_scoped
    format_hint:
      container: plain_binary
      compression: none
      layout_hint: contiguous
      typical_request_size_kb: null
    cardinality: "runtime-determined (one corrected FITS per reprojected tile)"
    cardinality_source:
      type: config_determined
      controlling_parameter: tile_grid_rows_cols
      config_file: scripts/montage_gen_fits.py
      possible_values: "one per reprojected tile"
    estimated_size_hint: "unknown (comparable to projected tile footprint)"
    producer_task: task:background
    consumer_tasks: [task:imgtbl_corrected, task:add]
    lifecycle:
      creation_phase: task:background
