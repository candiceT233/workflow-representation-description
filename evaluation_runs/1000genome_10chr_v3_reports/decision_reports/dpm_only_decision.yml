limitations:
  - The static DPM artifact reports BeeGFS no-staging candidates as zero-score references, so the selected staged deployment intentionally overrides the all-candidate DPM argmin while following the best staged candidate.
  - Allowed inputs do not provide measured workflow runtimes, live filesystem capacity, queue state, or scheduler availability.
  - Scheduler feasibility is limited to the allowed site configuration: account oddite, partition slurm, and candidate node counts 2, 5, and 10.
  - Storage-capacity risk cannot be quantified from allowed evidence; scratch is selected over tmpfs to reduce memory-backed capacity risk.
