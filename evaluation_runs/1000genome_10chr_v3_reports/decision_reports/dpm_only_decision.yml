stage_out_policy: Copy final correctness outputs from job-owned scratch back to BeeGFS, then require cleanup of the job-owned scratch directory.
expected_improvement_reason: The all-candidate DPM argmin is the BeeGFS no-explicit-staging reference, but the objective asks for an I/O-improved deployment relative to BeeGFS. Among non-baseline staged candidates, the static Widget DPM table identifies 5 nodes on scratch as the deterministic staged argmin with DPM score 2.3729909710923187 s, lower than 10-node scratch, all tmpfs candidates, and 2-node scratch. This suggests the lowest estimated staging and inter-stage movement overhead while moving workflow I/O off shared BeeGFS.
confidence: medium
assumptions:
  - The neutral executor will provide and clean a job-owned scratch directory matching the allowed site configuration.
  - Output correctness can be preserved by staging inputs from BeeGFS, running on scratch, and staging final correctness outputs back to BeeGFS.
  - DPM scores estimate data movement overhead only; full workflow runtime effects are not available in the allowed inputs.
  - Scratch capacity is not shown as insufficient in the allowed inputs, but exact free space is not provided.
