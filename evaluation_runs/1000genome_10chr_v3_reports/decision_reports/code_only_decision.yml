candidate_comparison:
  - node_count: 2
    storage_tier: beegfs
    expected_runtime_rank: 9
    reason_selected_or_rejected: Rejected because only two nodes process five chromosomes each and all workflow I/O remains on shared BeeGFS; baseline policy also copies all default outputs.
  - node_count: 2
    storage_tier: scratch
    expected_runtime_rank: 8
    reason_selected_or_rejected: Rejected because local scratch reduces shared filesystem pressure, but two nodes leave five chromosomes per node and less parallelism than 5 or 10 nodes.
  - node_count: 2
    storage_tier: tmpfs
    expected_runtime_rank: 7
    reason_selected_or_rejected: Rejected because tmpfs should improve local I/O, but two nodes leave five chromosomes per node, so node-level parallelism is the limiting factor.
  - node_count: 5
    storage_tier: beegfs
    expected_runtime_rank: 6
    reason_selected_or_rejected: Rejected because five nodes process two chromosomes each but still use shared BeeGFS for workflow storage.
  - node_count: 5
    storage_tier: scratch
    expected_runtime_rank: 5
    reason_selected_or_rejected: Rejected because scratch reduces shared I/O, but two chromosomes per node likely runs longer than the one-chromosome-per-node 10-node options.
  - node_count: 5
    storage_tier: tmpfs
    expected_runtime_rank: 4
    reason_selected_or_rejected: Rejected because tmpfs improves local I/O, but five nodes still assign two chromosomes per node.
  - node_count: 10
    storage_tier: beegfs
    expected_runtime_rank: 3
    reason_selected_or_rejected: Rejected because it has the best chromosome-level parallelism but keeps metadata-heavy intermediate workflow I/O on shared BeeGFS.
  - node_count: 10
    storage_tier: scratch
    expected_runtime_rank: 2
    reason_selected_or_rejected: Rejected as the lower-risk local-storage alternative; it should reduce BeeGFS pressure but is expected to be slower than tmpfs for the many small files and tar operations.
  - node_count: 10
    storage_tier: tmpfs
    expected_runtime_rank: 1
    reason_selected_or_rejected: Selected because it combines one chromosome per node with the fastest job-owned local storage for intermediate small-file, extraction, and archive I/O, while output copy is limited to final archives.
disallowed_inputs_avoided:
  - Did not use web access.
  - Did not submit Slurm jobs.
  - Did not execute the workflow.
  - Did not call Widget MCP or live DPM tools.
  - Did not inspect WDD-suite YAML files, DPM outputs, prior evaluation reports, chat-derived conclusions, or files outside the clean input bundle except the handoff, allowed manifest, and required decision report path.
executor_requirements:
  validation_required: true
  runtime_excludes_validation: true
  cleanup_required: true
limitations:
  - No measured runtime or live DPM information was available in this setup, so storage ranking is inferred from workflow code and run-script behavior only.
  - The allowed inputs describe tmpfs availability and node memory but do not provide actual free tmpfs capacity at job start.
  - The allowed inputs support basic scheduler feasibility from account, partition, and resource request, but not real-time queue availability.
  - The run_partition.py snapshot references the workflow repository through WIDGET_EVAL_ROOT at execution time; this decision assumes the neutral executor supplies the same bounded dataset described by the allowed inventory and prompt.
