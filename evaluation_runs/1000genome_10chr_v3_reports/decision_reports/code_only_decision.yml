tool_policy:
  web_access: false
  subagents: false
  slurm_job_submission: false
  workflow_execution: false
  widget_mcp_live_calls: false
selected_node_count: 10
selected_storage_tier: tmpfs
stage_in_policy: >-
  Prepare each node's assigned chromosome input subset and copied workflow
  scripts into that node's job-owned tmpfs work directory; do not pre-stage
  unrelated chromosomes to a node.
workflow_storage_policy: >-
  Run all per-node workflow work directories, temporary per-individual files,
  extracted tar contents, intermediate text/png outputs, and final archive
  creation in the job-owned tmpfs directory.
stage_out_policy: >-
  Copy only final correctness archives from tmpfs to the shared output root,
  then let the neutral executor remove the job-owned tmpfs directory during
  cleanup.
expected_improvement_reason: >-
  The allowed executor partitions 10 chromosomes across nodes by modulo
  assignment, so 10 nodes gives one chromosome per active node. The workflow
  code performs many local filesystem operations, including per-individual
  text-file creation, tar/gzip creation, tar extraction, population-level
  reads, text and plot writes, and final tar archives. Using job-owned tmpfs
  should reduce shared BeeGFS metadata and archive I/O during workflow
  execution. In improved mode the executor also uses final-only output copying,
  whereas the BeeGFS baseline copies all default text, png, and tar.gz outputs.
confidence: medium
assumptions:
  - The neutral executor provides a job-owned tmpfs directory on every allocated node as described in site_config.yml and the prompt.
  - Each node has approximately the configured 128G memory available, and the 6000-line, one-chromosome-per-node working set plus process memory fits within tmpfs and RAM.
  - Final correctness validation needs only the final archives accepted by the executor's final output policy.
  - Candidate node allocations of 2, 5, and 10 are all schedulable in principle on the configured account and partition; queue wait time is outside deployment_runtime_s.
evidence_used:
  - "allowed/prompt.md: candidate node counts, candidate storage tiers, baseline policy, runtime definition, and decision-only constraints."
  - "allowed/site_config.yml: slurm account oddite, partition slurm, one task per node, 32 CPUs per task, 128G memory per node, and storage path/cleanup semantics."
  - "allowed/neutral_executor_snapshot/run_mode.sbatch: chromosome-to-node modulo assignment, local work directory selection, baseline all-output policy, improved final-output policy, and cleanup behavior."
  - "allowed/neutral_executor_snapshot/run_partition.py: workdir preparation, per-node chromosome execution, parallel task phases, output filtering, and expected final output count."
  - "allowed/workflow_repo/DATA_INVENTORY.json: compressed source input sizes for 10 chromosomes and small population files."
  - "allowed/workflow_repo/bin/individuals.py: per-individual file creation and tar.gz intermediate creation."
  - "allowed/workflow_repo/bin/individuals_merge.py: tar extraction, merge writes, and merged tar.gz creation."
  - "allowed/workflow_repo/bin/mutation_overlap.py: extracted chromosome data reads, population output writes, plots, and final tar.gz output."
  - "allowed/workflow_repo/bin/frequency.py: extracted chromosome data reads, repeated text/png output generation, and final freq tar.gz output."
  - "allowed/workflow_repo/README.md: workflow-stage descriptions and bundled execution/memory discussion showing individuals dominates compute and stage-in/out were comparatively small in that reference profile."
  - "allowed/workflow_repo/analysis/pegasus-io-1000genome.csv: bundled size and memory observations for chromosome-scale tasks."
