confidence: medium
assumptions:
  - The neutral executor implements job-owned scratch preparation, final-output copyback, cleanup, and validation as described in the allowed snapshot and site configuration.
  - BeeGFS-only candidates are treated as baselines/reference plans; their DPM score is 0.0 because they have no explicit staging movement, not because they are the intended I/O-improved non-baseline deployment.
  - The 10-chromosome input bundle size and 128G memory per node are sufficient for 5-node scratch operation; scratch free capacity is not reported in the allowed evidence.
  - Candidate runtime ranking follows the static staged DPM evidence for storage movement plus WDD/IODD workflow-locality evidence; no prior runtime results were used.
