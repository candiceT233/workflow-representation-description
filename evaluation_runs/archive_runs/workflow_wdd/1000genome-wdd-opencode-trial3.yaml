pc_edges:
  - edge_id: pc:individuals->individuals_merge:n_to_1
    producer: task:individuals
    consumer: task:individuals_merge
    data_objects:
      - data:individual_chr_tar
    pc_pattern: n_to_1
    pc_pattern_rationale: Multiple individuals jobs (ind_jobs parameter, typically 1-250 per chromosome) produce tar files consumed by a single merge job per chromosome.
    data_flow_description: Each individuals job outputs a tar.gz file containing mutation data for a subset of individuals. All tar files for a chromosome are passed to a single merge job.
    coupling: tight
    coupling_rationale: Merge job must wait for all individuals jobs to complete before it can read and merge all input tar files.
    communication_pattern: file_per_producer
    data_volume_class: medium

  - edge_id: pc:individuals_merge->mutation_overlap:1_to_n
    producer: task:individuals_merge
    consumer: task:mutation_overlap
    data_objects:
      - data:merged_individuals_tar
    pc_pattern: 1_to_n
    pc_pattern_rationale: One merged tar file per chromosome is consumed by multiple mutation_overlap jobs (one per population).
    data_flow_description: Single merged individuals tar file per chromosome is read by multiple analysis jobs, each processing a different population.
    coupling: tight
    coupling_rationale: Each analysis job reads the full merged tar file after merge job completes.
    communication_pattern: file_per_producer
    data_volume_class: medium

  - edge_id: pc:individuals_merge->frequency:1_to_n
    producer: task:individuals_merge
    consumer: task:frequency
    data_objects:
      - data:merged_individuals_tar
    pc_pattern: 1_to_n
    pc_pattern_rationale: Same merged individuals tar is consumed by multiple frequency analysis jobs (one per population).
    data_flow_description: Single merged tar file per chromosome shared across population-specific frequency analysis jobs.
    coupling: tight
    coupling_rationale: Each frequency job reads the full merged tar file after merge job completes.
    communication_pattern: file_per_producer
    data_volume_class: medium

  - edge_id: pc:sifting->mutation_overlap:1_to_n
    producer: task:sifting
    consumer: task:mutation_overlap
    data_objects:
      - data:sifted_chr_file
    pc_pattern: 1_to_n
    pc_pattern_rationale: One sifted file per chromosome consumed by multiple mutation_overlap jobs (one per population).
    data_flow_description: Single sifted file per chromosome is read by multiple analysis jobs, each processing a different population.
    coupling: tight
    coupling_rationale: Each analysis job reads sifted file after sifting job completes.
    communication_pattern: file_per_producer
    data_volume_class: small

  - edge_id: pc:sifting->frequency:1_to_n
    producer: task:sifting
    consumer: task:frequency
    data_objects:
      - data:sifted_chr_file
    pc_pattern: 1_to_n
    pc_pattern_rationale: Same sifted file shared across frequency analysis jobs for different populations.
    data_flow_description: Single sifted file per chromosome shared across population-specific frequency analysis jobs.
    coupling: tight
    coupling_rationale: Each frequency job reads sifted file after sifting job completes.
    communication_pattern: file_per_producer
    data_volume_class: small

