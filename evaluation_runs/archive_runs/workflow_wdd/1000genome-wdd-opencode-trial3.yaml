      possible_values: "1-22 chromosomes (from data.csv rows)"
    estimated_size_hint: "~80-150 MB per chromosome (250k lines)"
    producer_task: null
    consumer_tasks:
      - task:individuals
    lifecycle:
      creation_phase: null
