workflow_patterns:
  primary_pattern: scatter_gather
  secondary_patterns:
    - cascading
  classification_rationale: >
    The workflow exhibits scatter-gather pattern at multiple levels:
    (1) individuals jobs scatter across chromosome segments, gather into merge job;
    (2) merge output scatters to multiple population-specific analysis jobs.
    The overall flow follows cascading stages (data_ingestion -> sifting -> analysis).
    The n_to_1 edges from individuals to merge and 1_to_n edges from merge/sifting
    to analysis tasks demonstrate the scatter-gather structure.
  pattern_table_row: "1000genome | 3 stages | 5 task types (multiple instances) | n_to_1, 1_to_n | parallel file processing, sequential merge, multi-population analysis"

io_behavioral_hints:
  - hint_id: hint:small_file_overhead_individuals
    description: Individuals task creates one output file per individual (2504 files per chromosome) before tar compression. This creates small-file overhead during the file creation phase before compression reduces the count.
    affected_tasks:
      - task:individuals
    affected_data:
      - data:individual_chr_tar
    potential_concern: small_file_overhead

  - hint_id: hint:data_reuse_merged_individuals
    description: The merged_individuals_tar file (created once per chromosome) is read multiple times - once by each population-specific mutation_overlap job and once by each frequency job. This creates redundant I/O as the same file is extracted and processed repeatedly.
    affected_tasks:
      - task:mutation_overlap
      - task:frequency
    affected_data:
      - data:merged_individuals_tar
    potential_concern: data_reuse

  - hint_id: hint:data_reuse_sifted_file
    description: The sifted_chr_file (created once per chromosome) is read by multiple population-specific analysis jobs, causing the same file to be read repeatedly across different analysis tasks.
    affected_tasks:
      - task:mutation_overlap
      - task:frequency
    affected_data:
      - data:sifted_chr_file
    potential_concern: data_reuse

execution_profiles:
