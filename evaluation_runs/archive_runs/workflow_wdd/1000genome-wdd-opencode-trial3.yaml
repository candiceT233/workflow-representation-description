metadata:
  workflow_lineage_id: wrd:1000genome
  version: 1.0.0
  version_notes: Initial WDD compiled from daxgen.py (Pegasus workflow generator).
  deprecated: false
  workflow_name: 1000genome
  workflow_description: The 1000 Genomes workflow identifies mutational overlaps using data from the 1000 genomes project to provide a null distribution for statistical-related mutations. It evaluation of disease fetches, parses, and analyzes Phase3 data by chromosome, cross-matches extracted data with SIFT scores (predicting amino acid substitution effects), and performs overlap analysis and frequency measurements across populations.
  source_repository: /home/mtang11/scripts/workflow-representation-description/workflows_repo/1000genome-workflow
  source_commit: null
  source_format: compiled_from_pegasus_dax
  source_file: daxgen.py
  schema_version: wrd-7.0
  generated_by: opencode
  generated_at: 2026-03-04T00:00:00Z
  last_modified_at: 2026-03-04T00:00:00Z

stages:
  - stage_id: stage:data_ingestion
    name: Data Ingestion
    order: 1
    description: Downloads and processes VCF files for each chromosome to extract individual-level mutation data. Parallelized across chromosomes and individuals within each chromosome.
    tasks:
      - task:individuals
      - task:individuals_merge

  - stage_id: stage:sifting
    name: Sifting
    order: 2
    description: Filters SNP variants using SIFT scores from Variant Effect Predictor (VEP) annotations to identify deleterious mutations.
    tasks:
      - task:sifting

  - stage_id: stage:analysis
    name: Analysis
    order: 3
    description: Performs mutation overlap analysis and frequency calculations across populations for each chromosome.
    tasks:
      - task:mutation_overlap
      - task:frequency

tasks:
  - task_id: task:individuals
    name: Individuals Processing
    stage: stage:data_ingestion
    executable: bin/individuals.py
    description: Processes chromosome VCF files to extract per-individual mutation data. For each chromosome, it reads the VCF file and creates individual mutation files containing only the positions where each individual has mutations (either homozygous or heterozygous with allele frequency >= 0.5). Each job processes a subset of lines from the VCF file.
    behavioral_notes: Reads entire VCF file at startup, processes line by line, writes output files per individual in a chromosome, then compresses to tar.gz. Reads columns.txt for individual identifiers.
    parallelism_model:
      type: embarrassingly_parallel
      description: Each instance processes one chromosome segment independently. Number of instances per chromosome is configurable via ind_jobs parameter (default 1).
    io_dominance: io_bound
    io_access_type: python_serial
    restart_model: idempotent
    restart_checkpoint_dataset: null
    hardware_path:
      has_conditional_execution: false
      execution_alternatives: []
      minimum_resource_assertions:
        - resource: host_memory_gb
          condition: ">= 2.93 (varies by ind_jobs setting)"
          source_location: bin/individuals.py:1
    output_class: intermediate
    inputs:
      - data:vcf_file
      - data:columns_file
    outputs:
      - data:individual_chr_tar

  - task_id: task:individuals_merge
    name: Individuals Merge
    stage: stage:data_ingestion
    executable: bin/individuals_merge.py
    description: Merges the output tar.gz files from multiple individuals jobs for a single chromosome into a single consolidated tar.gz file containing all individuals for that chromosome.
    behavioral_notes: Extracts all tar files to temporary directory, merges content by filename (combining individual files), then recompresses into single tar.gz. Reads all input tar files before writing merged output.
    parallelism_model:
      type: serial
      description: One merge job per chromosome after all individuals jobs for that chromosome complete.
    io_dominance: io_bound
    io_access_type: python_serial
    restart_model: idempotent
    restart_checkpoint_dataset: null
    hardware_path:
      has_conditional_execution: false
      execution_alternatives: []
      minimum_resource_assertions: []
    output_class: intermediate
    inputs:
      - data:individual_chr_tar
    outputs:
      - data:merged_individuals_tar

  - task_id: task:sifting
    name: Sifting
    stage: stage:sifting
    executable: bin/sifting.py
    description: Filters SNP variants using SIFT scores from VEP annotation files. Extracts only variants with deleterious or tolerated SIFT predictions, capturing rs numbers, ENSEMBL gene IDs, and phenotype information.
    behavioral_notes: Reads entire VCF annotation file, filters using grep for SIFT keywords, parses line numbers and annotations, writes selected fields to output file.
    parallelism_model:
      type: embarrassingly_parallel
      description: One sifting job per chromosome, processing VEP annotation files independently.
    io_dominance: balanced
    io_access_type: python_serial
    restart_model: idempotent
    restart_checkpoint_dataset: null
    hardware_path:
      has_conditional_execution: false
      execution_alternatives: []
      minimum_resource_assertions: []
    output_class: intermediate
    inputs:
      - data:sift_annotation_file
    outputs:
      - data:sifted_chr_file

  - task_id: task:mutation_overlap
    name: Mutation Overlap Analysis
    stage: stage:analysis
    executable: bin/mutation_overlap.py
    description: Measures overlap in mutations among pairs of individuals by population and chromosome. Performs cross-matching of mutation sets, generates histograms and colormap visualizations of overlap distributions.
    behavioral_notes: Extracts merged tar.gz, reads individual mutation files, performs pairwise intersection calculations, generates numpy arrays and matplotlib plots. Creates multiple output files per chromosome-population combination.
    parallelism_model:
      type: embarrassingly_parallel
      description: One job per chromosome-population pair. Processes each combination independently.
    io_dominance: io_bound
    io_access_type: python_serial
    restart_model: idempotent
    restart_checkpoint_dataset: null
    hardware_path:
      has_conditional_execution: false
      execution_alternatives: []
      minimum_resource_assertions: []
    output_class: checkpoint
    inputs:
      - data:merged_individuals_tar
      - data:sifted_chr_file
      - data:population_file
      - data:columns_file
    outputs:
      - data:mutation_overlap_output

  - task_id: task:frequency
    name: Frequency Analysis
    stage: stage:analysis
    executable: bin/frequency.py
    description: Measures frequency of overlapping mutations by selecting random individuals and analyzing SNP distributions without SIFT score filtering. Generates histogram plots of mutation overlap frequencies.
    behavioral_notes: Extracts merged tar.gz, performs random sampling of individuals (1000 runs with 52 individuals per run), calculates overlap histograms, generates matplotlib plots. Creates frequency output files per chromosome-population combination.
    parallelism_model:
      type: embarrassingly_parallel
      description: One job per chromosome-population pair, similar to mutation_overlap but with random sampling approach.
    io_dominance: io_bound
    io_access_type: python_serial
    restart_model: idempotent
    restart_checkpoint_dataset: null
    hardware_path:
      has_conditional_execution: false
      execution_alternatives: []
      minimum_resource_assertions: []
    output_class: checkpoint
    inputs:
      - data:merged_individuals_tar
      - data:sifted_chr_file
      - data:population_file
      - data:columns_file
    outputs:
      - data:frequency_output

