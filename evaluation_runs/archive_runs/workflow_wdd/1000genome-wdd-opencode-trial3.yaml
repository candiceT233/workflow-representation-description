  - data_id: data:sift_annotation_file
    name: SIFT Annotation VCF
    description: VEP (Variant Effect Predictor) annotation files containing SIFT scores for SNP variants in each chromosome. Contains rs numbers, ENSEMBL gene IDs, SIFT predictions (deleterious/tolerated), and phenotype information.
    category: input
    persistence: workflow_scoped
    format_hint:
      container: plain_binary
