# -----------------------------------------------------------------------------
# SECTION 1: WORKFLOW HEADER
# -----------------------------------------------------------------------------
header:
  workflow_lineage_id: "f3a9c2e1-847b-4d02-b6f1-2c3d4e5f6a7b"
  version: "1.0.0"
  version_notes: "Initial WRD compiled from storm_tracking_pipeline.nf"
  deprecated: false

  workflow_name: "Atmospheric Storm Tracking and Intensity Analysis Pipeline"

  # Scientist-authored. Quality-validated: 47 words, passes Section 2a standards.
  workflow_description: >
    Processes raw ERA5 atmospheric reanalysis data to detect, track, and
    characterize extratropical storm systems over the North Atlantic basin.
    Starting from 6-hourly pressure-level netCDF fields, the pipeline identifies
    cyclone centers, builds storm tracks across timesteps, computes intensity
    metrics (minimum SLP, maximum wind speed, integrated kinetic energy), and
    produces a final storm catalog and per-storm trajectory files suitable for
    climatological analysis. Intended for 40-year reanalysis runs (1980–2019)
    as well as single-season case studies.

  source_format: "compiled_from_nextflow"
  source_file: "storm_tracking_pipeline.nf"
  schema_version: "wrd-2.0"
  author: "Dr. Elena Vasquez, NCAR Mesoscale Dynamics Group"
  created_at: "2025-03-12T14:22:00Z"
  last_modified_at: "2025-03-12T14:22:00Z"


# -----------------------------------------------------------------------------
# SECTION 2: TASK REGISTRY
# Canonical source of truth for task structure and relationships.
# The execution_graph is derived from this section — never edited directly.
# -----------------------------------------------------------------------------
task_registry:

  - task_id: "preprocess_era5"
    task_name: "ERA5 Preprocessing and Variable Extraction"
    # [AGENT-INFERRED, confidence: high — clear from Nextflow process block
    #  input/output declarations and variable names]
    semantic_description: >
      Reads raw ERA5 netCDF files for the requested date range and extracts the
      variables required for cyclone detection: mean sea-level pressure (MSLP),
      850 hPa wind components (u, v), and 500 hPa geopotential height. Regrides
      from the native 0.25° ERA5 grid to a 1° analysis grid to reduce downstream
      compute cost. Outputs one netCDF file per 6-hourly timestep. Without this
      task, all downstream tasks receive wrongly-shaped or missing input fields.
    executable_ref: "scripts/preprocess_era5.py"
    task_type: "preprocessing"
    output_class: "intermediate"
    relationships: []  # No upstream dependencies — this is the entry point
    loop_annotation:
      loop_id: "timestep_loop"
      loop_type: "parameter_sweep"
      bound_type: "parameter_set_size"
      parameter_ref: "params.date_range"
      loop_position: "body"

  - task_id: "detect_cyclones"
    task_name: "Cyclone Center Detection"
    # [AGENT-INFERRED, confidence: high]
    semantic_description: >
      Identifies candidate cyclone centers in each 6-hourly MSLP field using a
      local minimum detection algorithm (threshold: MSLP < 1000 hPa, spatial
      scale > 500 km). For each detected center, records the grid location,
      central pressure, and timestamp. Outputs a CSV of candidate centers per
      timestep. This task produces a large number of false positives that are
      filtered in the subsequent tracking step; the threshold is intentionally
      permissive to avoid missing weak systems.
    executable_ref: "scripts/detect_cyclones.py"
    task_type: "compute"
    output_class: "intermediate"
    relationships:
      - type: "data_dependency"
        target_task_id: "preprocess_era5"
        description: "Consumes per-timestep netCDF files produced by preprocessing"
    loop_annotation:
      loop_id: "timestep_loop"
      loop_type: "parameter_sweep"
      bound_type: "parameter_set_size"
      parameter_ref: "params.date_range"
      loop_position: "body"

  - task_id: "build_tracks"
    task_name: "Storm Track Assembly"
    # [AGENT-INFERRED, confidence: medium — function logic inferred from script
    #  name and comments; tracking algorithm details not in Nextflow script itself]
    semantic_description: >
      Links candidate cyclone centers across consecutive timesteps to form
      continuous storm tracks using a nearest-neighbor matching algorithm with
      a maximum displacement threshold of 800 km per 6 hours. Applies a minimum
      duration filter (tracks shorter than 48 hours are discarded as spurious).
      Takes all per-timestep candidate center CSVs and outputs a single
      storm_tracks.parquet file containing all tracks for the full date range,
      with each track assigned a unique storm ID. This is the first task whose
      output is scientifically useful on its own — the track file can be
      analyzed independently of intensity metrics.
    executable_ref: "scripts/build_tracks.py"
    task_type: "compute"
    output_class: "checkpoint"
    relationships:
      - type: "data_dependency"
        target_task_id: "detect_cyclones"
        description: "Consumes all per-timestep candidate center CSVs"
    # No loop annotation — this task collects across all timesteps in one pass

  - task_id: "compute_intensity"
    task_name: "Storm Intensity Metrics Computation"
    # [AGENT-INFERRED, confidence: high]
    semantic_description: >
      For each storm track, extracts a spatial domain around the track center at
      each timestep and computes three intensity metrics: minimum sea-level
      pressure within 500 km of center, maximum 10 m wind speed within 500 km
      of center, and integrated kinetic energy of the storm-scale circulation.
      Requires both the track file (for storm IDs and center locations) and the
      preprocessed wind and MSLP fields (for the actual field values). Outputs
      an intensity time series netCDF file per storm. Computationally the most
      expensive task in the pipeline.
    executable_ref: "scripts/compute_intensity.py"
    task_type: "compute"
    output_class: "intermediate"
    relationships:
      - type: "data_dependency"
        target_task_id: "build_tracks"
        description: "Consumes storm_tracks.parquet for center locations and storm IDs"
      - type: "data_dependency"
        target_task_id: "preprocess_era5"
        description: "Consumes preprocessed wind and MSLP fields for metric extraction"
    loop_annotation:
      loop_id: "per_storm_intensity_loop"
      loop_type: "data_driven"
      bound_type: "runtime_determined"
      loop_position: "body"

  - task_id: "filter_significant"
    task_name: "Significant Storm Filtering"
    # [AGENT-INFERRED, confidence: medium — threshold values inferred from
    #  script defaults; may need scientist review]
    semantic_description: >
      Applies meteorological significance criteria to retain only storms meeting
      the definition of an extratropical cyclone: minimum central pressure
      deepening rate of 1 hPa/hour for at least 24 hours (rapid cyclogenesis
      criterion), or sustained maximum wind speed exceeding 17.5 m/s for at
      least 48 hours. Discards weaker or short-lived disturbances. Takes all
      per-storm intensity netCDF files and the track parquet file; outputs a
      filtered_tracks.parquet containing only significant storms. This filtering
      step is what distinguishes a publishable storm catalog from a raw detection
      list.
    executable_ref: "scripts/filter_significant.py"
    task_type: "postprocessing"
    output_class: "checkpoint"
    relationships:
      - type: "data_dependency"
        target_task_id: "compute_intensity"
        description: "Consumes per-storm intensity netCDF files"
      - type: "data_dependency"
        target_task_id: "build_tracks"
        description: "Consumes storm_tracks.parquet for track geometry"

  - task_id: "compute_climatology"
    task_name: "Climatological Statistics Aggregation"
    # [AGENT-INFERRED, confidence: high]
    semantic_description: >
      Aggregates the filtered storm catalog into seasonal and decadal climatology
      statistics: storm frequency per month and season, mean track density
      (storms per degree-squared per decade), mean and extreme intensity
      distributions, and year-on-year trend estimates. Outputs a
      climatology_summary.nc file containing gridded track density fields and
      a climatology_stats.csv with basin-wide summary statistics. This task
      requires the full date range to be meaningful; running it on a single
      season produces statistically unreliable results.
    executable_ref: "scripts/compute_climatology.py"
    task_type: "compute"
    output_class: "checkpoint"
    relationships:
      - type: "data_dependency"
        target_task_id: "filter_significant"
        description: "Consumes filtered_tracks.parquet and per-storm intensity files"

  - task_id: "generate_catalog"
    task_name: "Final Storm Catalog Generation"
    # [AGENT-INFERRED, confidence: high]
    semantic_description: >
      Assembles the final human- and machine-readable storm catalog from all
      upstream outputs. Produces three artifacts: (1) storm_catalog.csv — one
      row per storm with track summary, peak intensity, genesis/lysis location
      and date; (2) storm_catalog.nc — the same data in netCDF format with full
      per-timestep track and intensity data for each storm; (3) a PDF summary
      report with track maps and intensity distributions. This is the primary
      deliverable of the pipeline and the artifact that gets archived and
      cited in publications.
    executable_ref: "scripts/generate_catalog.py"
    task_type: "postprocessing"
    output_class: "checkpoint"
    relationships:
      - type: "data_dependency"
        target_task_id: "filter_significant"
        description: "Consumes filtered_tracks.parquet"
      - type: "data_dependency"
        target_task_id: "compute_intensity"
        description: "Consumes per-storm intensity netCDF files"
      - type: "data_dependency"
        target_task_id: "compute_climatology"
        description: "Consumes climatology_summary.nc and climatology_stats.csv"


