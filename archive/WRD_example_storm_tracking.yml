# -----------------------------------------------------------------------------
# SECTION 4: DATA FLOW LAYER
# Three levels: semantic (always present), measured (tooling-populated),
# physical (DPM runtime traces, post-first-run).
# -----------------------------------------------------------------------------
data_flow:

  # --- Level 1: Semantic I/O Layer -------------------------------------------
  # Author-provided descriptions of what data flows between tasks.
  # Always present from compilation time.
  semantic:

    - dataset_id: "era5_raw"
      description: >
        Raw ERA5 reanalysis netCDF files, one file per 6-hourly timestep,
        containing MSLP, 850 hPa u/v wind, and 500 hPa geopotential height
        on a 0.25° global grid. Source data; not produced by any task in
        this workflow.
      file_format: "netCDF4"
      role: "input"
      producer_task: null  # external input
      consumer_tasks: ["preprocess_era5"]

    - dataset_id: "preprocessed_fields"
      description: >
        Regridded 1° netCDF files, one per 6-hourly timestep, containing the
        extracted variables needed for detection and intensity computation.
        Transient; only needed until compute_intensity finishes.
      file_format: "netCDF4"
      role: "intermediate"
      producer_task: "preprocess_era5"
      consumer_tasks: ["detect_cyclones", "compute_intensity"]

    - dataset_id: "candidate_centers"
      description: >
        Per-timestep CSV files listing candidate cyclone center locations,
        central pressures, and timestamps. High volume, short-lived; consumed
        immediately by build_tracks.
      file_format: "CSV"
      role: "intermediate"
      producer_task: "detect_cyclones"
      consumer_tasks: ["build_tracks"]

    - dataset_id: "storm_tracks"
      description: >
        All storm tracks for the full date range in a single parquet file.
        Each row is a track point (storm_id, timestamp, lat, lon, central_pressure).
        First independently useful output — can be analyzed without intensity data.
      file_format: "parquet"
      role: "checkpoint"
      producer_task: "build_tracks"
      consumer_tasks: ["compute_intensity", "filter_significant"]

    - dataset_id: "storm_intensity_files"
      description: >
        One netCDF file per storm containing the intensity time series:
        minimum SLP, maximum wind speed, and integrated kinetic energy at
        each tracked timestep. Large collective size for multi-decadal runs.
      file_format: "netCDF4"
      role: "intermediate"
      producer_task: "compute_intensity"
      consumer_tasks: ["filter_significant", "generate_catalog"]

    - dataset_id: "filtered_tracks"
      description: >
        Parquet file containing only storms that meet the extratropical
        cyclone significance criteria. Subset of storm_tracks; this is the
        publishable storm list.
      file_format: "parquet"
      role: "checkpoint"
      producer_task: "filter_significant"
      consumer_tasks: ["compute_climatology", "generate_catalog"]

    - dataset_id: "climatology_summary"
      description: >
        Gridded track density and intensity climatology in netCDF format,
        plus a CSV of basin-wide summary statistics. Useful for trend analysis
        and comparison with other reanalysis products.
      file_format: "netCDF4 + CSV"
      role: "checkpoint"
      producer_task: "compute_climatology"
      consumer_tasks: ["generate_catalog"]

    - dataset_id: "storm_catalog"
      description: >
        Final storm catalog in CSV and netCDF formats plus a PDF summary
        report. Primary deliverable. Archived and cited in publications.
      file_format: "CSV + netCDF4 + PDF"
      role: "checkpoint"
      producer_task: "generate_catalog"
      consumer_tasks: []  # terminal output


  # --- Level 2: Measured I/O Layer -------------------------------------------
  # Populated by deployment tooling — NOT by the scientist.
  # Input sizes measured from the input directory at deployment time.
  # Output sizes measured from prior completed runs.
