# -----------------------------------------------------------------------------
# SECTION 5: EXECUTION PROFILES
# Named, valid partial execution subsets. required_task_set is always
# auto-derived by backward traversal from terminal_task_id — never manually set.
# -----------------------------------------------------------------------------
execution_profiles:

  - profile_name: "tracks_only"
    terminal_task_id: "build_tracks"
    description: >
      Produces storm track files only (storm_tracks.parquet). No intensity
      metrics or filtering. Useful for quick track climatology studies or
      as input to external intensity tools. Fastest profile — skips the
      computationally expensive intensity computation entirely.
    required_task_set:  # AUTO-DERIVED by backward DAG traversal
      - "preprocess_era5"
      - "detect_cyclones"
      - "build_tracks"
    output_dataset_ids:
      - "storm_tracks"

  - profile_name: "tracks_and_intensity"
    terminal_task_id: "filter_significant"
    description: >
      Produces the filtered significant storm catalog (filtered_tracks.parquet)
      with full per-storm intensity metrics. Suitable for studies focused on
      individual storm analysis or event attribution. Does not include the
      climatological aggregation.
    required_task_set:  # AUTO-DERIVED
      - "preprocess_era5"
      - "detect_cyclones"
      - "build_tracks"
      - "compute_intensity"
      - "filter_significant"
    output_dataset_ids:
      - "storm_tracks"
      - "filtered_tracks"
      - "storm_intensity_files"

  - profile_name: "full"
    terminal_task_id: "generate_catalog"
    description: >
      Complete pipeline. Produces the full storm catalog (CSV + netCDF + PDF),
      climatological statistics, and all intermediate checkpoints. This is the
      profile for production 40-year reanalysis runs intended for publication.
    required_task_set:  # AUTO-DERIVED
      - "preprocess_era5"
      - "detect_cyclones"
      - "build_tracks"
      - "compute_intensity"
      - "filter_significant"
      - "compute_climatology"
      - "generate_catalog"
    output_dataset_ids:
      - "storm_tracks"
      - "filtered_tracks"
      - "storm_intensity_files"
      - "climatology_summary"
      - "storm_catalog"


