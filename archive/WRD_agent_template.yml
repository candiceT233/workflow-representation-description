# =============================================================================
# WORKFLOW REPRESENTATION DOCUMENT (WRD) — AGENT TEMPLATE
# Schema version: 1.0  |  WRD Design version: 2.0
#
# PURPOSE
# This file is the template an AI agent reads from a workflow repository and
# fills in. It is not a human-authored document — it is a structured schema
# that drives agent behavior.
#
# HOW AN AGENT USES THIS FILE
# 1. Clone or read the workflow repository.
# 2. For every field marked _status: required_static — extract from code
#    analysis. If extraction fails, treat as required_static_ask.
# 3. For every field marked _status: required_static_ask — if not resolvable
#    from code, prompt the scientist for input before proceeding.
# 4. For every field marked _status: required_deploy — leave null; deployment
#    tooling (Jarvis-MCP, WIDGET) will fill before the first run.
# 5. For every field marked _status: optional_enrichment — leave null;
#    filled after first run from DPM traces or profiling tools.
# 6. Once all required_static and required_static_ask fields are filled,
#    the WRD is valid for Jarvis-MCP to create a deployment pipeline.
#
# FIELD STATUS LEGEND
#   required_static       Needed for deployment. Extract from code analysis.
#                         Agent fills automatically. If extraction fails,
#                         escalate to required_static_ask.
#
#   required_static_ask   Needed for deployment. Cannot be reliably extracted
#                         from code. Agent MUST prompt the scientist.
#
#   required_deploy       Needed for deployment. Filled by deployment tooling
#                         (Jarvis-MCP measures input dir; WIDGET fills HPC
#                         resource fields). Not from code. Leave null until
#                         deployment planning pass.
#
#   optional_enrichment   Not needed for deployment. Filled after first run
#                         from DPM I/O traces or profiling tools. Improves
#                         storage planning and diagnostics over time.
#
# VERSIONING
# Template changes (task structure, relationships) → increment version.
# Data enrichment (measured sizes, profiling) → update in place, same version.
# =============================================================================


# -----------------------------------------------------------------------------
# SECTION 1: HEADER
# -----------------------------------------------------------------------------
header:

  workflow_lineage_id:
    _status: required_static
    _extract: "Generate a new UUID if this is a new WRD. If re-compiling an
               existing WRD, preserve the existing lineage_id."
    _value: null

  version:
    _status: required_static
    _extract: "Set to '1.0.0' for a new WRD. Increment on any template change."
    _value: null

  version_notes:
    _status: required_static
    _extract: "For first compilation: 'Initial WRD compiled from <source_file>'.
               For updates: describe what changed."
    _value: null

  deprecated:
    _status: required_static
    _extract: "Set to false for all new WRDs."
    _value: null

  workflow_name:
    _status: required_static
    _extract: "Look for a name in: README, workflow file header comments,
               config file 'name' field, Nextflow manifest.name,
               Pegasus workflow name attribute."
    _value: null

  workflow_description:
    _status: required_static_ask
    _extract: "Look for a description in: README first paragraph, workflow
               file header comment block, Nextflow manifest.description.
               If found, use it as a starting point but validate it meets
               quality standards (>20 words, domain-specific nouns, covers
               inputs/outputs/scientific purpose). If not found or
               insufficient, prompt the scientist."
    _prompt: "Please describe what this workflow does. Include: what scientific
              problem it solves, what domain it belongs to, what data it starts
              from, and what results it produces. (Minimum ~2-3 sentences.)"
    _quality_check:
      min_words: 20
      must_contain_domain_nouns: true
    _value: null

  source_format:
    _status: required_static
    _extract: "Detected workflow format: nextflow | pegasus_dax | parsl |
               swift_t | slurm_shell | makefile | snakemake | other"
    _value: null

  source_file:
    _status: required_static
    _extract: "Path to the primary workflow definition file in the repository."
    _value: null

  schema_version:
    _status: required_static
    _extract: "Set to 'wrd-2.0'."
    _value: "wrd-2.0"

  author:
    _status: required_static_ask
    _extract: "Look for author in: git log --format='%an <%ae>' | head -1,
               README, workflow file header, config author field."
    _prompt: "What is your name and affiliation? (Used for WRD provenance.)"
    _value: null

  created_at:
    _status: required_static
    _extract: "ISO 8601 timestamp at WRD compilation time."
    _value: null

  last_modified_at:
    _status: required_static
    _extract: "ISO 8601 timestamp. Same as created_at on first compilation."
    _value: null


# -----------------------------------------------------------------------------
# SECTION 2: TASK REGISTRY
# The agent builds this as a list. One entry per task discovered in the
# workflow code. The structure below is the schema for a single task entry.
# Repeat for every task found.
# -----------------------------------------------------------------------------
task_registry:
  # Agent populates this as a YAML list of task objects.
  # Schema for each task object:
  _task_schema:

    task_id:
      _status: required_static
      _extract: "Unique identifier. Derive from the task/process/function name
                 in the workflow code. Normalize to snake_case. Must be unique
                 within this WRD."
      _value: null

    task_name:
      _status: required_static
      _extract: "Human-readable name. Use the task/process name from the code,
                 formatted with spaces (e.g., 'preprocess_era5' → 'ERA5
                 Preprocessing'). Infer from code context if not explicit."
      _value: null

    semantic_description:
      _status: required_static_ask
      _extract: "Attempt to infer from: function/process docstring, inline
                 comments, input/output variable names, executable name,
                 script filename. Construct a candidate description. If the
                 candidate is <20 words or contains only generic verbs with
                 no domain nouns, escalate to ask.
                 Quality check: must include what the task does in domain
                 terms, what it takes as input, what it produces as output."
      _prompt: "I could not find a sufficient description for task '{task_id}'.
                What does this task do? Please include: what it does in domain
                terms, what data it takes as input, what data it produces, and
                why it exists in the workflow."
      _quality_check:
        min_words: 20
        must_contain_domain_nouns: true
      _confidence_record:
        filled_by: null
        confidence_level: null     # high | medium | low | inferred
        confidence_reason: null
        requires_human_review: null
      _value: null

    executable_ref:
      _status: required_static
      _extract: "Script or executable called by this task. Look for: script
                 blocks, process scripts, subprocess calls, exec() calls,
                 app() decorators."
      _value: null

    task_type:
      _status: required_static
      _extract: "Classify as one of: compute | io | preprocessing |
                 postprocessing | checkpoint. Infer from task name, script
                 content, and position in the DAG (first tasks = preprocessing,
                 last tasks = postprocessing, tasks with heavy file operations
                 = io)."
      _allowed_values: [compute, io, preprocessing, postprocessing, checkpoint]
      _value: null

    output_class:
      _status: required_static_ask
      _extract: "Cannot be reliably inferred from code alone. Attempt to infer:
                 if the task is terminal in the DAG (no downstream consumers),
                 it is likely 'checkpoint'. If outputs are consumed by many
                 downstream tasks and have no obvious scientific standalone
                 value, guess 'intermediate'. Always validate with scientist."
      _prompt: "Does task '{task_id}' produce outputs that are scientifically
                valuable to keep after the workflow completes (checkpoint), or
                are they only needed to pass data to the next task and can be
                cleaned up (intermediate)?
                Answer: checkpoint or intermediate"
      _allowed_values: [intermediate, checkpoint]
      _value: null

    relationships:
      _status: required_static
      _extract: "Build the relationship list from code analysis:
                 - Nextflow: channel connections between processes
                 - Pegasus DAX: <uses> job dependencies
                 - Parsl: depends_on= arguments in App calls
                 - Slurm: #SBATCH --dependency= directives
                 - Swift/T: data flow between app() calls
                 Each relationship has:
                   type: depends_on | data_dependency | optional_after
                   target_task_id: <task_id of upstream task>
                   description: what data or ordering constraint this represents
                 An empty list [] is valid for the entry-point task(s)."
      _value: []

    loop_annotation:
      _status: required_static
      _extract: "Detect loop participation from: foreach/for loops in scripts,
                 scatter/gather patterns in Nextflow channels, map() over
                 parameter lists in Parsl, array job patterns in Slurm.
                 If no loop detected, set to null.
                 If loop detected, fill all sub-fields below."
      _value: null
      _schema_if_loop_present:
        loop_id:
          _extract: "Assign a descriptive ID. Tasks inside the same loop share
                     the same loop_id."
          _value: null
        loop_type:
          _extract: "static | parameter_sweep | data_driven | convergence.
                     static: fixed iteration count in code.
                     parameter_sweep: iterates over a named parameter list or
                       input file set.
                     data_driven: count determined at runtime by input data.
                     convergence: iterates until a scientific criterion is met."
          _allowed_values: [static, parameter_sweep, data_driven, convergence]
          _value: null
        bound_type:
          _extract: "fixed_count | parameter_set_size | runtime_determined |
                     convergence_criterion"
          _allowed_values: [fixed_count, parameter_set_size, runtime_determined, convergence_criterion]
          _value: null
        fixed_count:
          _extract: "Integer. Only present when bound_type=fixed_count."
          _value: null
        parameter_ref:
          _extract: "Name of the parameter or input channel that determines
                     loop count. Only present when bound_type=parameter_set_size."
          _value: null
        convergence_condition:
          _status: required_static_ask   # REQUIRED when loop_type=convergence
          _extract: "Look for termination conditions in: while loop conditions,
                     convergence check function calls, threshold variable names."
          _prompt: "Task '{task_id}' appears to be part of a convergence loop.
                    What is the termination condition? Please describe in plain
                    language (e.g., 'iterate until residual drops below 1e-6
                    or 500 iterations are reached')."
          _required_when: "loop_type == convergence"
          _value: null
        max_iterations_guard:
          _status: required_static_ask   # REQUIRED when loop_type=convergence
          _extract: "Look for max_iter, max_steps, iteration_limit variables."
          _prompt: "What is the maximum number of iterations this loop should
                    run before stopping, even if convergence is not reached?
                    (This prevents runaway execution.)"
          _required_when: "loop_type == convergence"
          _value: null
        loop_position:
          _extract: "body | entry_gate | exit_check"
          _allowed_values: [body, entry_gate, exit_check]
          _value: null


# -----------------------------------------------------------------------------
# SECTION 3: EXECUTION GRAPH
# Derived from task_registry. The agent generates this — it is never
# manually authored.
# -----------------------------------------------------------------------------
execution_graph:
  _status: required_static
  _extract: "Generate by reading all task_registry[*].relationships entries.
             Nodes = all task_ids. Edges = all relationship entries across
             all tasks, deduplicated. Loop groups = tasks sharing a loop_id.
             Compute integrity_hash as SHA-256 of the canonical serialization
             of all relationship entries in task_registry.
             Any agent reading this section must verify the hash against the
             current task_registry before using the graph. Hash mismatch =
             reject and regenerate."

  integrity_hash:
    _status: required_static
    _extract: "SHA-256 of canonical serialization of task_registry relationships."
    _value: null

  last_generated:
    _status: required_static
    _extract: "ISO 8601 timestamp of when this graph was last generated."
    _value: null

  nodes:
    _status: required_static
    _extract: "List of all task_ids from task_registry."
    _value: []

  edges:
    _status: required_static
    _extract: "List of {from, to, type} objects derived from
               task_registry[*].relationships."
    _value: []

  loop_groups:
    _status: required_static
    _extract: "Group tasks by shared loop_id from task_registry loop_annotations.
               For each group record: loop_id, tasks[], loop_type, a note
               describing how the loop manifests in the execution graph."
    _value: []


# -----------------------------------------------------------------------------
# SECTION 4: DATA FLOW LAYER
# Three levels with different population timing.
# -----------------------------------------------------------------------------
data_flow:

  # Level 1: Semantic I/O — extracted from code, always present
  semantic:
    _status: required_static
    _extract: "Build one entry per dataset (file or data artifact) that flows
               between tasks. Sources:
               - Nextflow: channel names, input/output declarations per process
               - Pegasus: <uses> file elements on jobs
               - Parsl: Future objects passed between Apps
               - Slurm: files referenced in --input/--output or hardcoded paths
               For each dataset record:
                 dataset_id, description, file_format, role, producer_task,
                 consumer_tasks[]
               role = input (external source) | intermediate | checkpoint
               Use output_class from task_registry to determine role:
                 intermediate task output → role: intermediate
                 checkpoint task output   → role: checkpoint
                 no producer task         → role: input"
    _dataset_schema:
      dataset_id:
        _status: required_static
        _extract: "Derive from channel name, file variable name, or output
                   filename pattern. Normalize to snake_case."
        _value: null
      description:
        _status: required_static_ask
        _extract: "Infer from variable name, file extension, and surrounding
                   code context. Apply same quality standards as task
                   semantic_description."
        _prompt: "What does the dataset '{dataset_id}' represent scientifically?
                  (e.g., 'Raw ERA5 netCDF files containing MSLP and wind fields
                  on a 0.25 degree grid')"
        _value: null
      file_format:
        _status: required_static
        _extract: "Infer from file extension, format flags in script arguments,
                   or explicit format declarations. Use: netCDF4 | HDF5 | CSV |
                   parquet | binary | JSON | text | other"
        _value: null
      role:
        _status: required_static
        _extract: "input | intermediate | checkpoint (derived from output_class
                   of producer task; input if no producer in this workflow)"
        _allowed_values: [input, intermediate, checkpoint]
        _value: null
      producer_task:
        _status: required_static
        _extract: "task_id of the task that writes this dataset, or null if
                   this is an external input to the workflow."
        _value: null
      consumer_tasks:
        _status: required_static
        _extract: "List of task_ids that read this dataset."
        _value: []

  # Level 2: Measured I/O — filled by deployment tooling, not code analysis
  measured:
    _status: required_deploy
    _filled_by: "Jarvis-MCP at deployment time (input sizes) and after run
                 completion (output sizes). Not from code. Leave all values
                 null at WRD compilation time."
    _dataset_schema:
      dataset_id:
        _value: null   # matches semantic layer dataset_id
      input_data_bytes:
        _status: required_deploy
        _filled_by: "Jarvis-MCP measures from input_data_path in Deployment Plan"
        _value: null
      output_data_bytes_per_profile:
        _status: optional_enrichment
        _filled_by: "Measured after first completed run, per execution profile"
        _value: null
      measurement_confidence:
        _value: "unavailable"   # default until measured
        _allowed_values: [high, estimated, unavailable]
      measurement_run_id:
        _value: null
      measurement_timestamp:
        _value: null

  # Level 3: Physical I/O — filled from DPM traces post-run
  physical:
    _status: optional_enrichment
    _filled_by: "DPM system I/O tracing during runtime. Matched to tasks by
                 task name and PID in the trace. All fields null until first
                 run completes."
    _task_schema:
      task_id:
        _value: null
      bytes_read:           { _status: optional_enrichment, _value: null }
      bytes_written:        { _status: optional_enrichment, _value: null }
      read_ops:             { _status: optional_enrichment, _value: null }
      write_ops:            { _status: optional_enrichment, _value: null }
      access_pattern:
        _status: optional_enrichment
        _allowed_values: [sequential, random, strided]
        _value: null
      observed_read_bandwidth_mbs:  { _status: optional_enrichment, _value: null }
      observed_write_bandwidth_mbs: { _status: optional_enrichment, _value: null }
      posix_open_time_s:    { _status: optional_enrichment, _value: null }
      posix_read_time_s:    { _status: optional_enrichment, _value: null }
      posix_write_time_s:   { _status: optional_enrichment, _value: null }
      posix_close_time_s:   { _status: optional_enrichment, _value: null }
      dpm_trace_run_id:     { _status: optional_enrichment, _value: null }
      dpm_trace_timestamp:  { _status: optional_enrichment, _value: null }


# -----------------------------------------------------------------------------
# SECTION 5: EXECUTION PROFILES
# Agent proposes profiles based on checkpoint tasks found. Scientist confirms.
# -----------------------------------------------------------------------------
execution_profiles:
  _status: required_static_ask
  _extract: "Propose one profile per checkpoint task found in task_registry
             (ordered by DAG depth). Also always include a 'full' profile
             terminating at the last task. Present proposed profiles to the
             scientist and ask: 'Do these profiles represent meaningful
             scientific stopping points? Should any be removed or renamed?'
             required_task_set is always auto-derived by backward DAG traversal
             from terminal_task_id — never manually specified by the scientist
             or the agent."
  _prompt: "I found {n} checkpoint tasks in your workflow, which suggests
            these natural stopping points:
            {proposed_profiles_list}
            Do these represent meaningful scientific results? Should any be
            removed, renamed, or described differently?"
  _profile_schema:
    profile_name:
      _status: required_static
      _value: null
    terminal_task_id:
      _status: required_static
      _extract: "The checkpoint task at which this profile terminates."
      _value: null
    description:
      _status: required_static_ask
      _prompt: "What scientific results does the '{profile_name}' profile
                produce? (e.g., 'Produces storm track files suitable for
                track climatology studies, without intensity metrics.')"
      _value: null
    required_task_set:
      _status: required_static
      _extract: "AUTO-DERIVED ONLY. Never manually specified. Compute by
                 backward traversal of execution_graph from terminal_task_id.
                 The agent must recompute this any time the execution graph
                 changes."
      _value: []
    output_dataset_ids:
      _status: required_static
      _extract: "Dataset IDs from data_flow.semantic whose producer_task
                 is in the required_task_set and whose role is checkpoint."
      _value: []


# -----------------------------------------------------------------------------
# SECTION 6: DEPLOYMENT CONSTRAINTS
# Scientist provides data sensitivity only. Everything else is agent/tooling.
# -----------------------------------------------------------------------------
deployment_constraints:

  scientist_provided:

    data_sensitivity:
      _status: required_static_ask
      _extract: "Look for sensitivity indicators in: README, data usage
                 agreements, config files, comments mentioning HIPAA, ITAR,
                 export control, or on-premise requirements. If nothing found,
                 default to 'none' and confirm with scientist."
      _prompt: "Are there any restrictions on where this workflow's data can
                be stored or processed? (e.g., data cannot leave on-premise,
                HIPAA-regulated, export-controlled, or none)"
      _value: null

  agent_filled:
    _status: required_deploy
    _filled_by: "WIDGET or Jarvis-MCP during deployment planning. All null
                 at WRD compilation time. Each field must be populated with
                 value, filled_by, timestamp, and confidence_level before
                 Jarvis-MCP generates the final execution pipeline."

    input_data_size:
      value_bytes:     { _status: required_deploy, _value: null }
      filled_by:       { _value: null }
      timestamp:       { _value: null }
      confidence_level:{ _value: null }

    parallelism_range_per_task:
      _note: "Agent generates one entry per task_id in task_registry."
      _task_entry_schema:
        task_id:       { _value: null }
        min_ranks:     { _status: required_deploy, _value: null }
        max_ranks:     { _status: required_deploy, _value: null }
        filled_by:     { _value: null }
        timestamp:     { _value: null }
        confidence_level: { _value: null }

    memory_footprint_per_task:
      _note: "Agent generates one entry per task_id in task_registry."
      _task_entry_schema:
        task_id:       { _value: null }
        value_gb:      { _status: required_deploy, _value: null }
        filled_by:     { _value: null }
        timestamp:     { _value: null }
        confidence_level: { _value: null }

    storage_tier_recommendations:
      _note: "Agent generates one entry per dataset_id in data_flow.semantic.
              Logic: intermediate role → burst_buffer or node_local (temporary).
                     checkpoint role  → parallel_filesystem (persistent).
              Tier selection and sizing depend on measured input_data_size."
      _dataset_entry_schema:
        dataset_id:    { _value: null }
        tier:
          _allowed_values: [burst_buffer, node_local, parallel_filesystem, object_storage]
          _value: null
        rationale:     { _value: null }
        filled_by:     { _value: null }
        timestamp:     { _value: null }
        confidence_level: { _value: null }

    total_storage_budget:
      value_gb:        { _status: required_deploy, _value: null }
      filled_by:       { _value: null }
      timestamp:       { _value: null }
      confidence_level:{ _value: null }


# -----------------------------------------------------------------------------
# SECTION 7: TRANSLATION METADATA
# Agent fills this during compilation. Records provenance and all confidence
# scores for inferred fields.
# -----------------------------------------------------------------------------
translation_metadata:

  source_format:
    _status: required_static
    _value: null

  source_file:
    _status: required_static
    _value: null

  translation_tool:
    _status: required_static
    _extract: "Name and version of the agent or tool performing compilation."
    _value: null

  translation_timestamp:
    _status: required_static
    _value: null

  unmapped_fields:
    _status: required_static
    _extract: "List every field that could not be populated from the source,
               with the reason. An empty list is valid if all extractable
               fields were found."
    _schema:
      field_path: null
      reason: null
    _value: []

  round_trip_gaps:
    _status: required_static
    _extract: "List fields that will be lost if this WRD is compiled back to
               the source format (e.g., semantic descriptions have no
               representation in Pegasus DAX)."
    _schema:
      field_path: null
      note: null
    _value: []

  quality_warnings:
    _status: required_static
    _extract: "List any semantic_description fields that were auto-generated
               but flagged by quality validation (too short, no domain nouns,
               threshold values inferred from defaults that scientist should
               confirm)."
    _schema:
      field_path: null
      warning: null
    _value: []

  field_confidence_records:
    _status: required_static
    _extract: "One record for every field that was filled by the agent through
               inference rather than direct extraction. At minimum, all
               semantic_description fields and the execution_profiles proposal."
    _schema:
      field_path:           null
      filled_by:            null
      confidence_level:     null   # high | medium | low | inferred
      confidence_reason:    null
      requires_human_review: null  # true when confidence_level is low or inferred
    _value: []


# =============================================================================
# AGENT EXECUTION CHECKLIST
# Before passing this WRD to Jarvis-MCP for deployment pipeline creation,
# verify all of the following:
#
# [ ] All required_static fields have non-null _value
# [ ] All required_static_ask fields have non-null _value (filled by scientist
#     or by agent with confidence_level >= medium)
# [ ] execution_graph.integrity_hash matches current task_registry relationships
# [ ] All required_task_sets in execution_profiles were auto-derived (not
#     manually set)
# [ ] translation_metadata.field_confidence_records has an entry for every
#     agent-inferred field
# [ ] Any field with requires_human_review: true has been reviewed or
#     explicitly deferred by the scientist
#
# Fields that may remain null when handing off to Jarvis-MCP:
# [ ] All required_deploy fields (Jarvis-MCP fills these)
# [ ] All optional_enrichment fields (DPM fills these post-run)
# =============================================================================