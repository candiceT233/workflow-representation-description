# =============================================================================
# WIDGET — I/O Definition Document (IODD) Agent Template
# Schema: iodd-4.0  |  Architecture Design: v4
#
# PURPOSE
# The IODD captures the concrete I/O and communication behavior that emerges
# when a specific deployment (DDD) runs on specific hardware (HRD). It is
# the union of:
#   - DataLife DFL-G:  per-file lifecycle events (creation, access, deletion)
#   - DaYu SDG/FTG:   dataset-level semantic communication structure
#   - Darshan:         system-level POSIX I/O metrics per task
#
# The IODD can be:
#   EMPIRICAL  — populated by profiling tools after a completed run
#   PREDICTIVE — generated by an agent from DDD + HRD before a run executes.
#                Predictive IODDs carry predictive: true and confidence records.
#
# WHO FILLS THIS DOCUMENT
# EMPIRICAL mode: populated programmatically by DataLife, DaYu, and Darshan
#   integration scripts, then post-processed by the agent to compute
#   derived fields and the diagnosis summary.
#
# PREDICTIVE mode: filled entirely by the WIDGET prescription agent, given
#   DDD + HRD as inputs. Used to evaluate deployment strategies before
#   committing to an allocation.
#
# FIELD STATUS LEGEND
#   required_profiler     Populated directly from profiling tool output
#                         (DataLife, DaYu, Darshan). Null in predictive mode.
#
#   required_agent        Computed or derived by the agent from profiling
#                         output, DDD, HRD, and WRD cross-references.
#                         In predictive mode: agent estimates from DDD + HRD.
#
#   optional_profiler     Richer profiling data if available; improves
#                         diagnosis quality but not required for the
#                         diagnosis summary.
#
#   predictive_estimate   In predictive mode: agent fills with reasoned
#                         estimate. Must carry a confidence record. In
#                         empirical mode: replaced by measured value.
#
# AGENT READINESS GATE (empirical mode)
# After profiling tools complete and before handing IODD to diagnosis agent:
#   [ ] header fields all non-null, predictive = false
#   [ ] per_task_io_profile has one entry per active task instance
#   [ ] communication_channels has one entry per active pc edge
#   [ ] temporal_io_behavior has one entry per task
#   [ ] diagnosis_summary.bottleneck_summary populated
#   [ ] diagnosis_summary.pattern_match_wrd computed
#   [ ] All match_ddd and match_wrd_io_phase checks computed
#
# AGENT READINESS GATE (predictive mode)
# Before presenting predictive IODD to operator:
#   [ ] predictive = true
#   [ ] All predictive_estimate fields have confidence records
#   [ ] diagnosis_summary marks fields as predicted vs observed
#   [ ] optimization_opportunities derived from predicted bottlenecks
#
# ID NAMESPACE
#   IODD: iodd:<ddd_id>:<run_id>
#   (All task:, data:, pc:, tier: IDs reference source documents)
# =============================================================================


# -----------------------------------------------------------------------------
# SECTION 1: HEADER
# -----------------------------------------------------------------------------
header:

  iodd_id:
    _status: required_agent
    _extract: >
      Format: iodd:<ddd_id>:<run_id>
      Example: iodd:deploy:f3a9c2e1:throughput_optimized:run_007
    _value: null

  ddd_id:
    _status: required_agent
    _extract: Copied from DDD header.ddd_id.
    _value: null

  hrd_id:
    _status: required_agent
    _extract: Copied from DDD header.hrd_id.
    _value: null

  wrd_lineage_id:
    _status: required_agent
    _extract: Copied from DDD header.wrd_lineage_id.
    _value: null

  run_id:
    _status: required_agent
    _extract: >
      Unique identifier for this specific execution instance.
      Assign from job scheduler ID (e.g., Slurm job ID) if available,
      else generate a UUID.
    _value: null

  run_start:
    _status: required_profiler
    _extract: >
      ISO 8601 timestamp of job start.
      Source: Slurm sacct, scheduler log, or Darshan log start time.
    _predictive_reasoning: >
      In predictive mode: null (wall-clock time not predictable at this level).
    _value: null

  run_end:
    _status: required_profiler
    _extract: >
      ISO 8601 timestamp of job completion.
      Source: Slurm sacct, scheduler log, or Darshan log end time.
    _value: null

  wall_time_seconds:
    _status: required_agent
    _extract: >
      COMPUTED: (run_end - run_start) in seconds.
      In predictive mode: estimated from DDD parallelism_instances and
      expected per-task wall time if known from prior runs.
    _value: null

  predictive:
    _status: required_agent
    _extract: >
      false: this IODD was populated from profiling tool output.
      true:  this IODD was generated by an agent from DDD + HRD reasoning.
    _value: null    # boolean

  profiling_tools:
    _status: required_agent
    _extract: >
      List of profiling tools that contributed data to this IODD.
      In predictive mode: null.
      Example: [DataLife 2.1, DaYu 1.4, Darshan 3.4.2]
    _value: null

  schema_version:
    _status: required_agent
    _value: "iodd-4.0"

  description:
    _status: required_agent
    _extract: >
      In empirical mode: 2-3 sentence summary of what was observed —
      overall I/O pattern, whether it matched the DDD plan, and top
      bottleneck if any.
      In predictive mode: 2-3 sentences describing the predicted I/O
      behavior and confidence level.
    _value: null


# -----------------------------------------------------------------------------
# SECTION 2: PER-TASK I/O PROFILE
# One entry per task instance in the execution.
# For loop tasks: one entry per iteration, or one aggregate entry with
# per-iteration statistics (agent chooses based on data volume).
# Source: Darshan log per process, matched to WRD task_ids by task name
# and PID mapping from DPM trace.
# -----------------------------------------------------------------------------
per_task_io_profile:

  _population_protocol: >
    EMPIRICAL: Parse Darshan log. For each rank, extract bytes_read,
    bytes_written, op counts, POSIX timings. Aggregate by task_id using
    PID-to-task mapping from DPM trace or Slurm step IDs.

    PREDICTIVE: For each task in DDD per_task_parallelism:
      - Estimate bytes_read from WRD data_flow.lifecycle.size_measured_bytes
        for input datasets of this task (null if unavailable)
      - Estimate bytes_written similarly for output datasets
      - Estimate bandwidth as min(HRD tier peak bandwidth, task read/write rate
        implied by DDD parallelism and GD throughput goal)
      - Mark all values as predictive_estimate with confidence records

  _task_io_schema:

    task_id:
      _status: required_agent
      _extract: task_id from WRD task_registry.
      _value: null

    instance_id:
      _status: required_agent
      _extract: >
        Instance index for parallel or loop tasks (0-indexed).
        For non-parallel tasks: 0.
      _value: null

    storage_tier_used:
      _status: required_profiler
      _extract: >
        tier_id from HRD where I/O actually occurred.
        Detect from file paths in Darshan log (map mount point → tier_id).
        May differ from DDD assigned_tier if runtime routing occurred.
      _predictive_reasoning: DDD assigned_tier for this task's datasets.
      _value: null

    bytes_read:
      _status: required_profiler
      _extract: Total bytes read by this task instance. Source: Darshan.
      _predictive_reasoning: >
        Sum of WRD size_measured_bytes for all input datasets of this task.
        Null if sizes unavailable.
      _value: null

    bytes_written:
      _status: required_profiler
      _extract: Total bytes written by this task instance. Source: Darshan.
      _predictive_reasoning: >
        Sum of WRD size_measured_bytes for all output datasets of this task.
        Null if sizes unavailable.
      _value: null

    read_ops:
      _status: required_profiler
      _extract: Number of POSIX read() calls. Source: Darshan.
      _value: null

    write_ops:
      _status: required_profiler
      _extract: Number of POSIX write() calls. Source: Darshan.
      _value: null

    open_ops:
      _status: required_profiler
      _extract: Number of POSIX open() calls. Source: Darshan.
      _value: null

    close_ops:
      _status: required_profiler
      _extract: Number of POSIX close() calls. Source: Darshan.
      _value: null

    observed_read_bandwidth_gbs:
      _status: required_agent
      _extract: >
        COMPUTED: bytes_read / posix_read_time_s / 1e9
        Null if bytes_read or posix_read_time_s is null.
      _value: null

    observed_write_bandwidth_gbs:
      _status: required_agent
      _extract: >
        COMPUTED: bytes_written / posix_write_time_s / 1e9
      _value: null

    peak_read_bandwidth_gbs:
      _status: optional_profiler
      _extract: >
        Peak (not average) read bandwidth. Source: Darshan if available,
        or DXT (Darshan eXtended Tracing).
      _value: null

    peak_write_bandwidth_gbs:
      _status: optional_profiler
      _value: null

    posix_open_time_s:
      _status: required_profiler
      _extract: Cumulative seconds in open() calls. Source: Darshan.
      _value: null

    posix_read_time_s:
      _status: required_profiler
      _extract: Cumulative seconds in read() calls. Source: Darshan.
      _value: null

    posix_write_time_s:
      _status: required_profiler
      _extract: Cumulative seconds in write() calls. Source: Darshan.
      _value: null

    posix_close_time_s:
      _status: required_profiler
      _extract: Cumulative seconds in close() calls. Source: Darshan.
      _value: null

    access_pattern_observed:
      _status: required_agent
      _extract: >
        Derive from Darshan sequential/random byte counters:
          sequential: >90% sequential accesses
          random:     >50% random (non-sequential) accesses
          strided:    regular stride pattern detected
          mixed:      no dominant pattern
        Source: Darshan POSIX_ACCESS_ALIGNMENT counters.
      _allowed_values: [sequential, random, strided, mixed]
      _value: null

    io_phase_observed:
      _status: required_agent
      _extract: >
        Derive from DXT or DataLife timeline of reads/writes relative to
        task start and end:
          upfront:   all reads occur in first 10% of task wall time
          deferred:  all writes occur in last 10% of task wall time
          streaming: reads and/or writes distributed throughout task duration
          mixed:     reads upfront, writes deferred
        Compare to WRD temporal_io_annotation.io_phase.
        Flag mismatch in match_wrd_io_phase below.
      _allowed_values: [upfront, streaming, deferred, mixed]
      _value: null

    compute_to_io_ratio:
      _status: required_agent
      _extract: >
        COMPUTED: (posix_read_time_s + posix_write_time_s + posix_open_time_s
                   + posix_close_time_s) / task_wall_time_s
        Value near 1.0 = I/O bound. Value near 0.0 = compute bound.
        Use to update WRD io_dominance if this contradicts WRD estimate.
      _value: null

    contention_events:
      _status: optional_profiler
      _extract: >
        Count of detected I/O contention events: lock waits, bandwidth
        throttling events, or metadata operation timeouts.
        Source: DataLife contention detector or custom DPM hooks.
      _value: null

    dpm_trace_ref:
      _status: optional_profiler
      _extract: >
        Path or identifier of the DPM trace file or database entry for
        this task instance. Used for deeper investigation.
      _value: null

    match_wrd_io_phase:
      _status: required_agent
      _extract: >
        COMPUTED: true if io_phase_observed == WRD task
                  temporal_io_annotation.io_phase
        false = anomaly; flag in diagnosis_summary.anomalies.
      _value: null    # boolean


# -----------------------------------------------------------------------------
# SECTION 3: COMMUNICATION CHANNEL DEFINITIONS
# One entry per P-C edge in the WRD execution_graph that was active in
# this run. Source: DataLife DFL-G + DaYu SDG.
# -----------------------------------------------------------------------------
communication_channels:

  _population_protocol: >
    EMPIRICAL: For each data_dependency edge in WRD execution_graph:
      - Use DataLife to identify the actual file paths and tiers used
      - Use DaYu to characterize the semantic data flow pattern
      - Compute transfer bandwidth from Darshan bytes transferred /
        time between producer write completion and consumer read start
        (from DataLife timeline)

    PREDICTIVE: For each edge, derive from DDD storage_tier_assignments
      - physical_path from assigned_tier tier_type
      - data_volume_bytes from WRD size_measured_bytes (null if unavailable)
      - transfer_bandwidth_gbs estimated as min(HRD tier bandwidth, required)

  _channel_schema:

    pc_edge_id:
      _status: required_agent
      _extract: >
        pc:<producer_task_id>-><consumer_task_id>:<pc_pattern>
        Copied from WRD execution_graph.edges.
      _value: null

    physical_path:
      _status: required_profiler
      _extract: >
        How data actually moved between producer and consumer:
          shared_file_on_pfs:         both read/write same file on PFS
          staged_through_burst_buffer: data written to BB by producer,
                                       read from BB by consumer
          node_local_transfer:        producer and consumer co-located;
                                       data stays on node-local SSD
          in_memory_mpi:              data passed via MPI without touching disk
          streaming_pipe:             data streamed through a named pipe
                                       or shared memory ring buffer
        Source: DataLife file path analysis + mount point mapping.
      _allowed_values:
        - shared_file_on_pfs
        - staged_through_burst_buffer
        - node_local_transfer
        - in_memory_mpi
        - streaming_pipe
      _predictive_reasoning: >
        Derive from DDD assigned_tier tier_type for this dataset:
          parallel_filesystem → shared_file_on_pfs
          burst_buffer        → staged_through_burst_buffer
          node_local_ssd      → node_local_transfer
          in_memory           → in_memory_mpi
      _value: null

    tier_id:
      _status: required_agent
      _extract: >
        tier_id from HRD where data resided during this transfer.
        In empirical mode: from file path → mount point → tier_id mapping.
        In predictive mode: from DDD assigned_tier.
      _value: null

    data_volume_bytes:
      _status: required_profiler
      _extract: >
        Total bytes transferred on this channel.
        Source: DataLife or Darshan bytes written by producer + bytes read
        by consumer (use min to avoid double-counting replicated data).
      _predictive_reasoning: WRD size_measured_bytes for this dataset.
      _value: null

    transfer_bandwidth_gbs:
      _status: required_agent
      _extract: >
        COMPUTED: data_volume_bytes / transfer_time_s / 1e9
        Null if transfer_time_s unavailable.
      _value: null

    transfer_time_s:
      _status: required_profiler
      _extract: >
        Wall time from producer write start to consumer read completion
        on this channel. Source: DataLife timeline.
      _value: null

    transfer_pattern:
      _status: required_agent
      _extract: >
        bulk_sequential:      one large sequential transfer (common for
                               checkpoint writes)
        fine_grained_random:  many small random accesses across the dataset
                               (common for HDF5 chunked reads)
        chunked_streaming:    series of medium-sized sequential transfers
                               as data becomes available from producer
        Derive from access_pattern_observed of producer (write) and
        consumer (read) tasks.
      _allowed_values: [bulk_sequential, fine_grained_random, chunked_streaming]
      _value: null

    match_ddd:
      _status: required_agent
      _extract: >
        COMPUTED: true if physical_path is consistent with DDD
                  storage_tier_assignments.assigned_tier for this dataset.
        false = data routed to different tier than planned; flag in anomalies.
      _value: null    # boolean


# -----------------------------------------------------------------------------
# SECTION 4: DATA FORMAT OBSERVATIONS
# Per-dataset format details observed at runtime.
# Source: DaYu semantic analysis or Darshan access pattern heuristics.
# Supplements WRD format_internals with empirical confirmation.
# -----------------------------------------------------------------------------
data_format_observations:

  _dataset_obs_schema:

    dataset_id:
      _status: required_agent
      _extract: dataset_id from WRD data_flow.semantic.
      _value: null

    actual_file_format:
      _status: required_profiler
      _extract: >
        Format observed at runtime. Source: DaYu file format detector.
        Flag if different from WRD declared file_format.
      _value: null

    actual_chunk_size_bytes:
      _status: optional_profiler
      _extract: >
        Observed I/O request size for this dataset.
        Source: Darshan access size histogram (modal value).
      _value: null

    actual_compression:
      _status: optional_profiler
      _extract: >
        Whether compression was active during I/O.
        Source: DaYu HDF5/netCDF4 metadata analysis.
      _value: null    # boolean

    variable_length_data:
      _status: optional_profiler
      _extract: >
        Whether variable-length records were observed.
        Source: DaYu semantic analysis.
      _value: null    # boolean

    metadata_fraction:
      _status: required_agent
      _extract: >
        COMPUTED: (posix_open_time_s + posix_close_time_s) /
                  (posix_open_time_s + posix_read_time_s +
                   posix_write_time_s + posix_close_time_s)
        for the producer task of this dataset.
        High metadata_fraction (>0.3) indicates metadata bottleneck —
        flag in diagnosis_summary.
      _value: null

    format_match_wrd:
      _status: required_agent
      _extract: >
        COMPUTED: true if actual_file_format == WRD file_format.
        false = format conversion occurred unexpectedly; flag in anomalies.
      _value: null    # boolean

    notes:
      _status: required_agent
      _extract: >
        Any format anomalies relevant to I/O performance.
        Leave null if no anomalies detected.
      _value: null


# -----------------------------------------------------------------------------
# SECTION 5: TEMPORAL I/O BEHAVIOR
# Per-task view of when I/O occurred relative to task execution.
# Source: DXT (Darshan eXtended Tracing) or DataLife timeline.
# -----------------------------------------------------------------------------
temporal_io_behavior:

  _temporal_schema:

    task_id:
      _status: required_agent
      _value: null

    io_start_offset_s:
      _status: required_profiler
      _extract: >
        Seconds after task start when first I/O operation was issued.
        Source: DXT timestamp of first POSIX read/write call.
      _value: null

    io_end_offset_s:
      _status: required_profiler
      _extract: >
        Seconds after task start when last I/O operation completed.
        Source: DXT timestamp of last POSIX read/write call.
      _value: null

    io_burst_count:
      _status: required_agent
      _extract: >
        Number of distinct I/O bursts: periods of high I/O activity
        separated by gaps of >5 seconds with no I/O.
        Derive from DXT timeline or DataLife access event clustering.
      _value: null

    inter_burst_gap_s:
      _status: required_agent
      _extract: >
        COMPUTED: average time between I/O burst end and next burst start.
        Null if io_burst_count <= 1.
      _value: null

    compute_io_overlap_fraction:
      _status: required_agent
      _extract: >
        COMPUTED: fraction of task wall time where both compute (CPU
        utilization > threshold) and I/O (bytes/s > threshold) were
        simultaneously active. 0.0 = fully sequential. 1.0 = fully
        overlapped. Source: combine DXT I/O timeline with CPU utilization
        timeline from Slurm or perf data.
      _value: null

    pipeline_overlap_observed:
      _status: required_agent
      _extract: >
        COMPUTED: true if this task was performing I/O at the same time
        that the immediately downstream task (per WRD DAG) was also
        active. Indicates effective pipeline overlap.
        Source: DataLife timeline cross-task analysis.
      _value: null    # boolean

    match_wrd_io_phase:
      _status: required_agent
      _extract: >
        COMPUTED: Compare io_start_offset_s and io_end_offset_s against
        task wall time to re-derive io_phase_observed. Compare to WRD
        temporal_io_annotation.io_phase:
          Match = true. Mismatch = false.
        false = WRD annotation was incorrect; record in anomalies and
        recommend WRD update.
      _value: null    # boolean


# -----------------------------------------------------------------------------
# SECTION 6: CONTENTION AND INTERFERENCE
# Per-contention-event observations.
# Source: DataLife contention detector, DaYu interference analysis,
# or heuristic detection from Darshan bandwidth drop analysis.
# -----------------------------------------------------------------------------
contention_and_interference:

  _contention_event_schema:

    event_id:
      _status: required_agent
      _format: "contention:<tier_id>:<timestamp_offset>"
      _value: null

    tier_id:
      _status: required_agent
      _extract: tier_id from HRD where contention was observed.
      _value: null

    contention_period_start:
      _status: required_profiler
      _extract: >
        Wall-clock time of contention period start.
        Source: point where observed bandwidth dropped below
        HRD peak * 0.7.
      _value: null

    contention_period_end:
      _status: required_profiler
      _value: null

    bandwidth_at_contention_gbs:
      _status: required_agent
      _extract: >
        COMPUTED: average observed bandwidth during contention period.
        Source: Darshan bandwidth time series (if DXT available) or
        aggregate bytes / contention duration estimate.
      _value: null

    bandwidth_baseline_gbs:
      _status: required_agent
      _extract: >
        HRD peak_read_bandwidth_gbs or peak_write_bandwidth_gbs for
        this tier. Used as the baseline for degradation_factor computation.
      _value: null

    degradation_factor:
      _status: required_agent
      _extract: >
        COMPUTED: bandwidth_at_contention_gbs / bandwidth_baseline_gbs
        Values below HRD contention_model.degradation_factor indicate
        worse-than-expected contention — flag in diagnosis_summary.
      _value: null

    likely_cause:
      _status: required_agent
      _extract: >
        Classify from available evidence:
          multi_job_sharing:   contention on shared tier from other jobs
                               (cross-reference with system monitoring data
                               or scheduler load at this time)
          cross_task_sharing:  multiple tasks within this job contending
                               on the same tier simultaneously
          metadata_bottleneck: metadata_fraction > 0.3 for affected tasks
          network_congestion:  bandwidth drop correlates with high network
                               utilization on HRD interconnect
          unknown:             insufficient data to classify
      _allowed_values:
        - multi_job_sharing
        - cross_task_sharing
        - metadata_bottleneck
        - network_congestion
        - unknown
      _value: null

    affected_tasks:
      _status: required_agent
      _extract: >
        List of task_ids performing I/O on this tier during the
        contention period.
      _value: []


# -----------------------------------------------------------------------------
# SECTION 7: PER-FILE LIFECYCLE EVENTS
# DataLife-style tracking of individual files within the run.
# Enables fine-grained staging efficiency and cleanup analysis.
# Source: DataLife DFL-G lifecycle annotations.
# -----------------------------------------------------------------------------
per_file_lifecycle:

  _file_lifecycle_schema:

    dataset_id:
      _status: required_agent
      _extract: dataset_id from WRD data_flow.semantic this file belongs to.
      _value: null

    file_path:
      _status: required_profiler
      _extract: Actual filesystem path observed. Source: DataLife file tracker.
      _value: null

    created_at_offset_s:
      _status: required_profiler
      _extract: Seconds after run_start when this file was created.
      _value: null

    first_read_at_offset_s:
      _status: required_profiler
      _extract: Seconds after run_start of first read access to this file.
      _value: null

    last_read_at_offset_s:
      _status: required_profiler
      _extract: Seconds after run_start of last read access.
      _value: null

    deleted_at_offset_s:
      _status: required_profiler
      _extract: >
        Seconds after run_start when file was deleted. Null if file was
        retained (checkpoint) or if deletion was not tracked.
      _value: null

    read_count:
      _status: required_profiler
      _extract: Total number of read accesses to this file.
      _value: null

    unique_reader_count:
      _status: required_profiler
      _extract: Number of distinct processes or task instances that read this file.
      _value: null

    size_bytes:
      _status: required_profiler
      _extract: Observed file size at time of last write close.
      _value: null

    idle_time_s:
      _status: required_agent
      _extract: >
        COMPUTED: first_read_at_offset_s - created_at_offset_s
        The staging gap: time file existed on disk before first consumer
        read it. Large idle_time on volatile tiers (burst buffer) wastes
        capacity. Flag if idle_time > 10% of total workflow wall time.
      _value: null

    lifetime_s:
      _status: required_agent
      _extract: >
        COMPUTED:
          If deleted: deleted_at_offset_s - created_at_offset_s
          If retained: run end time offset - created_at_offset_s
      _value: null

    match_wrd_retention:
      _status: required_agent
      _extract: >
        COMPUTED: Compare lifetime_s against expected retention from WRD
        data_flow.lifecycle.retention_window.
          For intermediate datasets: true if deleted after last_consumer_phase,
            false if deleted early (data loss risk) or retained too long
            (wasted capacity).
          For checkpoint datasets: true if retained (not deleted).
        false = retention anomaly; record in diagnosis_summary.anomalies.
      _value: null    # boolean


# -----------------------------------------------------------------------------
# SECTION 8: DIAGNOSIS SUMMARY
# Machine-readable diagnosis structured to directly feed Tier 1 agents.
# Agent fills this section last, after all observation sections are populated.
# In predictive mode: all values are estimates with confidence records.
# -----------------------------------------------------------------------------
diagnosis_summary:

  overall_io_pattern:
    _status: required_agent
    _extract: >
      Classify the observed I/O pattern at the workflow level.
      Derive from:
        - WRD workflow_pattern (structural expectation)
        - Actual communication_channels.physical_path distribution
        - Temporal ordering of I/O events across tasks
      Should match WRD workflow_pattern if deployment behaved as designed.
      Mismatch is a significant diagnostic signal.
    _allowed_values: [pipeline, scatter_gather, iterative, cascading, hybrid]
    _value: null

  pattern_match_wrd:
    _status: required_agent
    _extract: >
      COMPUTED: true if overall_io_pattern == WRD header.workflow_pattern.
      false = observed execution pattern diverged from structural expectation.
      Investigate: incorrect WRD classification, unexpected runtime behavior,
      or DDD decisions that changed data flow routing.
    _value: null    # boolean

  bottleneck_summary:
    _status: required_agent
    _extract: >
      List of identified I/O bottlenecks. One entry per distinct bottleneck.
      Detection heuristics:
        BANDWIDTH BOTTLENECK:
          observed_read/write_bandwidth_gbs < 50% of HRD tier peak
          AND compute_to_io_ratio > 0.6 for affected task
        METADATA BOTTLENECK:
          metadata_fraction > 0.3 for any task
        CONTENTION BOTTLENECK:
          degradation_factor < HRD contention_model.degradation_factor
          (worse than expected)
        STAGING BOTTLENECK:
          idle_time_s > 10% of workflow wall time for any large dataset
        PIPELINE STALL:
          pipeline_overlap_observed = false for tasks where WRD
          co_scheduling_hint = beneficial
    _bottleneck_entry_schema:
      entity:
        _extract: task_id or tier_id or dataset_id where bottleneck manifests.
        _value: null
      bottleneck_type:
        _allowed_values:
          - bandwidth
          - metadata
          - contention
          - staging_delay
          - pipeline_stall
          - other
        _value: null
      severity:
        _allowed_values: [high, medium, low]
        _extract: >
          high:   bottleneck causes >20% degradation in overall throughput or
                  wall time relative to DDD-projected performance
          medium: 5-20% degradation
          low:    <5% degradation or isolated to a non-critical path task
        _value: null
      evidence:
        _extract: >
          The specific metric values that identified this bottleneck.
          Example: "task:detect_cyclones observed_read_bandwidth=1.2 GB/s
          vs tier:burst_buffer peak=12 GB/s (10% efficiency)"
        _value: null
    _value: []

  optimization_opportunities:
    _status: required_agent
    _extract: >
      List of potential optimizations derived from observed bottlenecks.
      One entry per opportunity. Agent must reason from bottleneck evidence
      to a concrete actionable recommendation.
    _opportunity_entry_schema:
      opportunity_type:
        _allowed_values:
          - increase_parallelism
          - reassign_storage_tier
          - enable_pipelining
          - adjust_chunk_size
          - prefetch_input_data
          - reduce_metadata_operations
          - add_checkpoint_replication
          - adjust_cleanup_schedule
          - co_locate_pc_pair
          - other
        _value: null
      affected_entities:
        _extract: List of task_ids, dataset_ids, or tier_ids this opportunity affects.
        _value: []
      estimated_impact:
        _extract: >
          Plain-language estimate of the expected improvement.
          Example: "Increasing task:detect_cyclones instances from 64 to 128
          should improve burst buffer read bandwidth utilization from 10% to
          ~20%, reducing this stage's wall time by approximately 30-40%."
        _value: null
      evidence:
        _extract: >
          The IODD fields that support this recommendation.
          Example: "diagnosis_summary.bottleneck_summary[0]: bandwidth
          bottleneck on task:detect_cyclones; compute_to_io_ratio=0.85
          (io_bound confirmed); HRD burst_buffer.peak_read=12 GB/s;
          current utilization=1.2 GB/s with 64 instances."
        _value: null
      ddd_change_required:
        _extract: >
          Describe the specific DDD field(s) that would need to change
          to implement this optimization.
          Example: "DDD per_task_parallelism[task:detect_cyclones].parallelism_instances:
          64 → 128. Re-run DDD validation_summary after change."
        _value: null
    _value: []

  anomalies:
    _status: required_agent
    _extract: >
      List of fields where observed values diverged significantly from WRD
      annotations or DDD plans. Each anomaly should reference the specific
      mismatched fields and suggest whether a WRD update is needed.
    _anomaly_entry_schema:
      anomaly_type:
        _allowed_values:
          - io_phase_mismatch
          - communication_path_mismatch
          - format_mismatch
          - retention_mismatch
          - pattern_mismatch
          - unexpected_contention
          - other
        _value: null
      entity:
        _extract: task_id or dataset_id or tier_id where anomaly was observed.
        _value: null
      expected:
        _extract: The value predicted by WRD or DDD.
        _value: null
      observed:
        _extract: The value actually observed in this run.
        _value: null
      recommendation:
        _extract: >
          Should the WRD be updated to match observed reality?
          Or is this a deployment anomaly that should be corrected in the DDD?
          Example: "WRD temporal_io_annotation.io_phase for task:build_tracks
          should be updated from 'deferred' to 'mixed' — observed I/O is
          interleaved with compute. Update WRD and re-derive DDD pipelining
          decisions."
        _value: null
    _value: []

  predictive_confidence_records:
    _status: required_agent
    _required_when: header.predictive == true
    _extract: >
      In predictive mode: one confidence record per estimated field.
      Same schema as WRD translation_metadata.field_confidence_records:
        field_path, filled_by, confidence_level, confidence_reason,
        requires_human_review
      In empirical mode: null (all values are measured, not estimated).
    _value: null