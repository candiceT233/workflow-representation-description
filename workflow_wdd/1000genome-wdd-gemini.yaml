stages:
- stage_id: stage:prepare_inputs
  stage_name: Input Preparation and Sifting
  description: This stage splits the primary VCF data and computes SIFT scores.
- stage_id: stage:aggregate_individuals
  stage_name: Aggregate Individual Data
  description: This stage merges the processed individual data chunks.
- stage_id: stage:analyze_mutations
  stage_name: Analyze Mutations
  description: This stage performs mutation overlap and frequency analysis.
tasks:
- task_id: task:individuals
  stage_id: stage:prepare_inputs
  task_name: individuals
  description: Fetches and parses Phase3 data from the 1000 Genomes Project by chromosome,
    creating output files for each individual.
  executable_path: bin/individuals.py
  parallelism_model:
    type: embarrassingly_parallel
    notes: The task is parallelized per chromosome and then further subdivided into
      chunks within each chromosome.
  io_dominance: io_bound
  output_class: intermediate
  behavioral_notes: This task is highly parallel and can generate a large number
    of small files, which are then archived.
- task_id: task:sifting
  stage_id: stage:prepare_inputs
  task_name: sifting
  description: Computes the SIFT scores of all SNP variants from the VEP data for
    each chromosome.
  executable_path: bin/sifting.py
  parallelism_model:
    type: embarrassingly_parallel
    notes: One sifting task is run per chromosome.
  io_dominance: balanced
  output_class: intermediate
  behavioral_notes: ''
- task_id: task:individuals_merge
  stage_id: stage:aggregate_individuals
  task_name: individuals_merge
  description: Merges the output files from the parallel 'individuals' tasks for
    a single chromosome.
  executable_path: bin/individuals_merge.py
  parallelism_model:
    type: serial
    notes: A single merge task runs per chromosome, collecting results from all chunks.
  io_dominance: io_bound
  output_class: intermediate
  behavioral_notes: This task acts as a synchronization point (gather) for each
    chromosome.
- task_id: task:mutation_overlap
  stage_id: stage:analyze_mutations
  task_name: mutation_overlap
  description: Measures the overlap in mutations (SNP variants) among pairs of individuals,
    grouped by population and chromosome.
  executable_path: bin/mutation_overlap.py
  parallelism_model:
    type: embarrassingly_parallel
    notes: Analysis is parallelized for each combination of chromosome and population.
  io_dominance: compute_bound
  output_class: intermediate
  behavioral_notes: ''
- task_id: task:frequency
  stage_id: stage:analyze_mutations
  task_name: frequency
  description: Measures the frequency of overlapping mutations for random individuals,
    disregarding SIFT scores.
  executable_path: bin/frequency.py
  parallelism_model:
    type: embarrassingly_parallel
    notes: Analysis is parallelized for each combination of chromosome and population.
  io_dominance: compute_bound
  output_class: intermediate
  behavioral_notes: ''
