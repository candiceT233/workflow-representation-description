  secondary_patterns:
  - pipeline
  - scatter_gather
  - conditional
  - hybrid
  classification_rationale: The workflow's primary pattern is iterative, forming
    a closed loop where results from one iteration drive the next. Within the loop,
    it uses a scatter-gather pattern for simulations and operates as a pipeline of
    stages (Sim -> Train -> Select -> Agent).
  pattern_table_row: DeepDriveMD | iterative | pipeline, scatter_gather | n_to_1,
    1_to_n | shared_file, file_per_producer
