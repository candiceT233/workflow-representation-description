stages:
- stage_id: stage:molecular_dynamics
  stage_name: MolecularDynamics
  description: Run an ensemble of parallel molecular dynamics simulations.
- stage_id: stage:aggregation
  stage_name: Aggregating
  description: Aggregate and preprocess trajectory data from the simulation stage.
- stage_id: stage:machine_learning
  stage_name: MachineLearning
  description: Train a machine learning model on the aggregated simulation data.
- stage_id: stage:model_selection
  stage_name: ModelSelection
  description: Select the best model for the next iteration's agent.
- stage_id: stage:agent
  stage_name: Agent
  description: Use the selected model to analyze data and select new starting structures
    for the next simulation iteration.
tasks:
