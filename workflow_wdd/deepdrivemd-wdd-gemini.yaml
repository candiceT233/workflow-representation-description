- task_id: task:aggregation
  stage_id: stage:aggregation
  task_name: aggregation
  description: Combines trajectory data from multiple simulation tasks.
  executable_path: deepdrivemd/aggregation/basic/aggregate.py
  parallelism_model:
    type: serial
    notes: A single task to aggregate data from all simulations in the preceding
      stage.
  io_dominance: io_bound
  output_class: intermediate
  behavioral_notes: In the analyzed example, this stage is skipped.
- task_id: task:machine_learning
  stage_id: stage:machine_learning
  task_name: machine_learning
  description: Trains an adversarial autoencoder model on simulation output data.
  executable_path: deepdrivemd/models/aae/train.py
  parallelism_model:
    type: serial
    notes: A single training job is launched.
  io_dominance: compute_bound
  output_class: intermediate
  behavioral_notes: This task is typically GPU-accelerated.
- task_id: task:model_selection
  stage_id: stage:model_selection
  task_name: model_selection
  description: Selects a model to be used by the agent.
  executable_path: deepdrivemd/selection/latest/select_model.py
  parallelism_model:
    type: serial
    notes: A single task selects from available trained models.
  io_dominance: io_bound
  output_class: intermediate
  behavioral_notes: Currently selects the latest model, so it's a simple file operation.
- task_id: task:agent
  stage_id: stage:agent
  task_name: agent
  description: Uses a trained model to perform outlier detection (LOF) and select
    new starting PDB structures for the next MD stage.
  executable_path: deepdrivemd/agents/lof/lof.py
  parallelism_model:
    type: serial
    notes: A single agent task drives the selection for the next iteration.
  io_dominance: compute_bound
  output_class: intermediate
  behavioral_notes: This is the 'driving' part of the workflow that guides exploration.
