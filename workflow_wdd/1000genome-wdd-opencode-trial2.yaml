workflow_patterns:
  primary_pattern: scatter_gather
  secondary_patterns: []
  classification_rationale: >
    The workflow exhibits scatter_gather pattern: individuals jobs scatter across
    chromosome chunks (fan-out, n parallel instances), then individuals_merge
    gathers them (fan-in, 1 instance). After this, sifting runs independently
    per chromosome (scatter), and both mutation_overlap and frequency gather
    from the merged individuals and sifting outputs (n_to_1 per population).
    The overall structure is a combination of scatter-gather at the individuals
    stage followed by parallel independent analysis per chromosome-population.
  pattern_table_row: "1000genome | 3 | individuals (250x10), merge (10), sifting (10), mutation_overlap (60), frequency (60) | n_to_1 (ind->merge), 1_to_n (merge->analysis), 1_to_n (sift->analysis) | small files, shared file reads, high fan-out"

io_behavioral_hints:
  - hint_id: hint:small_file_overhead_individuals
    description: >
      The individuals task creates one output file per individual (2504 files)
      within each chunk, then compresses them into a tar.gz. This results in
      many small files being written and read, potentially causing metadata
      overhead on parallel file systems.
    affected_tasks:
      - task:individuals
      - task:individuals_merge
    affected_data:
      - data:individuals_chunk
    potential_concern: small_file_overhead

  - hint_id: hint:shared_file_read_mutation_overlap
    description: >
      Multiple mutation_overlap jobs (one per population, 6 total) read the same
      merged individuals file (individuals_merged) and sifted_sift file. This
      results in the same file being opened and read multiple times, potentially
      causing contention on parallel file systems.
    affected_tasks:
      - task:mutation_overlap
      - task:frequency
    affected_data:
      - data:individuals_merged
      - data:sifted_sift
    potential_concern: data_reuse

  - hint_id: hint:full_file_read_at_startup
    description: >
      Both mutation_overlap and frequency tasks extract the entire merged
      individuals tar.gz file at startup before processing. This requires
      reading the full file even though only a subset of individuals may be
      needed for a specific population analysis.
    affected_tasks:
      - task:mutation_overlap
      - task:frequency
    affected_data:
      - data:individuals_merged
    potential_concern: partial_access

execution_profiles:
  - profile_name: full
    terminal_task_id: task:frequency
    description: >
      Complete workflow execution producing all mutation overlap and frequency
      analysis results for all chromosomes and populations. This is the default
      full workflow producing scientifically valuable checkpoint outputs.
    required_task_set:
      - task:individuals
      - task:individuals_merge
      - task:sifting
      - task:mutation_overlap
      - task:frequency
    conditional_inclusions: []
    output_dataset_ids:
      - data:mutation_overlap_output
      - data:frequency_output

  - profile_name: individuals_only
    terminal_task_id: task:individuals_merge
    description: >
      Stops after individuals data extraction and merging. Produces merged
      per-chromosome individual mutation data without the downstream analysis.
      Useful for testing or when only the individuals data is needed.
    required_task_set:
      - task:individuals
      - task:individuals_merge
    conditional_inclusions: []
    output_dataset_ids:
      - data:individuals_merged

  - profile_name: sifting_only
    terminal_task_id: task:sifting
    description: >
      Stops after sifting analysis. Produces SIFT-filtered variant annotations
      per chromosome without the population-specific overlap analysis.
    required_task_set:
      - task:sifting
    conditional_inclusions: []
    output_dataset_ids:
      - data:sifted_sift

