# SECTION H: EXECUTION PROFILES
# ------------------------------------------------------------

execution_profiles:
  - profile_name: "mutation_analysis"
    terminal_task_id: "task:mutation_overlap"
    description: |
      Produces per-(chromosome, population) pairwise SNP mutation overlap statistics
      and visualizations with SIFT filtering applied. Includes all prerequisite tasks
      (data extraction, merge, sifting) required to reach mutation_overlap. Does not
      execute frequency analysis tasks.
    required_task_set:
      - "task:individuals"
      - "task:sifting"
      - "task:individuals_merge"
      - "task:mutation_overlap"
    output_dataset_ids:
      - "data:mutation_overlap_results"

  - profile_name: "frequency_analysis"
    terminal_task_id: "task:frequency"
    description: |
      Produces per-(chromosome, population) allele frequency distribution data
      and histograms from 1,000 random sampling runs, without SIFT filtering.
      Includes all prerequisite tasks (data extraction, merge, sifting) required
      to reach frequency. Does not execute mutation_overlap analysis tasks.
    required_task_set:
      - "task:individuals"
      - "task:sifting"
      - "task:individuals_merge"
      - "task:frequency"
    output_dataset_ids:
      - "data:frequency_results"

  - profile_name: "full"
    terminal_task_id: "task:frequency"
    description: |
      Complete workflow execution producing both mutation overlap statistics and
      frequency analysis for all (chromosome, population) pairs. Both mutation_overlap
      and frequency tasks execute in parallel at stage:analysis. Note: task:mutation_overlap
      and task:frequency are parallel terminal tasks with no ordering dependency between
      them; 'full' profile requires both to complete for scientific completeness.
    required_task_set:
      - "task:individuals"
      - "task:sifting"
      - "task:individuals_merge"
      - "task:mutation_overlap"
      - "task:frequency"
    output_dataset_ids:
      - "data:mutation_overlap_results"
      - "data:frequency_results"


