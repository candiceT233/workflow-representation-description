# ------------------------------------------------------------
# SECTION D: PRODUCER–CONSUMER EDGES
# ------------------------------------------------------------

pc_edges:
  - edge_id: "pc:individuals->individuals_merge:n_to_1"
    producer: "task:individuals"
    consumer: "task:individuals_merge"
    data_objects:
      - "data:individuals_chunk_tar"
    pc_pattern: "n_to_1"
    pc_pattern_rationale: |
      For each chromosome, N parallel individuals jobs each produce one chunk tar archive
      (chrXn-start-stop.tar.gz), all of which are consumed by a single individuals_merge
      job for that chromosome. With ind_jobs=1 (default), N=1 giving a degenerate 1_to_1
      case, but the structural pattern is n_to_1. With ind_jobs>1, N>1 per chromosome.
    data_flow_description: |
      Each chunk archive contains ~2,504 per-individual plain-text mutation files for
      the row range processed by that individuals job. individuals_merge opens each
      archive sequentially, extracts files to a temporary directory, reads and merges
      content into an in-memory dictionary, then re-archives. Full read of every
      chunk archive is performed.
    coupling: "tight"
    coupling_rationale: |
      individuals_merge cannot begin processing until all N individuals chunk archives
      for a given chromosome have been fully written. The merge task lists all expected
      chunk files as Pegasus job inputs, enforcing strict completion dependency.
    communication_pattern: "file_per_producer"
    data_volume_class: "medium"
    co_scheduling_hint: "beneficial"

  - edge_id: "pc:individuals_merge->mutation_overlap:1_to_n"
    producer: "task:individuals_merge"
    consumer: "task:mutation_overlap"
    data_objects:
      - "data:individuals_merged_tar"
    pc_pattern: "1_to_n"
    pc_pattern_rationale: |
      One individuals_merge job produces one chrXn.tar.gz per chromosome. That single
      archive is consumed by 7 parallel mutation_overlap jobs (one per population) for
      the same chromosome. Across 10 chromosomes, 10 merge outputs fan out to 70
      mutation_overlap consumers.
    data_flow_description: |
      Each mutation_overlap instance extracts the full chrXn.tar.gz archive (tarfile.
      extractall) at startup, then reads per-individual mutation files for the subset
      of individuals belonging to its target population. Full tar extraction precedes
      population filtering — all ~2,504 individual files are written to disk even if
      only a fraction belong to the target population.
    coupling: "tight"
    coupling_rationale: |
      mutation_overlap cannot begin until individuals_merge has written the full merged
      archive. Pegasus enforces this dependency via job input declarations.
    communication_pattern: "shared_file"
    data_volume_class: "medium"
    co_scheduling_hint: "beneficial"

  - edge_id: "pc:individuals_merge->frequency:1_to_n"
    producer: "task:individuals_merge"
    consumer: "task:frequency"
    data_objects:
      - "data:individuals_merged_tar"
    pc_pattern: "1_to_n"
    pc_pattern_rationale: |
      Same 1-to-7 fan-out as pc:individuals_merge->mutation_overlap:1_to_n. One merged
      archive per chromosome fans out to 7 frequency jobs. The merged archive is read
      by both mutation_overlap and frequency tasks — a data reuse relationship.
    data_flow_description: |
      Identical extraction pattern to mutation_overlap: frequency extracts the full
      chrXn.tar.gz archive before reading per-individual files. Data read pattern
      diverges after extraction: frequency reads only rs number column (item[1]) from
      per-individual mutation files whereas mutation_overlap reads the full line content.
    coupling: "tight"
    coupling_rationale: |
      frequency cannot begin until individuals_merge has written the full merged archive.
    communication_pattern: "shared_file"
    data_volume_class: "medium"
    co_scheduling_hint: "beneficial"

  - edge_id: "pc:sifting->mutation_overlap:1_to_n"
    producer: "task:sifting"
    consumer: "task:mutation_overlap"
    data_objects:
      - "data:sifted_sift_txt"
    pc_pattern: "1_to_n"
    pc_pattern_rationale: |
      One sifting job produces one sifted.SIFT.chrX.txt per chromosome. That single
      SIFT score file is consumed by all 7 mutation_overlap jobs for the same chromosome
      (one per population). Across 10 chromosomes, 10 sifted files fan out to 70 mutation
      overlap consumers.
    data_flow_description: |
      mutation_overlap reads the sifted SIFT file sequentially line by line to build
      a list of rs numbers with SIFT scores (read_rs_numbers method). The full file
      is read once per task instance. The file is small enough to be loaded into
      memory in its entirety before being used for set intersection with individual
      mutation data.
    coupling: "tight"
    coupling_rationale: |
      mutation_overlap cannot begin until sifting has produced the SIFT score file.
      Pegasus enforces via job input declarations. Sifting typically completes long
      before individuals_merge (observed: sifting ~6s vs individuals_merge ~500s).
    communication_pattern: "shared_file"
    data_volume_class: "small"
    co_scheduling_hint: "neutral"

  - edge_id: "pc:sifting->frequency:1_to_n"
    producer: "task:sifting"
    consumer: "task:frequency"
    data_objects:
      - "data:sifted_sift_txt"
    pc_pattern: "1_to_n"
    pc_pattern_rationale: |
      Same 1-to-7 fan-out per chromosome as pc:sifting->mutation_overlap:1_to_n. One
      sifted SIFT file per chromosome is consumed by 7 frequency jobs (one per
      population). The sifted file is shared between mutation_overlap and frequency
      consumers.
    data_flow_description: |
      frequency reads the sifted SIFT file in the same sequential manner as
      mutation_overlap (read_rs_numbers method). The SIFT score file is used only to
      extract rs numbers for set intersection; phenotype annotations are not used by
      frequency (SIFT=NO-SIFT mode). Technically the sifted file is read but its
      SIFT content is not used — only the rs number list is consumed.
    coupling: "tight"
    coupling_rationale: |
      frequency cannot begin until sifting has produced the SIFT score file, enforced
      by Pegasus input declarations.
    communication_pattern: "shared_file"
    data_volume_class: "small"
    co_scheduling_hint: "neutral"


