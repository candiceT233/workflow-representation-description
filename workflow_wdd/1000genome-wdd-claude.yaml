# ------------------------------------------------------------
# SECTION F: WORKFLOW-LEVEL PATTERN CLASSIFICATION
# ------------------------------------------------------------

workflow_patterns:
  primary_pattern: "scatter_gather"
  secondary_patterns:
    - "pipeline"
  classification_rationale: |
    The dominant structural pattern is scatter_gather, operating at two nested levels.
    First level (within each chromosome): the chromosome VCF is scattered across N
    parallel individuals jobs (1_to_n conceptually; implemented as parallel jobs over
    row ranges), whose outputs are gathered by a single individuals_merge job (n_to_1).
    Second level (across populations): the merged chromosome archive is scattered to
    7 parallel mutation_overlap jobs and 7 parallel frequency jobs per chromosome
    (1_to_n), with no final aggregation — the workflow produces independent per-
    (chromosome, population) output artifacts rather than reducing to a single result.

    The secondary pattern is pipeline: the three sequential stages (data_extraction →
    merge → analysis) form a linear dependency chain within each chromosome's execution
    path. The two parallel branches (individuals/sifting in stage 1) are independent
    sub-pipelines that synchronize at the analysis stage.

    The workflow is NOT iterative (no feedback loops), NOT conditional (no runtime
    branching visible in static code), and NOT hybrid (scatter_gather is the clearly
    dominant structure across all chromosomes and populations).
  pattern_table_row: |
    1000 Genomes | 3 | 161 (10 indiv + 10 sift + 10 merge + 70 mut_ovlp + 70 freq, default config) | n_to_1, 1_to_n | scatter_gather, pipeline


# ------------------------------------------------------------
# SECTION G: I/O BEHAVIORAL HINTS
# ------------------------------------------------------------

io_behavioral_hints:
  - hint_id: "hint:upfront_full_read_partial_use_individuals"
    description: |
      The individuals task reads the entire chromosome VCF file into memory upfront
      (readfile() → readlines()), loading ~2.4 GB per chromosome. However, each
      individuals job only processes a subset of rows [counter:stop] from the full
      250,000-line file. With ind_jobs=N, each job reads the full 2.4 GB input but
      uses only 1/N of the data — a factor-N amplification of input I/O. For example,
      with ind_jobs=10 (10 parallel jobs per chromosome), the same 2.4 GB file is
      read 10 times, each using only 25,000 lines. This is the largest I/O inefficiency
      in the workflow given that individuals is the dominant task (82% of wall time).
    affected_tasks:
      - "task:individuals"
    affected_data:
      - "data:vcf_chr"
    potential_concern: "partial_access"

  - hint_id: "hint:small_file_write_individuals"
    description: |
      Each individuals task instance writes one plain-text mutation file per individual
      (~2,504 files per job instance) to a temporary directory before archiving. Each
      file is very small (a few KB to tens of KB depending on mutation count). Creating
      2,504 files per job instance creates significant filesystem metadata overhead.
      With N individuals jobs per chromosome and 10 chromosomes, up to N×10×2,504
      files are created and immediately deleted within each job. This pattern is
      repeated in mutation_overlap and frequency tasks which extract these same ~2,504
      files from the tar archive before reading.
    affected_tasks:
      - "task:individuals"
      - "task:mutation_overlap"
      - "task:frequency"
    affected_data:
      - "data:individuals_chunk_tar"
      - "data:individuals_merged_tar"
    potential_concern: "small_file_overhead"

  - hint_id: "hint:repeated_extraction_merged_archive"
    description: |
      The chrXn.tar.gz merged archive is extracted independently by each of the 14
      analysis task instances (7 mutation_overlap + 7 frequency) per chromosome. Each
      extraction recreates the full ~2,504 per-individual mutation files on the local
      filesystem. This means the same archive is extracted 14 times per chromosome
      (140 total extractions across 10 chromosomes), with each extraction writing
      ~2,504 small files. Beyond the redundant I/O, each analysis task then reads only
      the subset of individual files belonging to its target population (e.g., GBR has
      ~106 individuals), discarding the majority of extracted files.
    affected_tasks:
      - "task:mutation_overlap"
      - "task:frequency"
    affected_data:
      - "data:individuals_merged_tar"
    potential_concern: "data_reuse"

  - hint_id: "hint:population_subset_extraction_waste"
    description: |
      mutation_overlap and frequency both call tarfile.extractall() on the merged
      individuals archive (chrXn.tar.gz), extracting all ~2,504 individual mutation
      files to a local directory. They then immediately filter to only the individuals
      belonging to the target population. For small populations (e.g., GBR ~106
      individuals), approximately 96% of extracted files are never read after extraction.
      This is a partial access concern: the archive is fully extracted but only a
      small fraction of the extracted content is used.
    affected_tasks:
      - "task:mutation_overlap"
      - "task:frequency"
    affected_data:
      - "data:individuals_merged_tar"
    potential_concern: "partial_access"

  - hint_id: "hint:frequency_small_file_write_burst"
    description: |
      The frequency task writes 1,000 separate output files per data category
      (n_runs=1000): histogram files, mutation overlap files, random individual
      lists, plus 1,000 PNG plots. This creates a burst of ~4,000–5,000 small file
      writes per frequency task instance. With 70 frequency instances (10 chromosomes
      × 7 populations), the total number of small output files across all frequency
      tasks is ~280,000–350,000. This is a severe metadata-overhead and small-file
      write pattern on shared parallel filesystems.
    affected_tasks:
      - "task:frequency"
    affected_data:
      - "data:frequency_results"
    potential_concern: "metadata_overhead"

  - hint_id: "hint:sifted_file_read_but_sift_unused_frequency"
    description: |
      The frequency task reads the sifted.SIFT.chrX.txt file and extracts rs numbers
      (read_rs_numbers method), but the SIFT=NO-SIFT setting indicates it intentionally
      disregards SIFT-based filtering. The frequency task uses the sifted file only to
      obtain a list of rs numbers for the mutation set intersection, but the SIFT score
      values themselves are unused. The architectural dependency on sifting for frequency
      tasks means frequency cannot begin until sifting completes, even though it only
      needs a subset of the sifted file's content (rs numbers only, not SIFT scores).
    affected_tasks:
      - "task:frequency"
      - "task:sifting"
    affected_data:
      - "data:sifted_sift_txt"
    potential_concern: "partial_access"

  - hint_id: "hint:individuals_merge_unnecessary_when_ind_jobs_one"
    description: |
      When running with the default configuration (ind_jobs=1, one individuals job
      per chromosome), the individuals_merge task is invoked with a single input
      archive. No actual merging occurs — the task extracts one archive, re-archives
      it, and performs cleanup. This serial individuals_merge task adds ~500s latency
      on the critical path without performing meaningful work when ind_jobs=1.
    affected_tasks:
      - "task:individuals_merge"
    affected_data:
      - "data:individuals_chunk_tar"
      - "data:individuals_merged_tar"
    potential_concern: "unnecessary_serialization"


