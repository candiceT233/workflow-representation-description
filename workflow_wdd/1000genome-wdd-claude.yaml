metadata:
  workflow_lineage_id: "f2a30e67-f3e5-446e-b307-117d111daeb5"
  version: "1.0.0"
  version_notes: "Initial WDD compiled from 1000genome-workflow daxgen.py via static analysis."
  deprecated: false

  workflow_name: "1000 Genomes"
  workflow_description: |
    Population genomics workflow that identifies mutational overlaps using Single Nucleotide
    Polymorphism (SNP) variant data from the 1000 Genomes Project Phase 3 release. Starting
    from per-chromosome VCF files covering 2,504 individuals across 26 global populations,
    the workflow extracts per-individual mutation sets, filters SNPs by SIFT (Sorting Intolerant
    From Tolerant) pathogenicity scores from VEP (Variant Effect Predictor) annotation, and
    computes pairwise mutation overlap distributions and allele frequency statistics by
    population. Final outputs are per-(chromosome, population) statistical summaries and
    visualization plots that provide a null distribution for evaluating disease-related mutations.

  source_repository: "https://github.com/pegasus-isi/1000genome-workflow"
  source_commit: null  # No git history in local copy; repository not a git repo
  source_format: "compiled_from_pegasus_dax"
  source_file: "daxgen.py"

  schema_version: "wdd-5.0"
  generated_by: "claude-sonnet-4-6"
  generated_at: "2026-02-23T00:00:00Z"
  last_modified_at: "2026-02-23T00:00:00Z"


# ------------------------------------------------------------
# SECTION A: STAGE CATALOG
# ------------------------------------------------------------

stages:
  - stage_id: "stage:data_extraction"
    name: "Data Extraction"
    order: 1
    description: |
      Parallel data extraction and preprocessing stage. The individuals task extracts
      per-individual SNP mutation sets from per-chromosome VCF files. Concurrently,
      the sifting task parses VEP annotation VCF files to derive per-chromosome SIFT
      score tables. Both task types are embarrassingly parallel over chromosomes and
      produce intermediate artifacts required by downstream analysis.
    tasks:
      - "task:individuals"
      - "task:sifting"

  - stage_id: "stage:merge"
    name: "Individuals Merge"
    order: 2
    description: |
      Aggregation stage that merges per-chunk per-individual mutation files produced
      by parallel individuals jobs into a single consolidated archive per chromosome.
      One individuals_merge job runs per chromosome and must wait for all corresponding
      individuals chunk jobs to complete before executing.
    tasks:
      - "task:individuals_merge"

  - stage_id: "stage:analysis"
    name: "Mutation Analysis"
    order: 3
    description: |
      Final analysis stage that performs two independent analyses per (chromosome,
      population) pair: mutation_overlap computes pairwise SNP overlap statistics
      incorporating SIFT filtering, and frequency computes allele frequency distributions
      across random individual samples. Both task types fan out over all 7 populations
      for each chromosome and produce final workflow outputs staged to persistent storage.
    tasks:
      - "task:mutation_overlap"
      - "task:frequency"


# ------------------------------------------------------------
# SECTION B: TASK CATALOG
# ------------------------------------------------------------

tasks:
  - task_id: "task:individuals"
    name: "Individuals"
    stage: "stage:data_extraction"
    executable: "bin/individuals.py"
    description: |
      Parses a per-chromosome VCF file from the 1000 Genomes Project Phase 3 release
      and extracts, for each of the 2,504 sequenced individuals, the set of SNP rs
      numbers where the individual carries a mutation on both alleles (homozygous
      alternate), filtered by allele frequency (AF). Processes a defined row range
      of the chromosome VCF to enable parallelism (chunked execution). Writes one
      plain-text mutation file per individual to a local directory, then archives
      the directory as a gzip-compressed tar archive for downstream consumption.
    behavioral_notes: |
      Reads the entire chromosome VCF file into memory upfront (readfile() loads all
      lines via readlines()). Only processes a subset of rows [counter:stop] from the
      full file — partial file usage despite full read. Creates ~2,504 small per-individual
      text files in a temporary directory before archiving (significant small-file I/O).
      All output is written at task completion (deferred write pattern): individual files
      then a single tar.gz archive, followed by cleanup of the temporary directory.
      No internal checkpointing; if the job fails, all intermediate individual files
      are lost. No parallelism within a single task instance.
    parallelism_model:
      type: "embarrassingly_parallel"
      description: |
        Each instance processes an independent row range of one chromosome's VCF file.
        Multiple instances can process different row ranges of the same chromosome
        (controlled by ind_jobs parameter) or different chromosomes in parallel.
        No inter-instance communication or shared state. Default configuration
        runs one instance per chromosome (10 chromosomes → 10 instances).
    io_dominance: "io_bound"
    output_class: "intermediate"
    inputs:
      - "data:vcf_chr"
      - "data:columns_txt"
    outputs:
      - "data:individuals_chunk_tar"

  - task_id: "task:individuals_merge"
    name: "Individuals Merge"
    stage: "stage:merge"
    executable: "bin/individuals_merge.py"
    description: |
      Merges N per-chunk gzip tar archives produced by parallel individuals jobs for
      a single chromosome into a single consolidated tar archive. For each individual
      (identified by filename), concatenates mutation records from all chunk archives.
      Produces one merged per-chromosome archive (chrXn.tar.gz) consumed by both
      mutation_overlap and frequency analysis tasks.
    behavioral_notes: |
      Iterates over all input tar archives sequentially. For each archive, uses a
      temporary directory to extract files before merging content into an in-memory
      dictionary keyed by individual filename. After all chunks are processed, writes
      the merged content files to disk and re-archives. Mixed I/O pattern: reads all
      inputs before writing output. When ind_jobs=1 (default), only one input archive
      exists so no actual merging occurs — the task archives a single extracted set.
      No checkpointing; serial single-process execution.
    parallelism_model:
      type: "serial"
      description: |
        One instance per chromosome. Executes serially — processes each input chunk
        archive one at a time. Cannot parallelize the merge within a single chromosome.
    io_dominance: "io_bound"
    output_class: "intermediate"
    inputs:
      - "data:individuals_chunk_tar"
    outputs:
      - "data:individuals_merged_tar"

  - task_id: "task:sifting"
    name: "Sifting"
    stage: "stage:data_extraction"
    executable: "bin/sifting.py"
    description: |
      Processes a per-chromosome VEP (Variant Effect Predictor) annotation VCF file
      to extract SNP variants that have a SIFT pathogenicity score. Filters for lines
      containing 'deleterious' or 'tolerated' classification and rs numbers, then
      parses SIFT score and associated gene identifiers (rs number, ENSEMBL gene ID,
      HGNC ID) into a compact tab-delimited output file used downstream to filter
      mutations to those with known functional impact.
    behavioral_notes: |
      Reads entire VEP VCF file into memory (readfile()). Uses subprocess.run with
      shell=True to invoke grep for filtering (deleterious/tolerated lines), writing
      to an intermediate scratch file (SIFT.chrX.vcf). Reads the scratch file back,
      applies a second regex filter for rs numbers, then writes the final output.
      The scratch file is deleted after use — it is a within-task transient and does
      not appear in the Pegasus workflow graph. Deferred write: all I/O completes
      before final output is written. Single-threaded; runs independently per chromosome.
    parallelism_model:
      type: "embarrassingly_parallel"
      description: |
        One instance per chromosome. All instances are fully independent — they read
        different input files, write different output files, and share no state.
        Runs concurrently with individuals jobs (same stage).
    io_dominance: "io_bound"
    output_class: "intermediate"
    inputs:
      - "data:vep_annotation_vcf"
    outputs:
      - "data:sifted_sift_txt"

  - task_id: "task:mutation_overlap"
    name: "Mutation Overlap"
    stage: "stage:analysis"
    executable: "bin/mutation_overlap.py"
    description: |
      Computes pairwise SNP mutation overlap statistics between individuals in a
      specified population for one chromosome. Reads the merged per-individual mutation
      archive, filters mutations to those with SIFT scores, and computes (1) all-pairs
      overlap matrix, (2) random-pairs overlap histogram, and (3) gene-pair co-occurrence
      counts. Produces numeric text output files and matplotlib PNG visualizations
      (colormap heatmap, histogram distributions), all packaged into a final tar archive.
    behavioral_notes: |
      Extracts the full chrXn.tar.gz archive to a local subdirectory at startup
      (tarfile.extractall), then opens each individual's mutation file separately.
      This creates ~2,504 small file reads per task instance. The all-pairs overlap
      computation (total_pair_individuals) is O(n^2) in the number of individuals and
      is the compute-dominant section. Reads sifted SIFT file sequentially once; reads
      population file once; reads columns.txt once. Writes several txt files and PNG
      plots to separate output/plots subdirectories, then archives everything. Upfront
      full extraction of all inputs before any compute.
    parallelism_model:
      type: "embarrassingly_parallel"
      description: |
        One instance per (chromosome, population) pair. With 10 chromosomes and 7
        populations, 70 instances run in parallel. Instances are fully independent
        — each processes a distinct (chromosome, population) combination.
    io_dominance: "balanced"
    output_class: "checkpoint"
    inputs:
      - "data:individuals_merged_tar"
      - "data:sifted_sift_txt"
      - "data:population_file"
      - "data:columns_txt"
    outputs:
      - "data:mutation_overlap_results"

  - task_id: "task:frequency"
    name: "Frequency"
    stage: "stage:analysis"
    executable: "bin/frequency.py"
    description: |
      Computes mutation frequency distributions across random subsets of individuals
      for one (chromosome, population) pair. Runs 1,000 random sampling runs each
      selecting 52 individuals from the population, computes mutation overlap histograms
      for each run, and produces numeric frequency files and matplotlib histogram PNG
      plots. Unlike mutation_overlap, this task does not incorporate SIFT filtering
      (SIFT=NO-SIFT), providing a null distribution over all SNPs regardless of
      predicted functional impact.
    behavioral_notes: |
      Reads data from the same sources as mutation_overlap: extracts full chrXn.tar.gz
      archive, reads sifted SIFT file (for rs numbers only), reads population file,
      reads columns.txt. Executes 1,000 random sampling runs (n_runs=1000) in a Python
      loop — compute-dominant inner loop but I/O-heavy setup. Writes n_runs=1000
      separate output files per data type (histogram, mutation overlap, random_indiv).
      This is a significant small-file write pattern: 1,000+ files per task instance.
      Upfront read, repeated compute, sequential write.
    parallelism_model:
      type: "embarrassingly_parallel"
      description: |
        One instance per (chromosome, population) pair, identical fan-out structure
        to mutation_overlap. 70 instances in the default 10-chromosome, 7-population
        configuration. No inter-instance communication.
    io_dominance: "balanced"
    output_class: "checkpoint"
    inputs:
      - "data:individuals_merged_tar"
      - "data:sifted_sift_txt"
      - "data:population_file"
      - "data:columns_txt"
    outputs:
      - "data:frequency_results"


