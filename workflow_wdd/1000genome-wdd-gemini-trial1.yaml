stages:
  - stage_id: stage:individuals_processing
    name: "Individuals Processing"
    order: 1
    description: "Processes individual chromosome data to extract SNP variants."
    tasks:
      - task:individuals
  - stage_id: stage:intermediate_processing
    name: "Intermediate Processing"
    order: 2
    description: "Merges individual processing outputs and computes SIFT scores for SNPs."
    tasks:
      - task:individuals_merge
      - task:sifting
  - stage_id: stage:final_analysis
    name: "Final Analysis"
    order: 3
    description: "Performs mutation overlap and frequency analyses across populations and chromosomes."
    tasks:
      - task:mutation_overlap
      - task:frequency

tasks:
  - task_id: task:individuals
    name: "Individuals"
    stage: stage:individuals_processing
    executable: "individuals.py"
    description: "Fetches and parses Phase3 data from the 1000 genomes project by chromosome. It processes VCF files, extracting SNP variants and creating output files for each individual with mutations on both alleles."
    behavioral_notes: "Processes VCF files in chunks based on `--individuals-jobs` parameter, producing intermediate tar.gz files per chunk. This indicates a chunked processing pattern rather than loading full datasets at once. Writes output incrementally per chunk."
    parallelism_model:
      type: embarrassingly_parallel
      description: "Each instance processes a distinct chunk of a chromosome's VCF data independently."
    io_dominance: io_bound
    io_access_type: python_serial
    restart_model: checkpoint_restart
    restart_checkpoint_dataset: data:individuals_output_tar_gz
    hardware_path:
      has_conditional_execution: false
      execution_alternatives: []
      minimum_resource_assertions: []
    output_class: intermediate
    inputs:
      - data:chromosome_vcf_input
      - data:columns_txt
    outputs:
      - data:individuals_output_tar_gz
  - task_id: task:individuals_merge
    name: "Individuals Merge"
    stage: stage:intermediate_processing
    executable: "individuals_merge.py"
    description: "Merges the intermediate output files from multiple 'individuals' tasks for a single chromosome into a single aggregated file."
    behavioral_notes: "Reads multiple intermediate tar.gz files and combines their contents into a single tar.gz file per chromosome."
    parallelism_model:
      type: n_to_1
      description: "Aggregates outputs from multiple parallel 'individuals' tasks for a single chromosome."
    io_dominance: io_bound
    io_access_type: python_serial
    restart_model: idempotent
    restart_checkpoint_dataset: null
    hardware_path:
      has_conditional_execution: false
      execution_alternatives: []
      minimum_resource_assertions: []
    output_class: intermediate
    inputs:
      - data:individuals_output_tar_gz
    outputs:
      - data:individuals_merged_tar_gz
  - task_id: task:sifting
    name: "Sifting"
    stage: stage:intermediate_processing
    executable: "sifting.py"
    description: "Computes SIFT scores of all SNP variants as computed by the Variant Effect Predictor (VEP). It processes a VEP annotation file, selects SNPs with SIFT scores, and records the score and SNP variant IDs."
    behavioral_notes: "Reads a VEP annotation VCF-like file, filters and processes it, then writes out a textual file with SIFT scores and SNP IDs."
    parallelism_model:
      type: embarrassingly_parallel
      description: "Each instance processes the SIFTing for a single chromosome independently."
    io_dominance: balanced
    io_access_type: python_serial
    restart_model: idempotent
    restart_checkpoint_dataset: null
    hardware_path:
      has_conditional_execution: false
      execution_alternatives: []
      minimum_resource_assertions: []
    output_class: intermediate
    inputs:
      - data:sifting_input_vcf
    outputs:
      - data:sifted_snps_txt
  - task_id: task:mutation_overlap
    name: "Mutation Overlap"
    stage: stage:final_analysis
    executable: "mutation_overlap.py"
    description: "Measures the overlap in mutations (SNP variants) among pairs of individuals, categorized by population and by chromosome. This task analyzes processed individual data and sifting results."
    behavioral_notes: "Reads merged individual data, sifting data, and population data to perform cross-matching and calculate mutation overlaps. Outputs a compressed file per chromosome and population."
    parallelism_model:
      type: embarrassingly_parallel
      description: "Each instance computes mutation overlap for a specific chromosome and population combination independently."
    io_dominance: balanced
    io_access_type: python_serial
    restart_model: idempotent
    restart_checkpoint_dataset: null
    hardware_path:
      has_conditional_execution: false
      execution_alternatives: []
      minimum_resource_assertions: []
    output_class: output
    inputs:
      - data:individuals_merged_tar_gz
      - data:sifted_snps_txt
      - data:population_files
      - data:columns_txt
    outputs:
      - data:mutation_overlap_output_tar_gz
  - task_id: task:frequency
    name: "Frequency"
    stage: stage:final_analysis
    executable: "frequency.py"
    description: "Measures the frequency of overlapping mutations by selecting a number of random individuals and all SNP variants, without considering SIFT scores. This analysis is performed per population and per chromosome."
    behavioral_notes: "Reads merged individual data, sifting data, and population data. Performs statistical analysis on SNP frequencies. Outputs a compressed file per chromosome and population."
    parallelism_model:
      type: embarrassingly_parallel
      description: "Each instance computes mutation frequency for a specific chromosome and population combination independently."
    io_dominance: balanced
    io_access_type: python_serial
    restart_model: idempotent
    restart_checkpoint_dataset: null
    hardware_path:
      has_conditional_execution: false
      execution_alternatives: []
      minimum_resource_assertions: []
    output_class: output
    inputs:
      - data:individuals_merged_tar_gz
      - data:sifted_snps_txt
      - data:population_files
      - data:columns_txt
    outputs:
      - data:frequency_output_tar_gz

