pc_edges:
  - edge_id: pc:individuals->individuals_merge:n_to_1
    producer: task:individuals
    consumer: task:individuals_merge
    data_objects:
      - data:individuals_output_tar_gz
    pc_pattern: n_to_1
    pc_pattern_rationale: "Multiple parallel 'individuals' tasks produce chunks for a single chromosome, which are then consumed and merged by a single 'individuals_merge' task for that chromosome."
    data_flow_description: "Compressed tar.gz files containing processed SNP data chunks flow from multiple 'individuals' tasks to a single 'individuals_merge' task."
    coupling: tight
    coupling_rationale: "The 'individuals_merge' task cannot begin until all 'individuals' tasks for a given chromosome have completed their processing and written their output files."
    communication_pattern: file_per_producer
    data_volume_class: large
  - edge_id: pc:sifting->mutation_overlap:1_to_1
    producer: task:sifting
    consumer: task:mutation_overlap
    data_objects:
      - data:sifted_snps_txt
    pc_pattern: 1_to_1
    pc_pattern_rationale: "A single 'sifting' task produces SIFT scores for one chromosome, which is then consumed by a 'mutation_overlap' task for the same chromosome (and a specific population)."
    data_flow_description: "Text file containing SIFT scores and SNP IDs flows from 'sifting' to 'mutation_overlap'."
    coupling: tight
    coupling_rationale: "'mutation_overlap' requires the complete sifted data before it can begin processing."
    communication_pattern: file_per_producer
    data_volume_class: medium
  - edge_id: pc:sifting->frequency:1_to_1
    producer: task:sifting
    consumer: task:frequency
    data_objects:
      - data:sifted_snps_txt
    pc_pattern: 1_to_1
    pc_pattern_rationale: "A single 'sifting' task produces SIFT scores for one chromosome, which is then consumed by a 'frequency' task for the same chromosome (and a specific population)."
    data_flow_description: "Text file containing SIFT scores and SNP IDs flows from 'sifting' to 'frequency'."
    coupling: tight
    coupling_rationale: "'frequency' requires the complete sifted data before it can begin processing."
    communication_pattern: file_per_producer
    data_volume_class: medium
  - edge_id: pc:individuals_merge->mutation_overlap:1_to_1
    producer: task:individuals_merge
    consumer: task:mutation_overlap
    data_objects:
      - data:individuals_merged_tar_gz
    pc_pattern: 1_to_1
    pc_pattern_rationale: "A single 'individuals_merge' task produces merged data for one chromosome, which is then consumed by a 'mutation_overlap' task for the same chromosome (and a specific population)."
    data_flow_description: "Compressed tar.gz file containing merged SNP data for a chromosome flows from 'individuals_merge' to 'mutation_overlap'."
    coupling: tight
    coupling_rationale: "'mutation_overlap' requires the complete merged individual data before it can begin processing."
    communication_pattern: file_per_producer
    data_volume_class: large
  - edge_id: pc:individuals_merge->frequency:1_to_1
    producer: task:individuals_merge
    consumer: task:frequency
    data_objects:
      - data:individuals_merged_tar_gz
    pc_pattern: 1_to_1
    pc_pattern_rationale: "A single 'individuals_merge' task produces merged data for one chromosome, which is then consumed by a 'frequency' task for the same chromosome (and a specific population)."
    data_flow_description: "Compressed tar.gz file containing merged SNP data for a chromosome flows from 'individuals_merge' to 'frequency'."
    coupling: tight
    coupling_rationale: "'frequency' requires the complete merged individual data before it can begin processing."
    communication_pattern: file_per_producer
    data_volume_class: large

