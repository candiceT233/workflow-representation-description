workflow_patterns:
  primary_pattern:
    _status: required_static
    _value: hybrid
  secondary_patterns:
    _status: required_static
    _value:
      - scatter_gather
      - iterative
  classification_rationale:
    _status: required_static
    _value: "The workflow exhibits a `scatter_gather` pattern in the 'individuals' and 'individuals_merge' tasks, where multiple individual processing tasks fan out and their results are gathered by a merge task per chromosome. It is `iterative` as it processes multiple chromosomes and populations independently. The overall structure combines these patterns, thus classified as `hybrid`."
  pattern_table_row:
    _status: required_static
    _value: "1000genome | 3 | Many (dynamic) | n_to_1, 1_to_1 | Iterative processing of chromosomes and populations, scatter-gather for initial data processing."

io_behavioral_hints:
  - hint_id: hint:individuals_chunked_io
    description: "The 'individuals' task processes large VCF files in chunks, writing intermediate tar.gz files. This reduces memory footprint but creates many small to medium-sized intermediate files which need to be merged later."
    affected_tasks:
      - task:individuals
    affected_data:
      - data:individuals_output_tar_gz
      - data:chromosome_vcf_input
    potential_concern: small_file_overhead
  - hint_id: hint:merged_file_reuse
    description: "The `individuals_merged_tar_gz` and `sifted_snps_txt` datasets are read by two downstream tasks (`mutation_overlap` and `frequency`). This represents data reuse, implying these files should be accessible by both consumers efficiently."
    affected_tasks:
      - task:mutation_overlap
      - task:frequency
    affected_data:
