workflow_patterns:
  primary_pattern: scatter_gather
  secondary_patterns:
    - broadcast
  classification_rationale: >
    Workflow exhibits scatter-gather pattern: individuals tasks scatter work across parallel chunks
    (N per chromosome), individuals_merge gathers chunks per chromosome (n_to_1 pattern).
    Additionally, merged data is broadcast to multiple population analysis tasks (1 chromosome -> 7 populations,
    1_to_n pattern). The sifting task output is also broadcast to multiple analysis tasks.
    Overall structure is linear stage progression with parallel task instances within stages.
  pattern_table_row: "1000genome | 3 | individuals (N*chroms), individuals_merge (1*chroms), sifting (1*chroms), analysis (2*pop*chroms) | n_to_1 (merge), 1_to_n (analysis per population) | broadcast of merged/sifted data to multiple populations, small intermediate files"

io_behavioral_hints:
  - hint_id: hint:small_file_overhead_individuals
    description: >
      The individuals task creates one output file per individual (2,504 files) before tarballing.
      This generates significant filesystem overhead from creating and managing thousands of small files.
      The subsequent merge task must extract and handle thousands of small individual files.
    affected_tasks:
      - task:individuals
      - task:individuals_merge
    affected_data:
      - data:individuals_chunk_output
    potential_concern: small_file_overhead

  - hint_id: hint:data_reuse_merged
    description: >
      Same merged individuals_merged_output file is read by both mutation_overlap and frequency
      tasks for each chromosome-population combination. Files are read twice with similar processing
      patterns, and by all population tasks for that chromosome.
    affected_tasks:
      - task:mutation_overlap
      - task:frequency
    affected_data:
      - data:individuals_merged_output
    potential_concern: data_reuse

  - hint_id: hint:data_reuse_sifted
    description: >
      Same sifted_output file is read by both mutation_overlap and frequency tasks for each
      chromosome-population combination. These are small files but read multiple times.
    affected_tasks:
      - task:mutation_overlap
      - task:frequency
    affected_data:
      - data:sifted_output
    potential_concern: data_reuse

execution_profiles:
  - profile_name: full
    terminal_task_id: task:frequency
    description: >
      Complete workflow execution including all chromosomes and populations. Produces all mutation
      overlap and frequency analysis results as final scientific outputs.
    required_task_set:
      - task:individuals
      - task:individuals_merge
      - task:sifting
      - task:mutation_overlap
      - task:frequency
    conditional_inclusions: []
    output_dataset_ids:
      - data:individuals_merged_output
      - data:sifted_output
      - data:mutation_overlap_output
      - data:frequency_output

