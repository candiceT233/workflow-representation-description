      reason: |
        output_class for MD simulation is ambiguous: DCD trajectories have scientific
        value (full molecular dynamics data) but are used as intermediate within the
        workflow. Requires scientist confirmation. Marked intermediate pending review.
    - field_path: "tasks[task:train_aae].inputs[data:ml_model_weights]"
      reason: |
        Warm-start from previous iteration's model weights is optional and
