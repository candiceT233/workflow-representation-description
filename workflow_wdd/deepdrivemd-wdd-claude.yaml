  - data_id: "data:initial_pdb_files"
    name: "Initial Protein Structure Files"
    description: |
      Directory of PDB files providing starting molecular configurations for MD
      simulations on the first iteration. Each PDB file specifies atomic coordinates
      for one protein system variant. Files are cycled across num_tasks MD tasks
      so that all parallel simulations in the first iteration have a starting
      structure.
    category: "input"
    persistence: "persistent"
    format_hint:
      container: "text"
      compression: "none"
      layout_hint: "contiguous"
      typical_request_size_kb: 100
    cardinality: |
      One or more PDB files in the initial_pdb_dir; exact count is
      workflow-configuration-dependent.
    estimated_size_hint: "<1 MB per PDB file (protein structures are small text files)"
    producer_task: null
    consumer_tasks:
      - "task:openmm"
    lifecycle:
      creation_phase: null
      last_consumer_phase: "task:openmm"
      retention_window: "external input; read on first iteration only; persistent"
      access_frequency_class: "few_times"
      consumer_count: 1
      size_measured_bytes: null
      size_measurement_run_id: null
      size_measurement_confidence: "unavailable"

  - data_id: "data:md_trajectory_h5"
    name: "Per-Simulation HDF5 Trajectory Features"
    description: |
      Per-simulation HDF5 file containing per-frame structural analysis data for
      one MD trajectory. Stores four datasets: point_cloud (3D CA-atom coordinates),
      contact_map (pairwise residue contact matrix), rmsd (root mean square deviation
      from reference structure), and fnc (fraction of native contacts). Consumed
      by the aggregation task and directly by the agent task for encoder inference.
    category: "intermediate"
    persistence: "workflow_scoped"
    format_hint:
      container: "HDF5"
      datasets:
        - dataset_name: "point_cloud"
          description: "3D coordinates of C-alpha atoms per simulation frame"
          dtype: "float32"
          shape_hint: "[N_frames, N_CA_atoms, 3]"
        - dataset_name: "contact_map"
          description: "Binary pairwise contact matrix between residues (contact if distance < threshold Angstroms)"
          dtype: "float32"
          shape_hint: "[N_frames, N_CA_atoms, N_CA_atoms]"
        - dataset_name: "rmsd"
          description: "Per-frame root mean square deviation from a reference structure"
          dtype: "float32"
          shape_hint: "[N_frames]"
        - dataset_name: "fnc"
          description: "Per-frame fraction of native contacts relative to reference"
          dtype: "float32"
          shape_hint: "[N_frames]"
      compression: "none"
      layout_hint: "chunked"
      typical_request_size_kb: null
    cardinality: |
      One file per MD simulation task per iteration.
      Total count = num_tasks × num_iterations (e.g., 12 tasks × 4 iterations = 48 files).
    estimated_size_hint: |
      ~50–500 MB per file depending on simulation length, frame reporting interval,
      number of CA atoms, and which datasets are enabled. For BBA (28 CA atoms,
      200 frames): point_cloud ~196 KB, contact_map ~6.3 MB, total ~tens of MB.
    producer_task: "task:openmm"
    consumer_tasks:
      - "task:aggregate"
      - "task:lof_agent"
    lifecycle:
      creation_phase: "task:openmm"
      last_consumer_phase: "task:lof_agent"
      retention_window: "from task:openmm completion to task:lof_agent completion (per iteration); older files retained for multi-iteration aggregation windows"
      access_frequency_class: "few_times"
      consumer_count: 2
      size_measured_bytes: null
      size_measurement_run_id: null
      size_measurement_confidence: "unavailable"

  - data_id: "data:md_trajectory_dcd"
    name: "Per-Simulation DCD Trajectory"
    description: |
      Binary DCD-format trajectory file containing the full set of atomic coordinates
      for every reported frame in one MD simulation. Used by the agent to extract
      specific outlier frames (by frame index) and write them as PDB starting
      structures for the next MD iteration. Contains all atoms (not just CA), enabling
      reconstruction of the full molecular geometry at any frame.
    category: "intermediate"
    persistence: "workflow_scoped"
    format_hint:
      container: "plain_binary"
      compression: "none"
      layout_hint: "contiguous"
      typical_request_size_kb: null
    cardinality: |
      One file per MD simulation task per iteration (same count as data:md_trajectory_h5).
    estimated_size_hint: |
      ~100 MB–several GB per file depending on system size, simulation length, and
      reporting interval. Stores all-atom coordinates per frame.
    producer_task: "task:openmm"
    consumer_tasks:
      - "task:lof_agent"
    lifecycle:
      creation_phase: "task:openmm"
      last_consumer_phase: "task:lof_agent"
      retention_window: "from task:openmm completion to task:lof_agent completion; paths referenced in outlier_json for use by next-iteration task:openmm"
      access_frequency_class: "once"
      consumer_count: 1
      size_measured_bytes: null
      size_measurement_run_id: null
      size_measurement_confidence: "unavailable"

  - data_id: "data:md_structure_pdb"
    name: "Per-Simulation Final-Frame PDB Structure"
    description: |
      PDB file containing the atomic coordinates of the final simulation frame for
      one MD task. Serves as structural reference metadata in the agent's outlier
      JSON records. The agent includes the PDB file path in each outlier record
      so that the next MD task can use it to identify the starting structure source.
    category: "intermediate"
    persistence: "workflow_scoped"
    format_hint:
      container: "text"
      compression: "none"
      layout_hint: "contiguous"
      typical_request_size_kb: 100
    cardinality: |
      One file per MD simulation task per iteration (same count as data:md_trajectory_h5).
    estimated_size_hint: "<1 MB per PDB file"
    producer_task: "task:openmm"
    consumer_tasks:
      - "task:lof_agent"
    lifecycle:
      creation_phase: "task:openmm"
      last_consumer_phase: "task:lof_agent"
      retention_window: "from task:openmm completion to task:lof_agent completion; path referenced by agent in outlier_json"
      access_frequency_class: "once"
      consumer_count: 1
      size_measured_bytes: null
      size_measurement_run_id: null
      size_measurement_confidence: "unavailable"

  - data_id: "data:aggregated_h5"
    name: "Aggregated HDF5 Training Dataset"
    description: |
      Single HDF5 file produced by concatenating the last N per-simulation HDF5
      files. Contains point_cloud, contact_map, rmsd, and fnc datasets with
      center-of-mass normalization applied to point clouds. Serves as the primary
      training dataset for the ML model. Frames with NaN values are filtered out
      during aggregation.
    category: "intermediate"
    persistence: "stage_scoped"
    format_hint:
      container: "HDF5"
      datasets:
        - dataset_name: "point_cloud"
          description: "Concatenated, center-of-mass-normalized 3D CA-atom coordinates from all aggregated simulation frames"
          dtype: "float32"
          shape_hint: "[N_total_frames, N_CA_atoms, 3]"
        - dataset_name: "contact_map"
          description: "Concatenated pairwise residue contact matrices"
          dtype: "float32"
          shape_hint: "[N_total_frames, N_CA_atoms, N_CA_atoms]"
        - dataset_name: "rmsd"
          description: "Concatenated per-frame RMSD time series"
          dtype: "float32"
          shape_hint: "[N_total_frames]"
        - dataset_name: "fnc"
          description: "Concatenated per-frame fraction of native contacts time series"
          dtype: "float32"
          shape_hint: "[N_total_frames]"
      compression: "none"
      layout_hint: "chunked"
      typical_request_size_kb: null
    cardinality: "One file per iteration (one per aggregation stage invocation)."
    estimated_size_hint: |
      Sum of last_n_h5_files source files after NaN filtering.
      E.g., 12 files × ~50 MB = ~600 MB; grows with iteration count and
      system size.
    producer_task: "task:aggregate"
    consumer_tasks:
      - "task:train_aae"
    lifecycle:
      creation_phase: "task:aggregate"
      last_consumer_phase: "task:train_aae"
      retention_window: "from task:aggregate completion to task:train_aae completion"
      access_frequency_class: "once"
      consumer_count: 1
      size_measured_bytes: null
      size_measurement_run_id: null
      size_measurement_confidence: "unavailable"

  - data_id: "data:ml_model_weights"
    name: "Trained ML Model Weight Files"
    description: |
      PyTorch state dict files (encoder-weights.pt, generator-weights.pt,
      discriminator-weights.pt) produced by the AAE training task, encoding
      the learned latent representation of protein conformational space. Also
      includes per-epoch checkpoint snapshots in the checkpoint/ subdirectory,
      loss history (loss.json), model hyperparameter JSON, and optimizer state JSON.
      Consumed by model selection to identify the latest checkpoint, by the agent
      for encoder inference, and optionally by the next iteration's training as
      warm-start initialization.
    category: "checkpoint"
    persistence: "persistent"
    format_hint:
      container: "plain_binary"
      datasets:
        - dataset_name: "encoder-weights.pt"
          description: "PyTorch state dict for the AAE encoder (maps point cloud → latent vector)"
          dtype: "float32"
          shape_hint: "variable — depends on encoder_filters and latent_dim"
        - dataset_name: "generator-weights.pt"
          description: "PyTorch state dict for the AAE generator/decoder (maps latent vector → point cloud)"
          dtype: "float32"
          shape_hint: "variable"
        - dataset_name: "discriminator-weights.pt"
          description: "PyTorch state dict for the AAE discriminator (real vs. generated latent codes)"
          dtype: "float32"
          shape_hint: "variable"
      compression: "none"
      layout_hint: "contiguous"
      typical_request_size_kb: null
    cardinality: |
      One set of weight files (encoder + generator + discriminator) per training
      invocation, plus one checkpoint set per training epoch. Typical: 3 final files
      + (num_epochs × 3) checkpoint files per training iteration.
    estimated_size_hint: |
      Tens to hundreds of MB per weight file set depending on model size (latent_dim,
      encoder_filters). E.g., AAE3d with latent_dim=64 ~50–200 MB total.
    producer_task: "task:train_aae"
    consumer_tasks:
      - "task:select_model"
      - "task:lof_agent"
      - "task:train_aae"
    lifecycle:
      creation_phase: "task:train_aae"
      last_consumer_phase: "task:train_aae"
      retention_window: "from task:train_aae completion; persistent across iterations for warm-start and repeated inference"
      access_frequency_class: "repeatedly"
      consumer_count: 3
      size_measured_bytes: null
      size_measurement_run_id: null
      size_measurement_confidence: "unavailable"

  - data_id: "data:model_selection_json"
    name: "Model Selection Metadata JSON"
    description: |
      JSON file produced by the model selection task that records the absolute
      filesystem paths to the selected encoder weight file (encoder-weights.pt)
      and the model configuration YAML for the current iteration. Consumed by
      the agent to locate the correct model for inference, and by the training
      task in the next iteration as optional warm-start initialization reference.
    category: "intermediate"
    persistence: "stage_scoped"
    format_hint:
      container: "JSON"
      compression: "none"
      layout_hint: "contiguous"
      typical_request_size_kb: 1
    cardinality: "One file per iteration (one per model_selection stage invocation)."
    estimated_size_hint: "<1 KB (contains only two file path strings)"
    producer_task: "task:select_model"
    consumer_tasks:
      - "task:lof_agent"
      - "task:train_aae"
    lifecycle:
      creation_phase: "task:select_model"
      last_consumer_phase: "task:train_aae"
      retention_window: "from task:select_model completion to task:train_aae completion in next iteration (cross-iteration warm-start)"
      access_frequency_class: "few_times"
      consumer_count: 2
      size_measured_bytes: null
      size_measurement_run_id: null
      size_measurement_confidence: "unavailable"

  - data_id: "data:outlier_json"
    name: "Outlier Conformation Metadata JSON"
    description: |
      JSON array produced by the LOF agent task that lists the num_extrinsic_outliers
      most structurally novel simulation frames. Each record contains the absolute
      path to the source DCD trajectory file, absolute path to the source PDB structure
      file, the frame index within the trajectory, a global outlier index (file_idx ×
      n_frames + frame), the intrinsic LOF score, and the extrinsic RMSD score.
      Consumed by the next iteration's MD simulation tasks to extract restart
      configurations from the specified trajectory frames.
    category: "intermediate"
    persistence: "workflow_scoped"
    format_hint:
      container: "JSON"
      compression: "none"
      layout_hint: "contiguous"
      typical_request_size_kb: 10
    cardinality: |
      One file per iteration (one per agent stage invocation). Each file contains
      num_extrinsic_outliers records (default 100 or equal to num_tasks).
    estimated_size_hint: "<10 KB per file (one JSON record per outlier, with file paths and numeric scores)"
    producer_task: "task:lof_agent"
    consumer_tasks:
      - "task:openmm"
    lifecycle:
      creation_phase: "task:lof_agent"
      last_consumer_phase: "task:openmm"
      retention_window: "from task:lof_agent completion (iteration N) to task:openmm completion (iteration N+1)"
      access_frequency_class: "once"
      consumer_count: 1
      size_measured_bytes: null
      size_measurement_run_id: null
      size_measurement_confidence: "unavailable"


# ------------------------------------------------------------
# SECTION D: PRODUCER–CONSUMER EDGES
# ------------------------------------------------------------

pc_edges:
  - edge_id: "pc:openmm->aggregate:n_to_1"
    producer: "task:openmm"
    consumer: "task:aggregate"
    data_objects:
      - "data:md_trajectory_h5"
    pc_pattern: "n_to_1"
    pc_pattern_rationale: |
      All num_tasks parallel OpenMM simulation tasks (typically 12) each produce one
      HDF5 file, all of which are consumed by the single serial aggregation task.
      This is a classic fan-in: N producers → 1 consumer.
    data_flow_description: |
      Aggregate reads all four HDF5 datasets (point_cloud, contact_map, rmsd, fnc)
      from each of the last_n_h5_files simulation HDF5 files sequentially. Loads
      entire datasets into memory via h5py, concatenates in Python, and writes the
      result as a single aggregated HDF5 file.
    coupling: "tight"
    coupling_rationale: |
      Aggregate cannot begin until all simulation tasks have completed and written
      their HDF5 output files. No streaming or partial aggregation is possible
      because the concatenation requires the full arrays from all source files.
    communication_pattern: "file_per_producer"
    data_volume_class: "medium"
    co_scheduling_hint: "beneficial"

  - edge_id: "pc:openmm->lof_agent:n_to_1"
    producer: "task:openmm"
    consumer: "task:lof_agent"
    data_objects:
      - "data:md_trajectory_h5"
      - "data:md_trajectory_dcd"
      - "data:md_structure_pdb"
    pc_pattern: "n_to_1"
    pc_pattern_rationale: |
      Multiple parallel OpenMM tasks each produce HDF5, DCD, and PDB files, all of
      which are consumed by the single LOF agent task. The agent creates a virtual
      HDF5 over the last N MD HDF5 files for inference, and uses DCD + PDB file
      paths to generate outlier metadata records.
    data_flow_description: |
      Agent creates a virtual HDF5 file referencing the point_cloud dataset from
      the last N MD HDF5 files (read lazily during inference mini-batches). DCD and
      PDB files are referenced by path in the outlier JSON output but not fully
      opened by the agent; only the paths are recorded. Agent reads point_cloud
      exclusively from HDF5 for encoding; contact_map, rmsd, fnc datasets in HDF5
      may or may not be accessed depending on extrinsic_score configuration.
    coupling: "tight"
    coupling_rationale: |
      Agent cannot begin until all MD tasks have written their HDF5 files (needed
      for inference) and the model selection task has completed (needed for model
      weights). Full MD completion is required before virtual HDF5 construction.
    communication_pattern: "file_per_producer"
    data_volume_class: "medium"
    co_scheduling_hint: "beneficial"

  - edge_id: "pc:aggregate->train_aae:1_to_1"
    producer: "task:aggregate"
    consumer: "task:train_aae"
    data_objects:
      - "data:aggregated_h5"
    pc_pattern: "1_to_1"
    pc_pattern_rationale: |
      One aggregation task produces one aggregated HDF5 file, consumed by one ML
      training task. Single producer, single consumer within the same iteration.
    data_flow_description: |
      Training task uses h5py.VirtualLayout to create a virtual HDF5 metadata file
      referencing the aggregated HDF5 (or directly the last N source MD H5 files).
      Mini-batches are read lazily by the PyTorch DataLoader via h5py; training
      never loads the full dataset into RAM simultaneously. Distributed training
      shards the dataset index range across MPI ranks, each rank reading its assigned
      mini-batches independently.
    coupling: "tight"
    coupling_rationale: |
      Training cannot begin until aggregation has completed and written the full
      aggregated HDF5 file. No streaming from aggregation to training is possible
      given the random-access mini-batch sampling pattern used by the DataLoader.
    communication_pattern: "shared_file"
    data_volume_class: "medium"
    co_scheduling_hint: "beneficial"

  - edge_id: "pc:train_aae->select_model:1_to_1"
    producer: "task:train_aae"
    consumer: "task:select_model"
    data_objects:
      - "data:ml_model_weights"
    pc_pattern: "1_to_1"
    pc_pattern_rationale: |
      One training task produces model weight files, which are scanned by one model
      selection task. Single producer, single consumer.
    data_flow_description: |
      Model selection performs a directory listing of the checkpoint/ subdirectory
      to find the checkpoint file with the highest epoch number (using the configured
      checkpoint_suffix). Only the file paths and file metadata (modification time or
      name-encoded epoch number) are read; weight tensors are not loaded at this stage.
    coupling: "tight"
    coupling_rationale: |
      Model selection must wait for training to complete and write at least one
      checkpoint before it can identify the latest model. Partial training output
      (in-progress checkpoints) cannot be used.
    communication_pattern: "shared_file"
    data_volume_class: "small"
    co_scheduling_hint: "neutral"

  - edge_id: "pc:select_model->lof_agent:1_to_1"
    producer: "task:select_model"
    consumer: "task:lof_agent"
    data_objects:
      - "data:model_selection_json"
    pc_pattern: "1_to_1"
    pc_pattern_rationale: |
      One model selection task writes one JSON metadata file, consumed by one LOF
      agent task in the same iteration.
    data_flow_description: |
      Agent reads the model_selection JSON to obtain the absolute path to the
      encoder weight file and model config. It then loads the encoder weights into
      GPU memory for inference. The JSON itself is tiny (<1 KB); the bulk data
      (weight tensors) is read from the path specified in the JSON.
    coupling: "tight"
    coupling_rationale: |
      Agent must know which model weights to load before inference can begin.
      Model selection must complete before agent starts.
    communication_pattern: "shared_file"
    data_volume_class: "small"
    co_scheduling_hint: "neutral"

  - edge_id: "pc:select_model->train_aae:1_to_1"
    producer: "task:select_model"
    consumer: "task:train_aae"
    data_objects:
      - "data:model_selection_json"
      - "data:ml_model_weights"
    pc_pattern: "1_to_1"
    pc_pattern_rationale: |
      [ASSUMPTION] The model selection task from iteration N writes a JSON pointing
      to selected weights; the training task in iteration N+1 may optionally read
      these weights as warm-start initialization. This is a cross-iteration 1_to_1
      edge (one model selection output consumed by one training task in the next
      iteration). Warm-start behavior depends on workflow configuration and is not
      always enabled.
    data_flow_description: |
      [ASSUMPTION] Training task reads the model_selection JSON from the previous
      iteration to locate encoder weights for initialization. If warm-start is
      configured, the encoder model is pre-loaded with prior weights before the
      first training epoch. This reduces the number of epochs needed to reach
      convergence in subsequent iterations.
    coupling: "loose"
    coupling_rationale: |
      [ASSUMPTION] Training can proceed without warm-start (using random weight
      initialization), so this is a soft dependency. The edge exists only when
      warm-start is configured and a previous model exists.
    communication_pattern: "shared_file"
    data_volume_class: "small"
    co_scheduling_hint: "neutral"

  - edge_id: "pc:lof_agent->openmm:1_to_n"
    producer: "task:lof_agent"
    consumer: "task:openmm"
    data_objects:
      - "data:outlier_json"
    pc_pattern: "1_to_n"
    pc_pattern_rationale: |
      The single LOF agent task produces one outlier JSON file containing
      num_extrinsic_outliers records, which are distributed across num_tasks parallel
      MD simulation tasks in the next iteration. Each MD task reads one record from
      the JSON to identify its restart trajectory and frame. One producer, N consumers.
    data_flow_description: |
      Each MD task reads the outlier JSON, selects one outlier record (indexed by
      task index modulo total outliers), extracts the specified frame from the DCD
      trajectory using MDAnalysis, writes a new PDB file from that frame, and uses
      it as the starting structure for the simulation. Only one JSON record is used
      per MD task; the JSON file is read in full by each task but only one record
      is acted upon.
    coupling: "tight"
    coupling_rationale: |
      MD simulations in the next iteration cannot begin until the agent has
      identified outlier frames and written the JSON. The feedback loop is
      synchronous: each iteration fully completes before the next begins.
    communication_pattern: "shared_file"
    data_volume_class: "small"
    co_scheduling_hint: "neutral"


# ------------------------------------------------------------
# SECTION E: WORKFLOW GRAPH
# ------------------------------------------------------------

workflow_graph:
  integrity_hash: "8699be2988be64cd731aed84c9c311bf31ba7ab188159fbe93ba4536a52889bb"
  last_generated: "2026-02-23T00:00:00Z"

  dag_edges:
    - from: "task:openmm"
      to: "task:aggregate"
      via: "pc:openmm->aggregate:n_to_1"
    - from: "task:openmm"
      to: "task:lof_agent"
      via: "pc:openmm->lof_agent:n_to_1"
    - from: "task:aggregate"
      to: "task:train_aae"
      via: "pc:aggregate->train_aae:1_to_1"
    - from: "task:train_aae"
      to: "task:select_model"
      via: "pc:train_aae->select_model:1_to_1"
    - from: "task:select_model"
      to: "task:lof_agent"
      via: "pc:select_model->lof_agent:1_to_1"
    - from: "task:select_model"
      to: "task:train_aae"
      via: "pc:select_model->train_aae:1_to_1"
    - from: "task:lof_agent"
      to: "task:openmm"
      via: "pc:lof_agent->openmm:1_to_n"

  loop_groups:
    - loop_id: "ddmd_outer_iteration_loop"
      tasks:
        - "task:openmm"
        - "task:aggregate"
        - "task:train_aae"
        - "task:select_model"
        - "task:lof_agent"
      loop_type: "data_driven"
      note: |
        All five stages repeat for max_iteration iterations. The agent's outlier
        JSON from iteration N parameterizes the MD restart structures for iteration
        N+1, closing the active-learning feedback loop. Iteration count is fixed at
        submission time (max_iteration config field); no runtime convergence criterion.
    - loop_id: "training_epoch_loop"
      tasks:
        - "task:train_aae"
      loop_type: "static"
      note: |
        Within a single training invocation, the model is trained for a configurable
        number of epochs (initial_epochs on first iteration, epochs on subsequent
        iterations). Epoch count is fixed at submission time.

  critical_path_hint: |
    Within each iteration: task:openmm (longest) → task:aggregate → task:train_aae
    → task:select_model → task:lof_agent. The MD simulation stage is typically the
    longest stage. task:aggregate is the serial bottleneck after N parallel MD tasks.
    task:train_aae duration scales with dataset size and epochs. Across iterations,
    the critical path repeats: total_time ≈ max_iteration × (t_openmm + t_aggregate
    + t_train + t_select + t_agent). The warm-start cross-iteration edge
    (select_model → train_aae) is on the critical path if warm-start is enabled and
    model weights are large.

  control_flow:
    has_iteration: true
    iteration_description: |
      The outer loop repeats all five stages for max_iteration iterations (fixed count
      set at submission time in experiment_config). The agent's outlier JSON from
      iteration N is consumed by MD tasks in iteration N+1 to select new simulation
      starting frames — a data-driven feedback loop. Within each iteration, a
      conditional controls whether ML training runs: training is executed only when
      stage_idx % retrain_freq == 0; otherwise model_selection reads the previous
      iteration's model_selection JSON (using the prior model). Iteration count is
      fully known at submission time; there is no runtime convergence criterion or
      early-stopping mechanism in the code.
    has_conditional_branches: true
    conditional_description: |
      Two conditional branches exist:
      (1) Training skip: if stage_idx % retrain_freq != 0, the ML training stage
      is skipped and model_selection retrieves the previous iteration's model
      selection JSON instead of scanning for new checkpoints. The training task
      is absent from that iteration's execution.
      (2) Aggregation skip: if skip_aggregation=True in the experiment config, the
      aggregation stage is bypassed entirely and the ML training task generates its
      own virtual HDF5 from the last N MD HDF5 files directly. This affects the
      data path for data:aggregated_h5 (which is not produced in this case).

  stage_execution_order:
    - "stage:simulation"
    - "stage:aggregation"
    - "stage:training"
    - "stage:model_selection"
    - "stage:agent"

  cross_reference:
    task_to_stage:
      "task:openmm": "stage:simulation"
      "task:aggregate": "stage:aggregation"
      "task:train_aae": "stage:training"
      "task:select_model": "stage:model_selection"
      "task:lof_agent": "stage:agent"
    data_to_producer:
      "data:experiment_config": null
      "data:initial_pdb_files": null
      "data:md_trajectory_h5": "task:openmm"
      "data:md_trajectory_dcd": "task:openmm"
      "data:md_structure_pdb": "task:openmm"
      "data:aggregated_h5": "task:aggregate"
      "data:ml_model_weights": "task:train_aae"
      "data:model_selection_json": "task:select_model"
      "data:outlier_json": "task:lof_agent"
    data_to_consumers:
      "data:experiment_config":
        - "task:openmm"
      "data:initial_pdb_files":
        - "task:openmm"
      "data:md_trajectory_h5":
        - "task:aggregate"
        - "task:lof_agent"
      "data:md_trajectory_dcd":
        - "task:lof_agent"
      "data:md_structure_pdb":
        - "task:lof_agent"
      "data:aggregated_h5":
        - "task:train_aae"
      "data:ml_model_weights":
        - "task:select_model"
        - "task:lof_agent"
        - "task:train_aae"
      "data:model_selection_json":
        - "task:lof_agent"
        - "task:train_aae"
      "data:outlier_json":
        - "task:openmm"


# ------------------------------------------------------------
# SECTION F: WORKFLOW-LEVEL PATTERN CLASSIFICATION
# ------------------------------------------------------------

workflow_patterns:
  primary_pattern: "hybrid"
  secondary_patterns:
    - "iterative"
    - "scatter_gather"
    - "checkpointing"
    - "conditional"
  classification_rationale: |
    DeepDriveMD is a hybrid workflow with four simultaneous pattern components:

    1. Iterative (primary character): All five stages repeat for max_iteration
       cycles, with the agent's outlier JSON steering the next MD iteration.
       The feedback from stage:agent to stage:simulation is the defining data-driven
       loop that makes this an active learning workflow. Iteration count is fixed
       at submission time.

    2. Scatter-Gather within each iteration: Stage:simulation fans out to num_tasks
       embarrassingly parallel MD tasks (scatter: 1_to_n from outlier_json), and
       their outputs are gathered by the serial aggregation task (gather: n_to_1
       into aggregated_h5). The same MD outputs are also gathered by the agent
       (n_to_1 from md_trajectory_h5).

    3. Checkpointing: The ML training task writes per-epoch checkpoint files and
       final model weight files that persist across iterations. These checkpoints
       enable warm-start in subsequent iterations and represent the scientifically
       valuable model of the conformational landscape.

    4. Conditional: Training is conditionally skipped when stage_idx % retrain_freq
       != 0. Aggregation can be conditionally bypassed via skip_aggregation flag.
       These conditional branches affect which tasks execute within an iteration.

    The combination of iterative feedback, scatter-gather parallelism within each
    iteration, persistent checkpointing of the ML model, and conditional stage
    execution qualifies this as a hybrid workflow.
  pattern_table_row: |
    DeepDriveMD | 5 | num_tasks (MD, parallel) + 4 (serial) per iteration | n_to_1 (MD→agg, MD→agent), 1_to_1 (agg→train, train→select, select→agent), 1_to_n (agent→MD) | Iterative, Scatter-Gather, Checkpointing, Conditional


# ------------------------------------------------------------
# SECTION G: I/O BEHAVIORAL HINTS
# ------------------------------------------------------------

io_behavioral_hints:
  - hint_id: "hint:dual_read_md_h5"
    description: |
      The per-simulation MD HDF5 files (data:md_trajectory_h5) are read twice per
      iteration: once by task:aggregate (for training data preparation) and once by
      task:lof_agent (for encoder inference). Both reads occur in the same iteration
      but at different stages. This represents data reuse of the same physical files
      by two distinct consumers without any caching coordination between them.
      If the files are on a high-latency filesystem, the two sequential opens of
      the same files may amplify metadata overhead.
    affected_tasks:
      - "task:aggregate"
      - "task:lof_agent"
    affected_data:
      - "data:md_trajectory_h5"
    potential_concern: "data_reuse"

  - hint_id: "hint:unnecessary_serialization_aggregate"
    description: |
      The task:aggregate stage reads all N MD HDF5 files, concatenates their datasets
      into a single aggregated HDF5, and writes it to disk — only to have task:train_aae
      immediately read it back. Both tasks could instead use h5py.VirtualLayout directly
      over the N source MD HDF5 files (the same mechanism the agent already uses
      independently), eliminating the aggregation write+read cycle. The training task
      already has VirtualLayout infrastructure (virtual-h5-metadata.json). The agent
      and training tasks independently create separate virtual HDF5 views of the same
      underlying MD H5 files, suggesting the aggregation step is redundant when
      virtual-HDF5 is available.
    affected_tasks:
      - "task:aggregate"
      - "task:train_aae"
    affected_data:
      - "data:aggregated_h5"
      - "data:md_trajectory_h5"
    potential_concern: "unnecessary_serialization"

  - hint_id: "hint:partial_access_contact_map"
    description: |
      The contact_map dataset is written by task:openmm into data:md_trajectory_h5
      and included by task:aggregate in data:aggregated_h5. However, task:train_aae
      (AAE3d model) trains exclusively on point_cloud data; task:lof_agent uses only
      point_cloud for encoder inference. The contact_map dataset appears to be unused
      by the downstream ML pipeline in the AAE3d training path. This means the
      contact_map data is written, aggregated, and stored but never consumed —
      representing partial file access waste across the n_to_1 and 1_to_1 edges.
      (The Keras CVAE model uses contact_map instead of point_cloud; this concern
      applies specifically to the AAE3d configuration.)
    affected_tasks:
      - "task:openmm"
      - "task:aggregate"
      - "task:train_aae"
      - "task:lof_agent"
    affected_data:
      - "data:md_trajectory_h5"
      - "data:aggregated_h5"
    potential_concern: "partial_access"

  - hint_id: "hint:per_frame_chunking_small_requests"
    description: |
      Per-simulation HDF5 files (data:md_trajectory_h5) are written with per-frame
      chunking (chunk shape [1, N_atoms, ...]). The aggregation task reads all frames
      from each file sequentially (full dataset load), while training reads mini-batches
      via random index sampling. Per-frame chunking (chunk shape = [1, ...]) is
      optimized for sequential single-frame access but causes many small I/O requests
      (one chunk per frame) during aggregation's sequential full-dataset read and during
      training's random-access mini-batch sampling. A larger chunk size (e.g.,
      [32, N_atoms, ...] to match batch_size) would reduce metadata overhead for
      both consumers.
    affected_tasks:
      - "task:aggregate"
      - "task:train_aae"
      - "task:lof_agent"
    affected_data:
      - "data:md_trajectory_h5"
      - "data:aggregated_h5"
    potential_concern: "format_mismatch"

  - hint_id: "hint:epoch_checkpoint_accumulation"
    description: |
      The ML training task writes a checkpoint file for every training epoch
      (e.g., checkpoint/epoch-1-*.pt, checkpoint/epoch-2-*.pt ...), but only the
      latest checkpoint is consumed by task:select_model and ultimately by
      task:lof_agent. Earlier-epoch checkpoints accumulate on disk across iterations
      and are never read again in the normal execution path. With 10 epochs per
      training invocation and multiple iterations, checkpoint file count grows as
      num_iterations × epochs × 3 (encoder + generator + discriminator), constituting
      checkpoint write waste proportional to epoch count minus one.
    affected_tasks:
      - "task:train_aae"
      - "task:select_model"
    affected_data:
      - "data:ml_model_weights"
    potential_concern: "checkpoint_waste"

  - hint_id: "hint:many_md_h5_files_metadata_overhead"
    description: |
      Each iteration produces num_tasks individual HDF5 files (e.g., 12 files per
      iteration). Over max_iteration iterations (e.g., 4), the total file count
      reaches 48+ individual HDF5 files, each opened independently by both
      task:aggregate (sequentially) and task:lof_agent (virtual layout). POSIX
      metadata operations (open, stat, close) per file may become a bottleneck on
      shared parallel filesystems (Lustre, GPFS) that have high metadata latency.
      Consolidating MD outputs into fewer, larger files per iteration (e.g., one
      shared HDF5 per iteration with datasets per task) would reduce metadata
      overhead.
    affected_tasks:
      - "task:aggregate"
      - "task:lof_agent"
    affected_data:
      - "data:md_trajectory_h5"
    potential_concern: "metadata_overhead"

  - hint_id: "hint:outlier_json_full_read_partial_use"
    description: |
      The outlier JSON file (data:outlier_json) contains num_extrinsic_outliers
      records (typically 100), but each individual MD task reads the full JSON file
      and uses only one record (indexed by task_idx modulo total outliers). With
      num_tasks MD tasks all reading the same small JSON file at iteration start,
      there is N-way redundant deserialization of the same data. The concern is minor
      due to the small file size (<10 KB), but represents a 1_to_n fan-out with
      full-file reads and partial (single-record) use per consumer.
    affected_tasks:
      - "task:openmm"
    affected_data:
      - "data:outlier_json"
    potential_concern: "partial_access"


# ------------------------------------------------------------
# SECTION H: EXECUTION PROFILES
# ------------------------------------------------------------

execution_profiles:
  - profile_name: "full"
    terminal_task_id: "task:lof_agent"
    description: |
      Complete iterative DeepDriveMD workflow executing all max_iteration cycles of
      the active-learning loop (MD → aggregation → training → model_selection →
      agent). Produces trained ML model weights (encoder, generator, discriminator)
      and outlier conformation JSON for each iteration. The trained model weights
      from the final iteration represent the learned conformational landscape
      of the protein system.
    required_task_set:
      - "task:openmm"
      - "task:aggregate"
      - "task:train_aae"
      - "task:select_model"
      - "task:lof_agent"
    output_dataset_ids:
      - "data:ml_model_weights"

  - profile_name: "single_iteration"
    terminal_task_id: "task:lof_agent"
    description: |
      One complete cycle of the DDMD loop: one MD simulation batch, one aggregation,
      one model training, one model selection, and one outlier detection pass.
      Useful for validating the workflow pipeline and data flow before running the
      full iterative loop. Produces one set of trained ML model weights and one
      outlier JSON for the first iteration.
    required_task_set:
      - "task:openmm"
      - "task:aggregate"
      - "task:train_aae"
      - "task:select_model"
      - "task:lof_agent"
    output_dataset_ids:
      - "data:ml_model_weights"


