metadata:
  workflow_lineage_id: "d4a8c2f1-7b3e-4d9a-b6c5-e2f1a3d7b8c9"
  version: "1.0.0"
  version_notes: "Initial WDD compiled from DeepDriveMD-pipeline codebase via static analysis."
  deprecated: false

  workflow_name: "DeepDriveMD"
  workflow_description: |
    Deep learning-driven molecular dynamics (DDMD) workflow that couples iterative
    MD simulations with an adversarial autoencoder (AAE) to explore protein
    conformational space. Starting from initial protein structures (PDB files), the
    workflow alternates between generating simulation trajectories (OpenMM), aggregating
    structural data (HDF5), training a latent-space ML model (AAE3d or Keras CVAE),
    selecting outlier conformations via Local Outlier Factor detection, and steering the
    next round of simulations toward biologically novel regions of conformational space.

  source_repository: "https://github.com/DeepDriveMD/DeepDriveMD-pipeline"
  source_commit: "96b5c6ee75211aa2c9ff728768af4f61a84c83d8"
  source_format: "native"
  source_file: "deepdrivemd/deepdrivemd.py"
  schema_version: "wdd-5.0"
  generated_by: "claude-sonnet-4-6"
  generated_at: "2026-02-23T00:00:00Z"
  last_modified_at: "2026-02-23T00:00:00Z"


# ------------------------------------------------------------
# SECTION A: STAGE CATALOG
# ------------------------------------------------------------

stages:
  - stage_id: "stage:simulation"
    name: "Molecular Dynamics Simulation"
    order: 1
    description: |
      Runs one or more independent OpenMM molecular dynamics simulations in parallel.
      Each task generates a trajectory (DCD), per-frame structural features (HDF5),
      and a final-frame structure (PDB) for the current iteration.
    tasks:
      - "task:openmm"

  - stage_id: "stage:aggregation"
    name: "Data Aggregation"
    order: 2
    description: |
      Consolidates HDF5 files from the most recent N MD simulation tasks into a
      single aggregated HDF5 file for downstream ML training. Applies center-of-mass
      normalization to point clouds. May be skipped via configuration flag.
    tasks:
      - "task:aggregate"

  - stage_id: "stage:training"
    name: "Machine Learning Model Training"
    order: 3
    description: |
      Trains an adversarial autoencoder (AAE3d or Keras CVAE) on the aggregated
      structural data to learn a latent representation of protein conformations.
      Runs every retrain_freq iterations; otherwise, the model selection stage
      retrieves the previous iteration's trained model.
    tasks:
      - "task:train_aae"

  - stage_id: "stage:model_selection"
    name: "Model Selection"
    order: 4
    description: |
      Selects the best trained model checkpoint for use by the agent stage.
      When training runs, finds the latest epoch checkpoint; otherwise, retrieves
      the previous iteration's model selection result.
    tasks:
      - "task:select_model"

  - stage_id: "stage:agent"
    name: "Outlier Detection Agent"
    order: 5
    description: |
      Generates latent-space embeddings for all recent MD frames using the trained
      encoder, applies Local Outlier Factor (LOF) or DBSCAN to identify structurally
      novel (outlier) conformations, and writes a JSON file specifying which trajectory
      frames will seed the next MD iteration.
    tasks:
      - "task:lof_agent"


# ------------------------------------------------------------
# SECTION B: TASK CATALOG
# ------------------------------------------------------------

tasks:
  - task_id: "task:openmm"
    name: "OpenMM Molecular Dynamics Simulation"
    stage: "stage:simulation"
    executable: "deepdrivemd/sim/openmm/run_openmm.py"
    description: |
      Runs an OpenMM-based molecular dynamics simulation of a protein system using a
      Langevin integrator. On the first iteration it reads a PDB structure from the
      initial_pdb_dir; on subsequent iterations it extracts a specific frame from a
      prior trajectory (identified by the agent's outlier JSON) as the starting
      structure. Produces per-frame contact maps, point clouds, RMSD, and FNC values
      written to an HDF5 file, a DCD trajectory file, and a final-frame PDB file.
    behavioral_notes: |
      Each instance writes one HDF5 file and one DCD file at task completion (not
      streamed). HDF5 datasets are written with per-frame chunking (chunk shape
      [1, N_atoms, ...]), which allows frame-by-frame incremental writes during
      simulation. Contact map computation is O(N_atoms^2) per frame. Point cloud
      extraction uses only CA (alpha-carbon) atoms. In in_memory=True mode all
      frame data are accumulated in RAM before final HDF5 flush; in in_memory=False
      mode frames are appended incrementally. DCD frames are written at report_interval_ps
      cadence. Simulation log written continuously to .log file.
    parallelism_model:
      type: "embarrassingly_parallel"
      description: |
        Each instance simulates an independent protein trajectory from a different
        starting structure. Instances share no data and communicate only through
        the shared filesystem via their output files. Instance count is determined
        by num_tasks in the MD stage configuration.
    io_dominance: "balanced"
    output_class: "intermediate"
    # [ASSUMPTION] DCD and H5 files from MD may have scientific value as trajectories,
    # but within the workflow they primarily serve as inputs for aggregation and agent.
    # Marked intermediate pending scientist confirmation.
    inputs:
      - "data:experiment_config"
      - "data:initial_pdb_files"
      - "data:outlier_json"
    outputs:
      - "data:md_trajectory_h5"
      - "data:md_trajectory_dcd"
      - "data:md_structure_pdb"

  - task_id: "task:aggregate"
    name: "HDF5 Aggregation"
    stage: "stage:aggregation"
    executable: "deepdrivemd/aggregation/basic/aggregate.py"
    description: |
      Reads the last N HDF5 files produced by the MD simulation stage and
      concatenates the point_cloud, contact_map, rmsd, and fnc datasets into a
      single aggregated HDF5 file. Applies center-of-mass subtraction to normalize
      point cloud coordinates. Validates each input dataset for NaN values and skips
      corrupted frames. The aggregated file is the primary training input for the
      ML model.
    behavioral_notes: |
      Opens each source HDF5 file sequentially. Loads selected datasets (point_cloud,
      contact_map, rmsd, fnc) into in-memory Python lists, then calls np.concatenate()
      to merge. The entire aggregated dataset is written in one flush. Output datasets
      are chunked with chunk shape (1, N_atoms, ...) matching the source files.
      Single-threaded serial execution; no MPI. NaN-filtering can reduce output size
      relative to sum of input sizes.
    parallelism_model:
      type: "serial"
      description: |
        Single task that aggregates all simulation outputs from the current and
        optionally previous iterations. No inter-task communication.
    io_dominance: "io_bound"
    output_class: "intermediate"
    inputs:
      - "data:md_trajectory_h5"
    outputs:
      - "data:aggregated_h5"

  - task_id: "task:train_aae"
    name: "Adversarial Autoencoder Training"
    stage: "stage:training"
    executable: "deepdrivemd/models/aae/train.py"
    description: |
      Trains an adversarial autoencoder (AAE3d) or Keras CVAE on aggregated protein
      structural data to learn a compressed latent representation of molecular
      conformations. The encoder maps point clouds or contact maps into a latent
      vector; the generator reconstructs point clouds from latent codes; the
      discriminator distinguishes real from generated latent codes (adversarial
      training). Produces encoder, generator, and discriminator weight files plus
      per-epoch checkpoint files used for model selection and inference.
    behavioral_notes: |
      Uses h5py.VirtualLayout to lazily concatenate the last N HDF5 files without
      physically copying data (via virtual-h5 metadata JSON). Training data is
      sharded across MPI ranks using a custom PointCloudDataset and PyTorch
      DistributedDataParallel (DDP). Each rank performs a forward pass on its shard;
      gradients are synchronized via all-reduce across ranks. Checkpoint callbacks
      save per-epoch weight snapshots to a checkpoint/ subdirectory. Rank 0 writes
      final weight files (encoder-weights.pt, generator-weights.pt,
      discriminator-weights.pt), loss history (loss.json), and embedding snapshots
      (embeddings/*.npy). Reads aggregated HDF5 dataset in mini-batches
      (batch_size=32 default); never loads the full dataset into RAM simultaneously.
      Optional warm-start reads encoder weights from previous iteration's selected
      model to initialize training.
    parallelism_model:
      type: "data_parallel"
      description: |
        Training dataset is sharded across MPI ranks using PyTorch
        DistributedDataParallel (DDP). Each rank holds a local shard of the dataset
        and synchronizes gradients with all-reduce at each training step. All ranks
        operate on the same model architecture; rank 0 saves final outputs.
    io_dominance: "compute_bound"
    output_class: "checkpoint"
    # [ASSUMPTION] Trained model weights are scientifically valuable (define the
    # learned conformational landscape representation). Marked checkpoint.
    inputs:
      - "data:aggregated_h5"
      - "data:model_selection_json"
      - "data:ml_model_weights"
    outputs:
      - "data:ml_model_weights"

  - task_id: "task:select_model"
    name: "Model Selection"
    stage: "stage:model_selection"
    executable: "deepdrivemd/selection/latest/select_model.py"
    description: |
      Identifies the best trained model checkpoint for use by the agent. When the
      current iteration index is divisible by retrain_freq (i.e., training ran this
      iteration), it scans the ML output directory for the latest epoch checkpoint
      (highest epoch number with the configured suffix). Otherwise it reads the
      model_selection JSON from the previous iteration to reuse the existing model.
      Writes a JSON file listing the path to the selected encoder weights and model
      config for consumption by the agent task.
    behavioral_notes: |
      Performs directory listing of the ML checkpoint directory (os.listdir or glob).
      Reads at most one previous JSON file (if skipping training). Writes a small
      JSON file (< 1 KB) listing selected model paths. Entirely CPU-bound and I/O-
      minimal. No model loading or inference at this stage.
    parallelism_model:
      type: "serial"
      description: |
        Single task that scans checkpoint files and writes a JSON result. No
        parallel execution or inter-task communication.
    io_dominance: "io_bound"
    output_class: "intermediate"
    inputs:
      - "data:ml_model_weights"
    outputs:
      - "data:model_selection_json"

  - task_id: "task:lof_agent"
    name: "LOF Outlier Detection Agent"
    stage: "stage:agent"
    executable: "deepdrivemd/agents/lof/lof.py"
    description: |
      Generates latent-space embeddings for all recent MD simulation frames using the
      trained encoder model (via GPU-accelerated inference), then applies Local
      Outlier Factor (LOF) or DBSCAN clustering to identify structurally novel
      (outlier) conformations in latent space. Optionally refines the outlier
      selection using extrinsic RMSD scores. Writes a JSON file specifying which
      trajectory frames (file path + frame index) will seed the next MD simulation
      iteration, closing the active-learning feedback loop.
    behavioral_notes: |
      Rank 0 creates a virtual HDF5 referencing the last N MD HDF5 files (point_cloud
      dataset only needed for inference). All ranks shard the virtual HDF5 dataset
      via a DataLoader (batch_size=128), run encoder.encode() on their shard, then
      all-gather embeddings to rank 0. Rank 0 runs sklearn.LocalOutlierFactor on
      the full embedding matrix (in-memory), selects top-K outliers, optionally
      filters by RMSD scores from the aggregated HDF5. Maps outlier indices back to
      source MD files and frame numbers (using arithmetic: outlier_ind = file_idx *
      n_frames + frame). Writes one JSON file listing outlier metadata (structure
      file path, trajectory file path, frame index, intrinsic and extrinsic scores).
      DCD and PDB files from MD are accessed at output write time (not during
      inference); the DCD files are referenced by path in JSON but NOT opened
      by the agent — the next MD task will open them.
    parallelism_model:
      type: "data_parallel"
      description: |
        Embedding generation is distributed across MPI ranks; each rank processes
        a shard of the virtual HDF5 dataset. Outlier detection (LOF) runs on
        rank 0 only using the gathered full embedding matrix.
    io_dominance: "balanced"
    output_class: "intermediate"
    inputs:
      - "data:md_trajectory_h5"
      - "data:md_trajectory_dcd"
      - "data:md_structure_pdb"
      - "data:model_selection_json"
      - "data:ml_model_weights"
    outputs:
      - "data:outlier_json"


# ------------------------------------------------------------
# SECTION C: DATA OBJECT REGISTRY
# ------------------------------------------------------------

data_objects:

  - data_id: "data:experiment_config"
    name: "Experiment Master Configuration"
    description: |
      YAML configuration file specifying all workflow parameters: resource settings,
      max_iteration count, experiment directory path, and per-stage configuration
      blocks (MD, aggregation, ML, model selection, agent). Controls the entire
      workflow execution including parallelism counts, iteration bounds, and
      per-task hyperparameters.
    category: "config"
    persistence: "persistent"
    format_hint:
