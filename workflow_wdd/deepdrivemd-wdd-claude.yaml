        input is always present in practice.
    - field_path: "data_objects[data:md_trajectory_h5].format_hint.typical_request_size_kb"
      reason: |
        HDF5 chunk size determines typical I/O request size. Chunk shape is
        [1, N_CA_atoms, ...]; actual KB value depends on N_CA_atoms which is
        protein-system-dependent and not statically determinable.

  round_trip_gaps:
