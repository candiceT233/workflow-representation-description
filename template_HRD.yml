# =============================================================================
# WIDGET — Hardware Resource Document (HRD) Agent Template
# Schema: hrd-4.0  |  Architecture Design: v4
#
# PURPOSE
# The HRD describes the physical hardware on which a deployment executes —
# what the system provides, independent of how any workflow uses it.
# It defines the physical envelope within which DDD decisions must operate:
#   - tier_ids referenced in storage tier assignments
#   - compute_ids referenced in per-task parallelism decisions
#   - bandwidth ceilings used in DDD feasibility checks
#   - contention models used to evaluate shared-tier risk
#
# WHO FILLS THIS DOCUMENT
# The HRD is authored once per system by HPC facility staff or a system
# administrator, not per workflow or per run. It should be maintained as
# a shared resource for all WIDGETs running on that system.
#
# The agent's role is to:
#   1. Prompt the sysadmin/facility contact for each required field
#   2. Run benchmark tools (IOR, mdtest, OSU) to populate empirical fields
#   3. Populate derived fields automatically
#   4. Flag any required_benchmark fields that are still null before DDD use
#
# FIELD STATUS LEGEND
#   required_sysadmin     System documentation or facility staff can provide.
#                         Agent prompts if missing. DDD cannot be generated
#                         without these fields.
#
#   required_benchmark    Must come from empirical measurement (IOR, mdtest,
#                         OSU micro-benchmarks, or equivalent). Vendor specs
#                         are acceptable as initial estimates but should be
#                         replaced. Agent flags if only vendor spec is present.
#
#   optional_benchmark    Useful for diagnosis quality but not required for
#                         DDD generation. Agent prompts once; proceeds if
#                         measurement is unavailable.
#
#   auto_derived          Agent computes from other fields in this document.
#
# AGENT READINESS GATE
# Before handing this HRD to the DDD generator, verify:
#   [ ] All header fields non-null
#   [ ] At least one compute topology entry with compute_id
#   [ ] At least one network fabric entry with interconnect_id
#   [ ] At least one storage tier entry with tier_id, tier_type, persistence,
#       shared_across_jobs, and contention_model
#   [ ] All required_benchmark fields have values (even if flagged as vendor
#       spec estimates)
#   [ ] All tier_ids follow the tier:<n> naming convention
#   [ ] All compute_ids follow the compute:<n> naming convention
#   [ ] All interconnect_ids follow the net:<n> naming convention
#
# ID NAMESPACE
#   Storage tiers:    tier:<n>       e.g.  tier:burst_buffer, tier:pfs
#   Compute classes:  compute:<n>    e.g.  compute:cpu_node, compute:gpu_node
#   Network fabric:   net:<n>        e.g.  net:slingshot, net:infiniband_hdr
# =============================================================================


# -----------------------------------------------------------------------------
# SECTION 1: HEADER
# -----------------------------------------------------------------------------
header:

  hrd_id:
    _status: required_sysadmin
    _prompt: >
      I will assign an HRD identifier. What is the short name of this system?
      (e.g., "perlmutter_nersc", "frontier_olcf", "stampede3_tacc")
      I will form: hrd:<system_short_name>
    _format: "hrd:<system_short_name>"
    _value: null

  system_name:
    _status: required_sysadmin
    _prompt: >
      What is the full human-readable name of this system?
      (e.g., "Perlmutter @ NERSC", "Frontier @ OLCF", "Stampede3 @ TACC")
    _value: null

  version:
    _status: required_sysadmin
    _prompt: >
      What version is this HRD? Use "1.0.0" for initial documentation.
      Increment when hardware configuration changes (node additions,
      firmware upgrades, filesystem reconfiguration, new storage tier added).
    _value: null

  version_notes:
    _status: required_sysadmin
    _prompt: >
      What does this HRD version document? For first version: "Initial
      documentation of <system_name>". For updates: describe what changed.
    _value: null

  facility:
    _status: required_sysadmin
    _prompt: >
      What facility or institution operates this system?
      (e.g., "NERSC / Lawrence Berkeley National Laboratory")
    _value: null

  schema_version:
    _status: auto_derived
    _value: "hrd-4.0"

  created_at:
    _status: auto_derived
    _value: null

  last_modified_at:
    _status: auto_derived
    _value: null

  description:
    _status: required_sysadmin
    _prompt: >
      Please provide a 2-4 sentence architectural summary of this system.
      Include: primary compute architecture, storage hierarchy overview,
      and any notable performance characteristics.
      (e.g., "Perlmutter is a CPU+GPU hybrid system at NERSC. Compute nodes
      are AMD EPYC CPU-only and NVIDIA A100 GPU nodes. Storage consists of
      node-local NVMe SSD, a Lustre parallel filesystem at 5 TB/s aggregate
      bandwidth, and HPSS tape archive.")
    _value: null


# -----------------------------------------------------------------------------
# SECTION 2: COMPUTE TOPOLOGY
# One entry per distinct node class. Agent populates as a list.
# -----------------------------------------------------------------------------
compute_topology:
  # Prompt: "How many distinct node types does this system have?
  # For each type, I will ask for the specs below."

  _node_class_schema:

    compute_id:
      _status: required_sysadmin
      _prompt: >
        What short identifier should I use for this node class?
        Format: compute:<descriptor>
        Examples: compute:cpu_node, compute:gpu_node, compute:large_memory_node
      _format: "compute:<descriptor>"
      _value: null

    node_type_description:
      _status: required_sysadmin
      _prompt: >
        Brief human-readable description of this node class.
        (e.g., "Standard CPU compute node", "GPU-accelerated node with 4x A100")
      _value: null

    node_count:
      _status: required_sysadmin
      _prompt: >
        How many nodes of this class are available in total on the system?
      _value: null

    cores_per_node:
      _status: required_sysadmin
      _prompt: How many physical CPU cores per node of this class?
      _value: null

    hardware_threads_per_core:
      _status: required_sysadmin
      _prompt: >
        How many hardware threads (hyperthreads / SMT) per physical core?
        (Typically 1 or 2. Set to 1 if hyperthreading is disabled.)
      _value: null

    memory_per_node_gb:
      _status: required_sysadmin
      _prompt: How many GB of DRAM per node?
      _value: null

    memory_bandwidth_gbs:
      _status: required_benchmark
      _prompt: >
        What is the peak memory bandwidth per node in GB/s?
        Vendor spec is acceptable as initial estimate; empirical STREAM
        benchmark value preferred. Please note which source this is.
      _benchmark_tool_hint: "STREAM benchmark (stream_c)"
      _value: null
      _value_source: null    # "vendor_spec" | "stream_benchmark" | "other"

    accelerators:
      _status: required_sysadmin
      _prompt: >
        Does this node class have accelerators (GPUs, FPGAs)?
        If yes, provide a list. Each entry: {type, count, memory_gb}
        Example: [{type: "NVIDIA A100 80GB SXM4", count: 4, memory_gb: 80}]
        If no accelerators, set to null.
      _value: null

    interconnect_id:
      _status: required_sysadmin
      _prompt: >
        Which network fabric entry (from Section 3) do nodes of this class
        connect to? Provide the net:<n> identifier.
      _value: null


# -----------------------------------------------------------------------------
# SECTION 3: NETWORK FABRIC
# One entry per distinct interconnect. Agent populates as a list.
# -----------------------------------------------------------------------------
network_fabric:
  # Prompt: "Does the system have one network fabric, or multiple
  # (e.g., separate compute and storage networks)?"

  _fabric_schema:

    interconnect_id:
      _status: required_sysadmin
      _format: "net:<descriptor>"
      _prompt: >
        Short identifier for this fabric. Format: net:<descriptor>
        Examples: net:slingshot_11, net:infiniband_hdr, net:omnipath
      _value: null

    interconnect_type:
      _status: required_sysadmin
      _allowed_values: [InfiniBand, Slingshot, OmniPath, Ethernet, other]
      _value: null

    topology:
      _status: required_sysadmin
      _prompt: >
        What is the network topology?
      _allowed_values: [dragonfly, fat_tree, torus, mesh, other]
      _value: null

    bisection_bandwidth_gbs:
      _status: required_benchmark
      _prompt: >
        What is the bisection bandwidth in GB/s?
        Vendor spec or facility documentation acceptable.
      _value: null

    injection_bandwidth_per_node_gbs:
      _status: required_sysadmin
      _prompt: >
        What is the per-node injection bandwidth into the fabric in GB/s?
      _value: null

    latency_us:
      _status: required_benchmark
      _prompt: >
        What is the typical MPI point-to-point latency in microseconds?
        Empirical value from OSU micro-benchmarks preferred.
      _benchmark_tool_hint: "OSU micro-benchmarks: osu_latency"
      _value: null
      _value_source: null    # "vendor_spec" | "osu_benchmark" | "other"

    notes:
      _status: optional_benchmark
      _prompt: >
        Are there any known network bottlenecks, congestion behaviors, or
        performance quirks the DDD generator should know about?
        (e.g., "Dragonfly topology exhibits 2:1 oversubscription on
        inter-group links; all-to-all communications degrade significantly
        above 32 nodes per group.")
      _value: null


# -----------------------------------------------------------------------------
# SECTION 4: STORAGE HIERARCHY
# One entry per storage tier. These tier_ids are referenced throughout
# the DDD and IODD. Critical: assign stable tier_ids that will not change
# when the HRD is versioned.
# -----------------------------------------------------------------------------
storage_hierarchy:
  # Prompt: "Please list all storage tiers available to jobs on this system.
  # For each tier I will collect specs, bandwidth, and contention behavior."
  # Common tiers to ask about:
  #   - Node-local SSD or NVMe (if present)
  #   - Burst buffer / flash storage tier (if present)
  #   - Parallel filesystem (Lustre, GPFS, DAOS, BeeGFS)
  #   - Object store (if present, e.g., S3-compatible)
  #   - Archive / tape (HPSS)

  _tier_schema:

    tier_id:
      _status: required_sysadmin
      _format: "tier:<descriptor>"
      _prompt: >
        Short identifier for this storage tier. Format: tier:<descriptor>
        Examples: tier:node_ssd, tier:burst_buffer, tier:pfs, tier:object_store,
                  tier:archive, tier:in_memory
      _value: null

    tier_name:
      _status: required_sysadmin
      _prompt: Human-readable tier name (e.g., "Lustre scratch", "DataWarp BB", "Vast NVMe")
      _value: null

    tier_type:
      _status: required_sysadmin
      _allowed_values:
        - node_local_ssd
        - node_local_hdd
        - burst_buffer
        - parallel_filesystem
        - object_store
        - in_memory
        - archive
      _value: null

    filesystem_type:
      _status: optional_benchmark
      _prompt: >
        What filesystem software manages this tier?
        (e.g., Lustre, GPFS/SpectrumScale, DAOS, BeeGFS, WekaFS, VAST, HPSS)
      _value: null

    total_capacity_tb:
      _status: required_sysadmin
      _prompt: Total capacity of this tier in TB (across the whole system).
      _value: null

    per_job_capacity_tb:
      _status: required_sysadmin
      _prompt: >
        How much capacity can a single job allocate on this tier in TB?
        (May differ from total for shared tiers. Set equal to total if
        the entire tier is typically available to one job.)
      _value: null

    peak_read_bandwidth_gbs:
      _status: required_benchmark
      _prompt: >
        Peak read bandwidth for this tier in GB/s.
        Empirical IOR measurement strongly preferred over vendor spec.
        Note the measurement conditions (stripe count, transfer size, etc.)
      _benchmark_tool_hint: "IOR: ior -a POSIX -b 1g -t 1m -s 64 -F -C -e"
      _value: null
      _value_source: null    # "ior_benchmark" | "vendor_spec" | "facility_doc"

    peak_write_bandwidth_gbs:
      _status: required_benchmark
      _prompt: >
        Peak write bandwidth for this tier in GB/s (empirical IOR preferred).
      _value: null
      _value_source: null

    metadata_ops_per_sec:
      _status: required_benchmark
      _prompt: >
        Peak metadata operation rate in ops/sec (creates, opens, stats combined).
        mdtest benchmark preferred.
      _benchmark_tool_hint: "mdtest: mdtest -n 100000 -i 3 -d <mountpoint>"
      _value: null
      _value_source: null    # "mdtest_benchmark" | "vendor_spec" | "facility_doc"

    access_latency_us:
      _status: required_benchmark
      _prompt: >
        Typical access latency for a single small I/O operation on this tier
        in microseconds. (Distinguish from network latency — this is the
        storage device access latency.)
      _value: null
      _value_source: null

    persistence:
      _status: required_sysadmin
      _prompt: >
        Does data on this tier survive across jobs?
        volatile:         data is automatically deleted at job end
        persistent:       data survives indefinitely until explicitly deleted
        semi_persistent:  configurable retention (e.g., 30-day scratch policy)
      _allowed_values: [volatile, persistent, semi_persistent]
      _value: null

    retention_policy_notes:
      _status: required_sysadmin
      _required_when: persistence == semi_persistent
      _prompt: >
        What is the retention policy for this tier?
        (e.g., "Files older than 30 days are purged automatically.")
      _value: null

    shared_across_jobs:
      _status: required_sysadmin
      _prompt: >
        Is this tier shared across concurrently running jobs?
        (true = multiple jobs read/write simultaneously, contention possible.
         false = each job gets dedicated access, e.g., node-local SSD.)
      _value: null    # boolean

    contention_model:
      _status: required_sysadmin
      _prompt: >
        How does this tier's performance degrade under concurrent multi-job load?

      contention_type:
        _status: required_sysadmin
        _prompt: >
          Which best describes the contention behavior of this tier?
          none:          dedicated tier, no contention possible
          proportional:  bandwidth scales linearly down with more concurrent jobs
          saturating:    performance is near-peak until a threshold, then
                         degrades sharply (common with burst buffers)
          unknown:       behavior not characterized
        _allowed_values: [none, proportional, saturating, unknown]
        _value: null

      saturation_threshold_jobs:
        _status: optional_benchmark
        _required_when: contention_type == saturating
        _prompt: >
          Above how many concurrent jobs does performance degrade sharply?
        _value: null

      degradation_factor:
        _status: required_benchmark
        _required_when: contention_type != none
        _prompt: >
          Under typical contention load, what fraction of peak bandwidth
          is available? (e.g., 0.4 means 40% of peak is available.
          Empirical measurement preferred — run IOR during a busy period.)
        _value: null

      qos_guarantees:
        _status: required_sysadmin
        _prompt: >
          Does this tier offer per-job QoS bandwidth guarantees?
          (true = yes, bandwidth floor guaranteed per job.
           false = best-effort only, no guarantees.)
        _value: null    # boolean

    notes:
      _status: optional_benchmark
      _prompt: >
        Are there any known performance quirks, limitations, or best practices
        for this storage tier?
        (e.g., "Lustre stripe count must be >= 4 for sustained bandwidth above
        10 GB/s per client. Default stripe count of 1 limits single-file
        write to ~2 GB/s.")
      _value: null

    benchmark_source:
      _status: required_benchmark
      _prompt: >
        What is the source and date of the bandwidth and latency measurements
        above? (e.g., "IOR benchmark run by NERSC staff, 2024-09-15, Cori
        scratch FS during light load, 8 nodes, 64 processes")
      _value: null


# -----------------------------------------------------------------------------
# SECTION 5: EMPIRICAL BENCHMARKS
# Additional measurements not captured by per-tier or per-fabric fields.
# One entry per measurement. Populated by sysadmin or benchmark runs.
# -----------------------------------------------------------------------------
empirical_benchmarks:
  # Prompt: "Are there any additional performance characteristics of this
  # system that I should know about beyond what we've already documented?
  # For example: known hot-spot behaviors, stripe tuning recommendations,
  # specific benchmark results that differ from vendor specs, or known
  # bottlenecks under specific access patterns."

  _measurement_schema:

    measurement_id:
      _status: required_sysadmin
      _format: "bench:<system_short>:<descriptor>"
      _value: null

    measurement_type:
      _status: required_sysadmin
      _allowed_values:
        - io_bandwidth
        - metadata_rate
        - network_latency
        - memory_bandwidth
        - io_latency
        - other
      _value: null

    tier_or_component:
      _status: required_sysadmin
      _prompt: >
        Which tier_id, interconnect_id, or compute_id does this measurement
        characterize?
      _value: null

    measured_value:
      _status: required_benchmark
      _value: null

    unit:
      _status: required_sysadmin
      _value: null

    conditions:
      _status: required_sysadmin
      _prompt: >
        Describe the conditions under which this measurement was taken.
        (e.g., "8 nodes, 256 MPI ranks, 1 MiB transfer size, shared filesystem
        under light concurrent load, no stripe tuning")
      _value: null

    benchmark_tool:
      _status: required_sysadmin
      _allowed_values: [IOR, mdtest, OSU_micro_benchmarks, STREAM, custom, other]
      _value: null

    measured_at:
      _status: required_sysadmin
      _prompt: Date of measurement (YYYY-MM-DD).
      _value: null

    notes:
      _status: optional_benchmark
      _prompt: >
        Any caveats, anomalies, or interpretation notes for this measurement?
      _value: null